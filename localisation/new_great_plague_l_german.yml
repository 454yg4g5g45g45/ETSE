l_german:
 great_plague.3.b: "Stelle unter Quarantäne der Provinz."
 great_plague.9.t: "Die Bauern erforden mehr Geld"
 great_plague.9.d: "Mit so vielen Leuten tot hat die Arbeiterknappheit kritisch werden. Die Arbeiterklasse fragt für niedrigere Steuern, mehr Geld und mehr Landrecht."
 great_plague.9.a: "Geben mehr Recht."
 great_plague.9.b: "Geben Finanzhilfe."
 great_plague.9.c: "Verwerfen ihren Forderungen."
 great_plague_faith_crisis_modifier: "Glaubenkrise"
 great_plague.13.t: "Die Glaubenkrise"
 great_plague.13.d: "Die Große Seuche hat viel Angst und Panik in deine Leute gemacht. Viele Leute sehen die Seuche als heilige Strafe. Viele Menschen verlassen den Glauben, und Man tadelt die Glaubenminderheiten für die Seuche verbreiten."
 great_plague.13.a: "Das ist unglücklich."
 great_plague.13.b: "Versuchen die Kluft zu heilen."
 cb_plague_vengeance: "Pestträger"
 cb_plague_vengeance_desc: "Sie haben unser Volk infiziert!"
 GREAT_PLAGUE_BOOKMARK: "Die Große Seuche"
 GREAT_PLAGUE_BOOKMARK_DESC: "Im Jahr 1346 beginnt sich eine tödliche Seuche durch die bekannte Welt auszubreiten und vernichtet ganze Bevölkerungen mit erschreckender Geschwindigkeit. Die Große Seuche breitet sich über Handelsrouten aus und dezimiert die einst blühenden Städte Europas, des Nahen Ostens und Asiens. Gesellschaften brechen unter der Last massiver Todeszahlen, Arbeitskräftemangel und weitverbreiteter Panik zusammen. Alte Rivalitäten werden beiseitegelegt, während Könige und Kaiser mit der beispiellosen Verwüstung ringen, während einige inmitten des Chaos die Gelegenheit sehen, ihren Einfluss auszuweiten oder ihre geschwächten Nachbarn herauszufordern. Inmitten des Aufruhrs wird der Glaube auf die Probe gestellt, neue Ideologien entstehen, und das Machtgefüge verschiebt sich unwiderruflich.""