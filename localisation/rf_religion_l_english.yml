l_english:
 #Religion Group
 reformed_hellenic:0 "Roman Pantheon"

 #Decision - Reform the Empire
 reform_hellenic_faith_decision_title:0 "Codify the State Religion"
 reform_hellenic_faith_decision_desc:0 "The Galilean superstition is spreading like a plague through our provinces, exploiting the disorganized nature of our ancient traditions. The old ways, decentralized, local, and tolerant, are no longer sufficient to combat this fanatical monotheism. \n\nTo save the Empire, we must fight fire with fire. We must convene the High Collegium, standardize the liturgy, and forge the Hellenic faith into a unified, militant structure capable of crushing the Christian threat once and for all."

 # --- EVENT 1: The Great Council of Rome (The Main Choice) ---
 hellenic_reform.1.t:0 "The Council of Rome"
 hellenic_reform.1.d:0 "The High Collegium has convened within the Temple of Jupiter Optimus Maximus. The mood is grave. For too long, our ancient traditions have been local, disorganized, and vulnerable to the militant zeal of the Galileans. To save the Empire, we must harden our faith into a single, unbreakable structure.\n\nThe Council has presented three paths for the Reformation. The Traditionalists argue for a revitalized Pantheon, flexible enough to govern a complex world. The Generals demand we adopt Sol Invictus, a soldier's faith of absolute loyalty and zeal. The Centralists argue that the only thing holding the Empire together is the State itself, and thus we must worship it and its rulers as the living embodiment of the Divine."
 
 hellenic_reform.1.a:0 "Restore the Collegium. The Olympians shall guide us!"
 hellenic_reform.1.b:0 "One Empire, One Sun! Sol Invictus commands us!"
 hellenic_reform.1.c:0 "The State is Divine! Rome is Eternal!"

 # --- EVENT 2: The Olympian Reformation (For other nations) ---
 hellenic_reform.2.t:0 "Rome Restores the Pantheon"
 hellenic_reform.2.d:0 "Messengers have arrived from the Eternal City bearing the seal of the Pontifex Maximus. The Roman Empire has formally reformed the Hellenic faith, establishing a strict new hierarchy centered on the Olympian Pantheon. They call upon all faithful nations to adopt the new rites, standardizing the worship of Jupiter and the Olympians to combat the spread of foreign monotheism. To refuse is to isolate ourselves from the spiritual heart of the civilized world."
 
 hellenic_reform.2.a:0 "We shall adopt the Roman Rites."
 hellenic_reform.2.b:0 "Our local traditions serve us better."

 # --- EVENT 3: The Solar Reformation (For other nations) ---
 hellenic_reform.3.t:0 "The Rise of Sol Invictus"
 hellenic_reform.3.d:0 "A decree has arrived from Rome: 'There is but one Sun in the heavens, and one Imperator on Earth.' The Roman Empire has cast aside the confused multitude of old idols in favor of Sol Invictus, the Unconquered Sun. This new faith is militant, zealous, and demands absolute submission to the Light. Rome expects its allies and subjects to kneel before the rising sun or be left in the darkness."
 
 hellenic_reform.3.a:0 "Praise the Sun! We accept the light."
 hellenic_reform.3.b:0 "We will not abandon our ancestors for this soldier's cult."

 # --- EVENT 4: The Imperial Reformation (For other nations) ---
 hellenic_reform.4.t:0 "The Imperial Divinity"
 hellenic_reform.4.d:0 "The news from Rome is shocking. The Senate and the Collegium have declared that the divine spirit of the State resides within the Divi themselves. The Imperial Cult is no longer a mere formality; it is now the supreme religion of the Empire. Rome demands that we acknowledge its Head of State not merely as a ruler, but as the final authority on everything divine. Refusing this 'gift' may be seen as treason."
 
 hellenic_reform.4.a:0 "We bow to the Supreme Magistrate."
 hellenic_reform.4.b:0 "No man knows the will of the Gods. This is madness."
 
 # --- Pontifex Maximus (Restored Polytheism) ---
 pontifex_maximus:0 "Olympianism"
 pontifex_maximus_religion_desc:0 "For centuries, the favor of the gods ensured Rome's dominance over the known world. By restoring the authority of the Pontifex Maximus and the Collegium Pontificum, we have rejected the foreign superstitions that weakened our spirit. We return to the Pax Deorum, the Peace of the Gods. Through the correct performance of ancient rites and the veneration of the Capitoline Triad, the state ensures that Jupiter, Mars, and Minerva once again march with our legions and bless our harvest."
 # --- Sol Invictus (The Unconquered Sun) ---
 sol_invictus:0 "Sol Invictus"
 sol_invictus_religion_desc:0 "The sun rises in the East and sets in the West, yet it is the same fire that warms the entire Empire. Sol Invictus, the Unconquered Sun, is the supreme deity who governs the cosmos. He is the patron of soldiers and the guarantor of victory. While other gods may exist, they are but pale reflections of the Sun's radiance. Under the solar crown, we shall purge the darkness of heresy and unite the four corners of the world under one blinding truth: One Empire, One Rome, One Sun."
 # --- Imperial Cult (Deified Emperor) ---
 zz_imperial_cult:0 "Imperial Cult"
 zz_imperial_cult_religion_desc:0 "In an Empire spanning three continents and a thousand cultures, there can be only one unifying force: the State itself. The Imperial Cult asserts that the ruler is not merely a man, but the living manifestation of the divine will, the Numen Augusti. To serve the state is an act of worship; to rebel is an act of blasphemy. By venerating our very own institutions and ruler, and the spirits of the Divi who came before him, we ensure that loyalty to Rome is synonymous with religious devotion."
 
 #OLYMPIANISM - PONTIFEX MAXIMUS STUFF

 # --- Mechanic Headers ---
 pontifex_maximus:0 "Olympianism"
 OLYMPIAN_ASPECTS_NAME:0 "Olympian Deities"
 OLYMPIAN_ASPECTS_NAME_LONG:0 "Deity"
 OLYMPIAN_ASPECTS_NAME_SHORT:0 "Deity"
 OLYMPIAN_ASPECTS_NAME_POWER_NAME:0 "Pontifical Authority"
 OLYMPIAN_ASPECTS_NAME_desc:0 "Select a new Deity to worship."
 OLYMPIAN_CHURCH_NAME:0 "Pantheon of [Root.GetName]"
 PONTIFICAL_AUTHORITY_DESC:0 "The Pontifex Maximus gathers authority by managing the state rites, allowing for the consecration of new temples to specific gods to suit the needs of the Empire."

 # --- Aspect 1: Jupiter (-3% All Power Cost) ---
 olympian_jupiter:0 "Jupiter"
 desc_olympian_jupiter:0 "Jupiter Optimus Maximus grants us the divine spark of mastery. Under his gaze, the state acts with absolute efficiency, reducing the effort required to enforce our will in administration, diplomacy, and war."

 # --- Aspect 2: Juno (-15% Advisor Cost) ---
 olympian_juno:0 "Juno"
 desc_olympian_juno:0 "Juno Moneta, the divine counselor, guides the whispers in our court. She attracts the wisest minds to our cause, ensuring that the best advice is given for a fraction of the cost."

 # --- Aspect 3: Minerva (-10% Idea Cost) ---
 olympian_minerva:0 "Minerva"
 desc_olympian_minerva:0 "Minerva, born from the mind of Jupiter, blesses our intellectual pursuits. She inspires our thinkers to innovate, allowing us to adopt new traditions and ideas swifter than our rivals."

 # --- Aspect 4: Mars (+5% Discipline) ---
 olympian_mars:0 "Mars"
 desc_olympian_mars:0 "Mars Ultor demands perfection. He instills an iron discipline in the legions, ensuring that every soldier fights with the precision of a machine and the fury of a god."

 # --- Aspect 5: Diana (+15% Movement Speed) ---
 olympian_diana:0 "Diana"
 desc_olympian_diana:0 "Diana, swift Huntress, grants wings to our legions. Whether marching to intercept a foe or crossing vast distances, our armies move with the unnatural speed of the wild hunt."

 # --- Aspect 6: Vulcan (+10% Goods Produced) ---
 olympian_vulcan:0 "Vulcan"
 desc_olympian_vulcan:0 "Vulcan stokes the fires of our industry. From the smithy to the loom, his blessing ensures that every province produces a bounty of goods, fueling the wealth of the Empire."

 # --- Aspect 7: Mercury (+20% Trade Power) ---
 olympian_mercury:0 "Mercury"
 desc_olympian_mercury:0 "Mercury, the divine herald, secures our dominance over the markets. He guides our merchants to outmaneuver competitors, ensuring that the wealth of the world flows exclusively into Roman coffers."

 # --- Aspect 8: Ceres (-10% Dev Cost) ---
 olympian_ceres:0 "Ceres"
 desc_olympian_ceres:0 "Ceres blesses the very soil we build upon. With her favor, the lands flourish, and expanding our cities and infrastructure becomes a natural, bountiful endeavor."

 # --- Aspect 9: Apollo (+15% Manpower Recovery) ---
 olympian_apollo:0 "Apollo"
 desc_olympian_apollo:0 "Apollo Medicus brings healing to the weary. He banishes plague and tends to the wounded, ensuring that our depleted legions replenish their ranks with miraculous speed."

 # --- Aspect 10: Venus (+1 DipRep, +15% Improve Relations) ---
 olympian_venus:0 "Venus"
 desc_olympian_venus:0 "Venus Genetrix grants us an irresistible allure. Her grace softens the hearts of foreign courts, making our words sweeter and our diplomatic reputation spotless in the eyes of the world."

 # --- Aspect 11: Bacchus (-10% AE Impact) ---
 olympian_bacchus:0 "Bacchus"
 desc_olympian_bacchus:0 "Bacchus clouds the minds of our neighbors with wine and revelry. As we expand our borders, the world looks the other way, too distracted by celebration to form coalitions against us."
 
 # --- Aspect 12: Neptune (+10% Ship Durability, +1 Navy Tradition) ---
 olympian_neptune:0 "Neptune"
 desc_olympian_neptune:0 "Neptune strengthens the hulls of our triremes. Our ships ride the waves as if they were part of the sea itself, withstanding storms and enemy rams alike."

 # --- Aspect 13: Pluto (+15% Gov Capacity) ---
 olympian_pluto:0 "Pluto"
 desc_olympian_pluto:0 "Pluto, ruler of the vast and silent Underworld, teaches us the administration of the multitudes. His grim efficiency allows us to govern a sprawling empire without the bureaucracy collapsing under its own weight."

 # --- Aspect 14: Proserpina (+20% Defensiveness) ---
 olympian_proserpina:0 "Proserpina"
 desc_olympian_proserpina:0 "Proserpina, Queen of the Threshold, bars the gates against invaders. She imbues our fortifications with the chill of winter, making every siege against us a long, withering death for the enemy."
 
 #IMPERIAL CULT STUFF
 
 # --- The Icons ---
 
 # --- ICON 1: CAESAR (Expansion) ---
 icon_caesar:0 "Cult of Caesar"
 desc_icon_caesar:0 "We venerate Divus Iulius. I came, I saw, I conquered. The borders of the Empire shall ever expand, and no wall can withstand our siege engines."

 # --- ICON 2: ROMULUS (Manpower) ---
 icon_romulus:0 "Cult of Romulus"
 desc_icon_romulus:0 "We venerate the Founder. Just as he carved Rome from the hills, we shall ensure our legions are endless, filling the ranks with the sons of Mars."

 # --- ICON 3: CINCINNATUS (Discipline/Stability) ---
 icon_cincinnatus:0 "Cult of Cincinnatus"
 desc_icon_cincinnatus:0 "We venerate the Citizen-Soldier. The ruler serves the State. His virtue grants Iron Discipline to the army."

 # --- ICON 4: CICERO (Diplomacy) ---
 icon_cicero:0 "Cult of Cicero"
 desc_icon_cicero:0 "We venerate the Father of the Country. The tongue is mightier than the gladius; we shall bind the world to us through alliances and the majesty of Roman Law."

 # --- ICON 5: SENECA (Admin/Unrest) ---
 icon_seneca:0 "Cult of Seneca"
 desc_icon_seneca:0 "We venerate the Sage. Through Stoic wisdom and rational administration, we soothe the anger of the mob and build a society that endures the ages."
 
 # SOL INVICTUS STUFF
 # --- The 5 Aspects ---
 pick_sol_invictus_blessing:0 "Select Solar Aspect"
 sol_invictus_blessings:0 "Solar Aspects"
 
 sol_blessing_dawn:0 "The Dawn"
 desc_sol_blessing_dawn:0 "Like the rising sun in the East, our armies strike with renewed vigor."
 
 sol_blessing_noon:0 "The Zenith"
 desc_sol_blessing_noon:0 "The sun burns hottest at noon. Our industry and lands are most productive under its direct gaze."
 
 sol_blessing_dusk:0 "The Dusk"
 desc_sol_blessing_dusk:0 "As the sun sets in the West, we gather the wealth of the day."
 
 sol_blessing_midnight:0 "The Midnight Sun"
 desc_sol_blessing_midnight:0 "Even in the darkest corners of the North, the Sun's discipline is absolute."
 
 sol_blessing_eclipse:0 "Aspect of Living Light"
 desc_sol_blessing_eclipse:0 "The divine radiance of Ravenna illuminates the minds of our people and the steel of our soldiers. The Sun reveals all truths, enriching the empire with wisdom and gold."

 
 # --- Leptis Magna (The South / Zenith) ---
 HOLY_SITE_354_DESC:0 "Here in Africa, the Sun reaches its Zenith, burning with an intensity unmatched elsewhere. Leptis Magna stands as a monument to the scorching power of Sol, purging weakness from the spirit and hardening the resolve of the faithful."

 # --- London (The North / Midnight Sun) ---
 HOLY_SITE_236_DESC:0 "At the mist-shrouded edge of the known world, the light of Sol proves its reach knows no bounds. Londinium represents the Midnight Sun, a testament that even in the coldest darkness, the Emperor's discipline cannot be extinguished."

 # --- Lisbon (The West / Setting Sun) ---
 HOLY_SITE_227_DESC:0 "Standing at the westernmost edge of the continent, Olisipo watches the daily departure of the Solar Chariot into the vast Ocean. It is the Temple of the Setting Sun, reminding us that though the light may fade, its return is eternal and inevitable."

 # --- Ravenna (The City of Golden Light) ---
 HOLY_SITE_114_DESC:0 "Ravenna stands as the City of Living Light, a terrestrial reflection of the sun's glory. Its basilicas are ablaze with golden mosaics that capture the divine radiance, drawing scholars to study the cosmos and pilgrims to witness the majesty of Sol. Here, the legions gather to bless their standards, ensuring the light of civilization burns eternal."

 # --- Palmyra (The East / Rising Sun) ---
 HOLY_SITE_405_DESC:0 "From the sands of the East, the Sun first reveals its glory. Palmyra, the City of Palms, greets the Dawn before all others, symbolizing the eternal renewal of the Empire and the awakening of our martial strength."

 # --- Sol Invictus hols Rome as Capital ---
 sol_rome_axis_mundi:0 "Axis Mundi: The Eternal City"
 desc_sol_rome_axis_mundi:0 "Rome is the pivot upon which the world turns. By ruling from the converted Eternal City, our splendor is absolute. The Unconquered Sun smiles upon us as long as we hold Roma as our capital city"
 
 #but it comes with consequences...
 sol_invictus_lost_rome:0 "The Eclipse of Rome"
 desc_sol_invictus_lost_rome:0 "The Eternal City has fallen. The sacred fire is extinguished, and the Unconquered Sun has turned his face away from us. The legitimacy of our rule is shattered, and the provinces rise in panic."
 
