l_english:
 # --- Ancient & Early Medieval Infantry ---
 roman_western_ancient_infantry:0 "Legionary Cohort"
 roman_western_ancient_infantryDESCR:0 "As the eternal standard of the Empire, the Cohort has evolved but never broken. While the lorica segmentata has been reinforced with improved metallurgy, the discipline remains unchanged. These men are citizens first, soldiers second, drilled to fight as a single organism that crushes the disorganized mobs of the barbarian frontiers."

 roman_migration_period_spearmen_w:0 "Limitanei Spearmen"
 roman_migration_period_spearmen_wDESCR:0 "Stationed along the vast Limes from the Rhine to the Danube, these soldier-farmers are the first line of defense. Though often mocked by the field armies for their rustic equipment, it is their wall of spears that buys the Empire time to mobilize the legions. They fight not for gold, but for the very soil they till."

 roman_migration_period_axemen_w:0 "Foederati Axemen"
 roman_migration_period_axemen_wDESCR:0 "The integration of the northern tribes brought with it the brutal effectiveness of the heavy war-axe. Recruited from the pacified tribes of Germania and Scandia, these shock troops have traded their furs for Roman tunics, but they refuse to give up the weapon of their ancestors, using it to shatter shields in the Emperor's name."

 roman_frankish_infantry:0 "Gallic Warbands"
 roman_frankish_infantryDESCR:0 "The province of Gallia has always possessed a martial spirit that rivals Rome itself. Organized into local militias under the command of Romanized tribal nobility, these warbands combine the impetuous fury of the Celts with the tactical flexibility of the cohort system."

 roman_germanic_infantry:0 "Germanic Auxilia"
 roman_germanic_infantryDESCR:0 "Tall, broad-shouldered, and terrifying in battle, the Germanic Auxilia are the hammer of the northern legions. Once the Empire's greatest threat, they are now its most loyal dogs of war, sworn by blood-oath to the Emperor. They favor offensive tactics that utilize their immense physical strength."

 roman_gothic_infantry:0 "Gothic Foederati"
 roman_gothic_infantryDESCR:0 "After the treaty of integration, the Goths were granted lands in the Balkans in exchange for eternal military service. These heavy infantrymen fight in dense formations, their armor styles influencing the later development of the medieval knight. They are the iron wall against the horse-lords of the East."

 roman_hun_infantry:0 "Hunnic Subject Infantry"
 roman_hun_infantryDESCR:0 "Following the defeat of Attila, the remnants of the Hunnic horde were settled as military colonists. Those too poor to own horses were forced to serve on foot. Despised by true Romans and feared by enemies, they fight with a desperate cruelty, knowing they have no place in society other than the battlefield."

 roman_housecarls:0 "Palatine Guards"
 roman_housecarlsDESCR:0 "Originally a Germanic concept, the institution of the 'Household Guard' was adopted by provincial governors who desired loyalty beyond the state. These elite warriors eat at their lord's table and sleep at his door, wielding massive two-handed axes with surgical precision to decapitate would-be assassins."

 # --- Medieval Infantry ---
 roman_western_medieval_infantry:0 "Theme Infantry"
 roman_western_medieval_infantryDESCR:0 "With the reorganization of the provinces into the Theme system, the legions have become local defense forces. These men are professional soldiers funded by land grants, equipped with mail hauberks and kite shields. They represent the decentralization of the Empire's defense, ensuring that every province can stand alone if the center falters."

 roman_western_men_at_arms:0 "Armored Scutarii"
 roman_western_men_at_armsDESCR:0 "As metallurgy advanced in the forges of Mediolanum and Toledo, the Scutarii evolved. Encased in partial plate and mail, these professional soldiers are the heavy infantry of the High Middle Ages. They have discarded the pilum for heavy maces and swords, designed to batter through the defenses of rebellious feudal lords."

 roman_western_swordsmen:0 "Spatha Infantry"
 roman_western_swordsmenDESCR:0 "The gladius was deemed too short for the chaotic skirmishes of the medieval era. In its place, the longer Spatha became the sidearm of choice. These swordsmen are versatile combatants, trained to fight in looser formations where individual skill with the blade matters more than the rigid shield wall."

 roman_western_macemen:0 "Plumbata Macemen"
 roman_western_macemenDESCR:0 "Faced with enemies clad in increasingly heavy armor, the Empire revived the use of lead-weighted darts (Plumbata) combined with heavy maces. These shock troops disrupt enemy charges with a volley of darts before closing in to crush helmets and breastplates with brutal efficiency."

 roman_western_pike:0 "Phalangitai"
 roman_western_pikeDESCR:0 "Rediscovered in the dusty archives of the Library of Alexandria, the Macedonian manuals of war have been given new life. The Phalangitai form an impenetrable forest of sarissa pikes. While vulnerable on the flanks, their frontal assault is unstoppable, pushing back any enemy foolish enough to engage them."

 roman_western_longbow:0 "Britannic Sagittarii"
 roman_western_longbowDESCR:0 "The province of Britannia Superior developed a unique culture of archery, mandating that every yeoman practice weekly. Using bows carved from slow-growing yew, these archers can loose arrows with enough force to penetrate Frankish mail. They are the Emperor's preferred answer to heavy cavalry."

 roman_crossbow:0 "Manuballistae"
 roman_crossbowDESCR:0 "Roman engineers miniaturized the siege ballista into a hand-held terror weapon. The Manuballista requires little training to use but possesses armor-piercing power that terrifies the warrior aristocracy. The Pope briefly considered banning it, but the Imperial legions found it too useful to discard."

 roman_halberd_infantry:0 "Securis Heavy Infantry"
 roman_halberd_infantryDESCR:0 "To counter the rise of heavy cavalry, the Imperial armories issued the 'Securis Longa'—a polearm combining an axe, hook, and spear. These troops are trained to hook knights from their saddles and dispatch them on the ground, proving that even the wealthiest equites are not safe from the common soldier."

 roman_longswordsmen:0 "Imperial Duelists"
 roman_longswordsmenDESCR:0 "Graduates of the fencing academies of Northern Italia, these elite soldiers wield massive greatswords (Montante) capable of cleaving multiple foes in a single swing. They are often used to guard the standard or to carve a path through pike formations, relying on skill and steel rather than shields."

 roman_italian_condotta:0 "Italic Mercenaries"
 roman_italian_condottaDESCR:0 "The wealth of the Italic merchant republics has given rise to the Condottieri system. These contract armies are the best equipped in the world, clad in the finest Milanese plate. While their loyalty is only to gold, the Empire finds it cheaper to hire them than to raise new legions during short campaigns."

 roman_swiss_landsknechten:0 "Helvetian Guard"
 roman_swiss_landsknechtenDESCR:0 "From the isolated valleys of Helvetia comes a new breed of soldier. Fiercely independent and disciplined, they fight in massive pike squares that move with terrifying speed. The Emperor has granted them special tax exemptions, and in return, they serve as the unshakeable core of the Imperial center."

 roman_gaelic_galloglaigh:0 "Gaelic Heavy Infantry"
 roman_gaelic_galloglaighDESCR:0 "Descending from a mix of Hibernian and Norse settlers, the 'Galloglaigh' are hereditary warriors who serve the governors of Britannia. Clad in long mail coats and wielding massive two-handed axes, they are the grim executioners of the battlefield, refusing to retreat even when the battle is lost."

 roman_gaelic_mercenary:0 "Hibernian Auxilia"
 roman_gaelic_mercenaryDESCR:0 "Life on the misty fringes of the Empire is harsh, breeding hard men. These light troops from Hibernia serve as scouts and raiders. Unencumbered by heavy armor, they traverse bog and hill with ease, appearing from the mist to ambush supply trains before vanishing again."

 roman_gaelic_free_shooter:0 "Caledonian Skirmishers"
 roman_gaelic_free_shooterDESCR:0 "The wild tribes north of Hadrian's Wall have never been fully civilized, but they have been harnessed. Fighting as irregulars, they harass enemy lines with javelins and short bows, disrupting formations and baiting enemies into breaking rank."

 roman_irish_charge:0 "Hibernian Raiders"
 roman_irish_chargeDESCR:0 "Sometimes discipline is less effective than sheer terror. These Hibernian warriors charge into battle with little armor, relying on speed, noise, and psychological warfare to break the enemy's nerve before the lines even meet."

 roman_scottish_highlander:0 "Caledonian Hillmen"
 roman_scottish_highlanderDESCR:0 "From the rugged highlands of Caledonia, these clansmen fight with a ferocious loyalty to their chieftains. Wielding the heavy Claymore, they are shock troops par excellence, capable of breaking a line through sheer physical aggression."

 # --- Early Modern Infantry ---
 roman_spanish_tercio:0 "Hispanic Legion"
 roman_spanish_tercioDESCR:0 "The Great Reform of Hispania merged the ancient legionary structure with the new reality of gunpowder. The 'Tercio' formation mixes pikemen (to repel cavalry) with arquebusiers (to deal death from afar). It is a walking fortress, a self-contained army that can fight in any direction. The Hispanic Legion has never known defeat."

 roman_austrian_tercio:0 "Danubian Legion"
 roman_austrian_tercioDESCR:0 "On the eastern frontier, the Ottoman and Rus threats required a deeper formation. The Danubian Legion adds more armored pikemen to the standard Tercio mix, creating a formation capable of absorbing the endless waves of steppe cavalry while the musketeers fire comfortably from the safety of the pike forest."

 roman_dutch_maurician:0 "Batavian Cohort"
 roman_dutch_mauricianDESCR:0 "The Prince of Batavia revolutionized warfare by applying Roman mathematics to drill. By reducing the depth of the formation and drilling the men to reload in rotation, the Batavian Cohort produces a continuous rolling volley of fire. It is less a group of men and more a single, firing machine."

 roman_swedish_gustavian:0 "Scandian Reformed Infantry"
 roman_swedish_gustavianDESCR:0 "The Lion of the North, the Governor of Scandia, realized that mobility conquers weight. His reformed infantry carry lighter muskets and are supported by light regimental cannons that move with the troops. They do not wait to be charged; they advance, fire a point-blank volley, and charge home with cold steel."

 roman_swedish_caroline:0 "Scandian Shock Troops"
 roman_swedish_carolineDESCR:0 "In the frozen forests of Scandia, ammunition is scarce and battles must be won quickly. These troops are trained to hold their fire until they can see the whites of the enemy's eyes. Their doctrine is purely offensive: one volley, then a bayonet charge that sweeps the enemy from the field."

 roman_prussian_drill:0 "Teutonic Disciplined Infantry"
 roman_prussian_drillDESCR:0 "The Teutonic Order, now secularized into the Imperial Army of Germania, has perfected the art of drill. Using iron ramrods and corporal punishment, these men can fire four rounds a minute where others fire two. To stand before a Teutonic line is to stand before a firing squad."

 # --- Late Modern Infantry ---
 roman_prussian_frederickian:0 "Imperial Guard Infantry"
 roman_prussian_frederickianDESCR:0 "Hand-picked veterans from every province of the Empire, the Guard represents the pinnacle of 18th-century warfare. Their uniforms are immaculate, their drill flawless, and their morale unshakable. They are the Emperor's final argument, deployed only when the battle must be won at any cost."

 roman_austrian_white_coat:0 "Cohors Candida"
 roman_austrian_white_coatDESCR:0 "Dressed in distinctive white coats, the infantry of the Danubian provinces are the Empire's most numerous regulars. Stoic and dependable, they have stood firm against everything from French revolutionary fervor to Prussian precision. They are the anvil upon which the enemies of Rome are broken."

 roman_french_bluecoat:0 "Cohors Caerulea"
 roman_french_bluecoatDESCR:0 "Following the turmoil of the Gallic unrest, the Empire adopted the 'Levée en Masse.' The Cohors Caerulea are drafted citizens, fighting with a patriotic fervor that replaces rigid drill. They attack in massive columns, overwhelming the enemy with sheer numbers and the revolutionary spirit of 'Roma Aeterna.'"

 # --- Missing Infantry ---
 roman_austrian_grenzer:0 "Limes Grenzer"
 roman_austrian_grenzerDESCR:0 "The 'Grenzer' are the spiritual successors to the ancient Limitanei, but forged in the fires of modern gunpowder warfare. Living in the militarized zones of the Balkan frontier, these men are exempt from imperial taxation in exchange for constant vigilance against the eastern hordes. They are masters of irregular warfare, sharpshooting from the rocky crags, and holding the difficult terrain of the Imperial frontier where regular line infantry would falter."

 roman_anglofrench_line:0 "Gallo-Britannic Line"
 roman_anglofrench_lineDESCR:0 "As the Empire standardized its western field armies, the best traits of the Gallic and Britannic military traditions were merged into a single doctrine. These line infantry regiments combine the dashing offensive spirit (élan) of the Gauls with the stoic, iron-willed musketry of the British. The result is a versatile force capable of conquering the globe, equally comfortable in a bayonet charge or a standing firefight."

 roman_french_impulse:0 "Gallic Shock Column"
 roman_french_impulseDESCR:0 "Rejecting the static nature of the firing line, these Gallic commanders believe that the spirit of the offensive is the key to victory. Organized into deep attack columns, they advance rapidly to the beat of drums, ignoring casualties to close the distance. Their doctrine is simple: close with the enemy and break their morale with a ferocious bayonet charge before they can reload."

 roman_british_square:0 "Britannic Square"
 roman_british_squareDESCR:0 "The regiments raised in Britannia are famous for their refusal to panic. When threatened by heavy cavalry, they form a hollow square with mathematical precision. At the Battle of Waterloo, these squares withstood charge after charge of enemy cuirassiers, the men joking amidst the smoke and noise as they earned the nickname 'The Iron Walls of the Empire.'"

 roman_mixed_order_infantry:0 "Manipular Line Infantry"
 roman_mixed_order_infantryDESCR:0 "The Napoleonic era saw a return to the flexibility of the ancient Maniple system. This 'Mixed Order' allows battalions to switch instantly between line for maximum firepower, column for rapid movement, and square for defense against cavalry. It is the perfect synthesis of ancient Roman tactical flexibility and modern industrial firepower."

 roman_austrian_jaeger:0 "Venatores"
 roman_austrian_jaegerDESCR:0 "Recruited from gamekeepers, foresters, and hunters across the wooded provinces, the Venatores are equipped with high-quality rifled muskets. Unlike the rigid line infantry, they operate in loose order, using the terrain to their advantage. Their primary task is to target enemy officers and artillery crews, their green uniforms allowing them to vanish into the woodlands like ghosts."

 roman_napoleonic_square:0 "Imperial Square"
 roman_napoleonic_squareDESCR:0 "When the thunder of hooves signals a cavalry charge, the cohort folds inward to form a hollow square, bristling with bayonets on all sides. This formation creates a fortress of steel and fire that no horse will voluntarily charge. It is a testament to the discipline of the modern Roman soldier that he can stand firm while thousands of pounds of cavalry thunder toward him."

 # --- Missing Cavalry ---
 roman_chevauchee:0 "Raiding Equites"
 roman_chevaucheeDESCR:0 "War is not merely a clash of armies; it is an economic struggle. These mounted troops are specialists in the 'Chevauchee'—the systematic burning of crops, looting of villages, and destruction of infrastructure. Their mission is to destroy the enemy's will to fight by turning their productive lands into a wasteland, all justified under the cold logic of strategic necessity."

 roman_french_caracolle:0 "Gallic Caracole"
 roman_french_caracolleDESCR:0 "Facing deep pike formations, the Gallic cavalry evolved the 'Caracole' doctrine. Instead of charging home, ranks of horsemen ride up, discharge their pistols into the enemy mass, and wheel away to reload. It turns the cavalry unit into a mobile firing battery, prioritizing sustained firepower over the risky shock of the melee."

 roman_swedish_gallop:0 "Scandian Gallop"
 roman_swedish_gallopDESCR:0 "While most cavalry trots until the last moment to preserve formation, the Scandian doctrine dictates a charge at full gallop from the very start. This reckless speed closes the distance to enemy guns so quickly that artillery often only gets one volley off before the cavalry is among them, cutting the gunners down."

 roman_swedish_arme_blanche:0 "Scandian Cold Steel"
 roman_swedish_arme_blancheDESCR:0 "The cavalry of the frozen north has no patience for pistols or fancy maneuvers. Their doctrine is 'Arme Blanche'—the white weapon. They charge knee-to-knee with swords drawn, relying on the sheer kinetic impact of horse and steel to shatter the enemy line. It is a tactic of pure, unadulterated aggression."

 roman_french_dragoon:0 "Dimachaeri Dragoons"
 roman_french_dragoonDESCR:0 "The Dragoon is a hybrid soldier, riding a horse for mobility but fighting with a musket like an infantryman. They are the ultimate strategic reserve of the Empire, able to seize a bridge or hold a vital crossroads hours before the main infantry force can arrive. They are the 'Dimachaeri' of the modern age—fighting with two styles."

 roman_austrian_hussar:0 "Pannonian Hussars"
 roman_austrian_hussarDESCR:0 "The original light cavalry, born on the vast plains of Pannonia. These men learn to ride before they can walk. They are the eyes and ears of the Danubian army, swarming around the enemy flanks, cutting supply lines, and causing chaos in the rear. Their flamboyant uniforms conceal a lethal efficiency in the saddle."

 roman_prussian_uhlan:0 "Teutonic Lancers"
 roman_prussian_uhlanDESCR:0 "The lance saw a resurgence in the Germanic provinces under the Teutonic military reforms. The Uhlans are famous for their distinct 'czapka' helmets and their terrifying skill with the lance. In an age of muskets, the psychological impact of a wall of spear-points charging at full gallop remains a potent weapon against broken infantry."

 roman_british_hussar:0 "Britannic Exploratores"
 roman_british_hussarDESCR:0 "Adopting the fashion and tactics of the Hungarian light horse, the Britannic Hussars are the dandies of the army. With their fur pelisses and braided jackets, they may look like peacocks, but they are fearless scouts and deadly duelists who pride themselves on being the first to engage the enemy and the last to retreat."

 roman_french_carabinier:0 "Gallic Carabineers"
 roman_french_carabinierDESCR:0 "The elite of the heavy cavalry, these big men are armed with rifled carbines. They are marksmen on horseback who can soften up an enemy regiment with accurate fire from the saddle before drawing their heavy broadswords to finish the job in a crushing melee."

 roman_open_order_cavalry:0 "Skirmishing Equites"
 roman_open_order_cavalryDESCR:0 "As artillery became more deadly, massed cavalry formations became suicide. These units are trained to operate in loose swarms, minimizing the target they present to cannons while still retaining the ability to quickly coalesce for a charge when a tactical opportunity arises."

 roman_napoleonic_lancers:0 "Imperial Lancers"
 roman_napoleonic_lancersDESCR:0 "Recognizing the lance's unique utility in running down fleeing infantry, the Emperor formed new regiments of specialized Lancers. They are the predators of the battlefield, specifically tasked with hunting down broken units and ensuring that a tactical retreat turns into a disorderly rout."

 roman_french_cuirassier:0 "Gallic Cuirassiers"
 roman_french_cuirassierDESCR:0 "While other nations abandoned armor as obsolete, the Gallic regiments kept the cuirass. These massive men on massive horses are designed for the decisive moment of battle. When the enemy line wavers, the Cuirassiers are unleashed to trample them into the mud with heavy swords, their breastplates gleaming in the sun."
 
 roman_british_redcoat:0 "Cohors Rubra"
 roman_british_redcoatDESCR:0 "The legions raised in the province of Britannia have adopted distinctive red tunics, dyed with the madder root common to the island. Known for their iron discipline and eerie calm under fire, the 'Cohors Rubra' specialize in the thin two-rank firing line. They have a reputation for absolute silence in battle, marching into the face of death without a word, breaking their silence only to unleash devastating, rolling volleys that tear enemy formations apart."