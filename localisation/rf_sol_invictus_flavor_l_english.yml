l_english:
 # Event 1
 sol_flavor.1.t:0 "Dies Natalis Solis Invicti"
 sol_flavor.1.d:0 "The Winter Solstice has arrived! It is the shortest day of the year, the moment when the darkness is deepest, and the moment when the Sun proves he cannot be conquered. As the days begin to lengthen once more, the Festival of the Birthday of the Unconquered Sun grips the empire. The legions feast, the altars blaze with fire, and the populace celebrates the eternal victory of light over shadow. It is a potent sign that no matter how dark the times, the Empire, like the Sun, will always rise again."
 sol_flavor.1.a:0 "Sol Invictus returns! Glory to the Empire!"

 # Event 2
 sol_flavor.2.t:0 "Summus Deus"
 sol_flavor.2.d:0 "A theological dispute has arisen among the priesthood. The hardliners argue for strict Monotheism: Sol is the only true god, and all others, Jupiter, Mars, Mithras, are false idols that must be purged. However, the philosophers argue for Henotheism: Sol is the 'Summus Deus' (Highest God), and all other deities are simply aspects or servants of his supreme radiance. The former path offers unity through purity; the latter offers unity through assimilation."
 sol_flavor.2.a:0 "There is only one God. Purge the idols."
 sol_flavor.2.b:0 "Many rays, one Sun. Accept the syncretism."

 # Event 3
 sol_flavor.3.t:0 "The Mithraic Mysteries"
 sol_flavor.3.d:0 "The worship of Sol is public and bright, but within the ranks of our legions, a darker, more secretive cult thrives: the Mysteries of Mithras. Soldiers gather in underground caves (Mithraea) to perform secret rites, bonding through blood and brotherhood. While technically a separate cult, they view Mithras as the soldier aspect of the Sun. Some generals worry these secret societies undermine loyalty to the State, while others claim they forge unbreakable discipline among the troops."
 sol_flavor.3.a:0 "Support the Mysteries. They make better killers."
 sol_flavor.3.b:0 "No secrets. The Army serves the State alone."

 # Event 4
 sol_flavor.4.t:0 "The Radiate Crown"
 sol_flavor.4.d:0 "The Imperial Mint has presented the new coinage designs. They depict your profile wearing the 'Corona Radiata', the spiked solar crown that mimics the rays of the sun. It is a bold statement, implying that the Ruler is not merely a mortal administrator, but the 'Comes' (Companion) of the Sun God, or perhaps his Vicar on Earth. To wear the crown is to claim divine authority, but it may offend the republicans and the traditionalists who fear tyranny."
 sol_flavor.4.a:0 "I am the light of the world."
 sol_flavor.4.b:0 "A modest laurel wreath will suffice."

 # Event 5
 sol_flavor.5.t:0 "The Black Sun"
 sol_flavor.5.d:0 "Panic in the streets! In the middle of the day, the sky darkened, the temperature dropped, and the Sun was devoured by a black disc. The common people are wailing, tearing their clothes, and claiming that Sol Invictus has been defeated or has abandoned Rome due to our sins. Even the soldiers are uneasy, viewing this eclipse as the ultimate omen of doom. We must act quickly to restore order before the panic turns into a full-scale riot."
 sol_flavor.5.a:0 "We have failed him! The End Times are here!"
 sol_flavor.5.b:0 "It is merely the moon's shadow. Calm the mob."

 # Event 6
 sol_flavor.6.t:0 "Iconoclasm in the Provinces"
 sol_flavor.6.d:0 "Zealotry has erupted in the provinces. Mobs of faithful soldiers and peasants, fired up by radical solar priests, have attacked the ancient temples of the old polytheistic gods. They are smashing statues of Venus and desecrating shrines to Mercury, claiming that 'No shadow can exist in the light of the Sun.' The local governors are asking for instructions: do we unleash the legions to stop the destruction, or do we allow this violent purification to take its course?"
 sol_flavor.6.a:0 "Let the fire consume the old lies."
 sol_flavor.6.b:0 "This is chaos, not piety! Send in the guards."