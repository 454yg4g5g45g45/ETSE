l_english:
 rom_borealis_terra_mission_title:0 "Terra Borealis"
 rom_borealis_terra_mission_desc:0 "The northern continent is vast and untamed. We must establish organized colonies in Canada and Louisiana to secure the fur trade and timber for our fleets."
 
 rom_imperium_mexicanum_mission_title:0 "Imperium Mexicanum"
 rom_imperium_mexicanum_mission_desc:0 "The Aztecs have built a civilization that rivals the ancients. We shall conquer them, not to destroy, but to integrate their wealth into the Empire."
 
 rom_limes_californianus_mission_title:0 "Limes Californianus"
 rom_limes_californianus_mission_desc:0 "The Pacific coast of California shall serve as our new western frontier, a Limes against the unknown ocean."
 
 rom_mare_novum_mission_title:0 "Mare Novum"
 rom_mare_novum_mission_desc:0 "The Atlantic is no longer a barrier. By securing the Caribbean islands, we turn this ocean into a new Roman lake."
 
 rom_aurum_novum_mission_title:0 "Aurum Novum"
 rom_aurum_novum_mission_desc:0 "Reports of cities of gold in the Andes and Mexico are true. We must seize these mines to ensure the solvency of the Imperial Treasury forever."
 
 rom_oceanus_magnus_mission_title:0 "Oceanus Magnus"
 rom_oceanus_magnus_mission_desc:0 "The Pacific Ocean is vast, but Roman engineering can span it. We must find the route to the East by sailing West."
 
 rom_terra_australis_mission_title:0 "Terra Australis"
 rom_terra_australis_mission_desc:0 "A massive southern land has been discovered. It shall serve as a penal colony and a strategic outpost for our southern fleet."
 
 rom_ultra_aequator_mission_title:0 "Ultra Aequator"
 rom_ultra_aequator_mission_desc:0 "Beyond the equator lies the Amazon. We must assert dominion over the entire southern continent."
 
 rom_imperium_sine_fine_mission_title:0 "Imperium Sine Fine"
 rom_imperium_sine_fine_mission_desc:0 "An Empire without end. We have circled the globe, and nowhere does the sun set on the Eagle."
 
 rom_guinea_coast_title:0 "Littus Guinea"
 rom_guinea_coast_desc:0 "The ivory and gold of West Africa must flow into Roman coffers. We must dominate the trade nodes of the Guinea Coast."
 
 rom_cape_of_good_hope_title:0 "Caput Bonae Spei"
 rom_cape_of_good_hope_desc:0 "Rounding the Cape of Africa is the key to India. We must establish a fortified harbor there."
 
 rom_own_zanzibar_title:0 "Emporium of Zanzibar"
 rom_own_zanzibar_desc:0 "The Swahili coast is the gateway to the Indian Ocean trade. Zanzibar must become a Roman port."
 
 rom_africa_magna_title:0 "Africa Magna"
 rom_africa_magna_desc:0 "From the Pillars of Hercules to the Cape, the entire African continent shall bow to the Caesar."
 
 rom_red_sea_trade_title:0 "Mare Rubrum"
 rom_red_sea_trade_desc:0 "The ancient route of the Ptolemies must be revived. We must dominate the trade of the Red Sea."
 
 rom_indian_trade_title:0 "Indica Commercia"
 rom_indian_trade_desc:0 "The spices of India are worth more than gold. We must control the flow of goods from the Indus and Ganges."
 
 rom_spice_island_title:0 "Insulae Aromatum"
 rom_spice_island_desc:0 "We have reached the fabled Spice Islands. Establishing a presence here will give us a monopoly on cloves and nutmeg."
 
 rom_build_the_suez_title:0 "Fossa Traiani"
 rom_build_the_suez_desc:0 "The dream of the Pharaohs and Trajan shall be realized. We will dig a canal to connect the Mediterranean to the Red Sea."
 
 rom_build_the_panama_title:0 "Fossa Panamae"
 rom_build_the_panama_desc:0 "We shall cleave the new continent in two, allowing our fleets to pass from the Atlantic to the Pacific instantly."
 
 rom_build_the_kiel_title:0 "Fossa Cimbrica"
 rom_build_the_kiel_desc:0 "To bypass the treacherous Danish straits, we shall dig a canal through the Cimbrian peninsula."
 
 rom_build_the_kra_title:0 "Fossa Aurea"
 rom_build_the_kra_desc:0 "A canal through the Kra Isthmus will shorten the journey to China, cementing our dominance over Asian trade."
 
 rom_creator_of_seas_title:0 "Creator of Seas"
 rom_creator_of_seas_desc:0 "We have reshaped the very geography of the Earth to suit our needs. We are not just conquerors; we are architects of the world."

 # --- CUSTOM TOOLTIPS (For clunky triggers) ---
 rom_imperium_sine_fine_mission.tt:0 "§YRequirements:§!\n- Circumnavigate the Globe\n- Own at least §Y5 Colonial Subjects§!\n- Have §Y5000 Total Development§!"
 
 rom_africa_magna.tt:0 "§YRequirements:§!\n- Own §Y350 Provinces§! in Africa\n- OR have Colonial Nations in §Yevery African colonial region§!"
 
 rom_borealis_terra_mission.tt:0 "§YRequirements:§!\n- have Colonial Nations in §YEastern America, Canada or Lousiana etc.§!"