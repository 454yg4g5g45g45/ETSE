l_english:
  
 # 1. CLAUDIUS GALENUS
 roman_characters_event.1.t:0 "The Prince of Medicine"
 roman_characters_event.1.d:0 "From the ancient halls of the Asclepion in Pergamon comes news of a physician whose intellect rivals Aristotle and whose skill surpasses Hippocrates. Claudius Galenus, a man who honed his craft treating the torn flesh of gladiators, has arrived in the capital seeking patronage. His understanding of anatomy is revolutionary, though controversial; forbidden by Roman law from dissecting human cadavers, he has instead meticulously mapped the internal workings of Barbary apes and pigs, extrapolating their structures to the human form with startling accuracy.\n\nHe speaks of the Four Humours; blood, phlegm, yellow bile, and black bile, and claims that all malady stems from their imbalance. While his arrogance is palpable, as he openly mocks the Methodist doctors of the court as mere sophists, his results are undeniable. During the outbreaks of plague that ravage the legions, he alone seems to possess the sanitary discipline to save lives. He offers to serve as the personal physician to the State, promising to systematize medical knowledge in a way that will endure for a thousand years."
 roman_characters_event.1.opt1:0 "His genius is worth his arrogance. Grant him the seal."
 roman_characters_event.1.refuse:0 "We need priests, not someone who cuts open monkeys."
 
 # 2. FLAVIUS BELISARIUS
 roman_characters_event.2.t:0 "The Last Roman"
 roman_characters_event.2.d:0 "In the annals of Roman military history, few names shine with the lustre of Flavius Belisarius. Born in the rugged frontier of Thrace, he rose from the obscurity of the Bucellarii bodyguards to command the armies of the East. His tactical flexibility is unmatched; at Dara, he defeated a Persian army twice the size of his own by digging trenches to refuse his centre, a tactic unheard of in traditional doctrine. He has suppressed the Nika Riots with cold efficiency, saving the throne of the central authority when the mob howled at the palace gates.\n\nNow, he looks West. He dreams of a Rome restored to its ancient borders, of Vandals driven from Carthage and Goths expelled from Italy. His loyalty to the State is so absolute that it confuses his enemies and worries the paranoid aristocracy, who whisper that a man this popular must surely crave the purple for himself. He stands ready to serve, asking only for the funds to pay his personal household troops and the authority to reform our stagnant legions."
 roman_characters_event.2.opt1:0 "Give him the Legions. The West awaits."
 roman_characters_event.2.opt2:0 "We need his mind here to reform the army structure."
 roman_characters_event.2.refuse:0 "He is too popular. It is dangerous."
 
 # 3. MARCO POLO
 roman_characters_event.3.t:0 "Il Milione"
 roman_characters_event.3.d:0 "A merchant from the maritime quarter of Venetia, recently returned from a journey that beggars belief, has petitioned the Court. Marco Polo claims to have spent nearly two decades in the service of the Great Khan of the Mongols, travelling further East than any Roman legion ever dared to march. He speaks of Xanadu and Cathay, of black stones that burn like wood, known as coal, and of an Empire where money is made of paper rather than gold.\n\nWhile many in the capital dismiss his stories as the fabrications of a braggart, mockingly calling him Il Milione for the millions of lies he supposedly tells, his knowledge of the Silk Road is visibly genuine. He understands the logistics of vast colonial administration and the diplomatic protocols of the Orient in a way no Western scholar does. He offers his services to the State, promising to open trade routes that could flood our treasury with the wealth of the East, provided we can tolerate his endless stories about the court of Kublai Khan."
 roman_characters_event.3.opt1:0 "Put his knowledge of the East to use in our colonies."
 roman_characters_event.3.opt2:0 "If he knows trade, he shall fill our treasury."
 roman_characters_event.3.opt3:0 "Send him to negotiate with the Eastern powers."
 roman_characters_event.3.refuse:0 "Paper money? Black stones that burn? Throw him out."
 
 # 4. DANTE ALIGHIERI
 roman_characters_event.4.t:0 "The Supreme Poet"
 roman_characters_event.4.d:0 "An exile of the White faction in the Florentine province, Dante Alighieri, has sought refuge within our jurisdiction. Stripped of his property and sentenced to death by fire should he return to his home city, he has turned his sorrow into art. He is currently composing a poem of staggering ambition; a Comedy traversing Hell, Purgatory, and Paradise. Unlike the rigid Latin of the churchmen, Dante writes in the vernacular Volgare, elevating the common tongue to a language fit for high philosophy and divine revelation.\n\nHis presence is polarizing. He is a fierce critic of corruption, both secular and ecclesiastical, and his pen is sharper than a gladius. Yet, his intellect is undeniable. He argues passionately for the necessity of a universal Monarchy, a strong Roman State, to bring peace to the world. To have the Sommo Poeta in our court would be a cultural coup of the highest order, assuming we can tolerate his brooding temperament and his obsession with a woman named Beatrice."
 roman_characters_event.4.opt1:0 "His philosophy on Monarchy suits our state perfectly."
 roman_characters_event.4.opt2:0 "Commission his works. Let the world read his Comedy."
 roman_characters_event.4.refuse:0 "We do not need exiled troublemakers here."
 
 # 5. CRISTOFORO COLOMBO
 roman_characters_event.5.t:0 "The Admiral of the Ocean Sea"
 roman_characters_event.5.d:0 "A navigator from the Ligurian coast, Cristoforo Colombo, has arrived with a proposal that is either madness or genius. While the Roman naval authorities stubbornly creep south around the coast of Africa to reach the Indies, Colombo insists the world is smaller than our geographers believe. He argues that by sailing West across the Atlantic, the Ocean of Darkness, one can reach the golden roofs of Cipangu, known as Japan, and the spice markets of Cathay in a matter of weeks.\n\nHe has been rejected by the Proconsul of Hispania’s court, who rightly pointed out his calculations of the circumference of the earth are dangerously underestimated. However, his charisma and conviction are magnetic. He demands high titles; Admiral of the Ocean Sea, Viceroy of all lands discovered, and a tenth of all revenues gained. It is a steep price for a voyage into the unknown, but if he is right, the wealth of the Indies will belong to Rome alone."
 roman_characters_event.5.opt1:0 "Give him the ships. Sail West to reach the East."
 roman_characters_event.5.opt2:0 "We need his naval expertise for our war fleets."
 roman_characters_event.5.opt3:0 "Let him govern our overseas territories."
 roman_characters_event.5.opt4:0 "He can teach our captains the ways of the winds."
 roman_characters_event.5.refuse:0 "The Earth is not that small. He will starve at sea."
 
 # 6. LEONARDO DA VINCI
 roman_characters_event.6.t:0 "The Universal Genius"
 roman_characters_event.6.d:0 "The province of Florentia has given the world a man whose mind seems to encompass the entirety of human knowledge. Leonardo da Vinci, the ultimate Renaissance polymath, is not merely an artist of exquisite honour, responsible for masterpieces like the Mona Lisa; he is also an engineer, anatomist, and natural philosopher. His notebooks are a secret treasury of innovation, filled with sketches of flying machines, submarine designs, and complex hydraulic systems that could revolutionize our siege craft and civic engineering.\n\nHe has studied the flow of water and the musculature of man with the same meticulous detail. His ideas are often deemed impractical or too far ahead of their time, requiring immense financial backing and specialised labour to implement. Yet, his insights into optics, mechanics, and human biology promise to advance Roman understanding in every imaginable field. He is currently available for service, demanding only the freedom to pursue his scientific inquiries and a significant stipend to fund his numerous projects."
 roman_characters_event.6.opt1:0 "Let him apply his anatomical knowledge to medicine and science."
 roman_characters_event.6.opt2:0 "Commission him to paint the greatest frescos of the age."
 roman_characters_event.6.opt3:0 "Task him with designing the next generation of siege engines."
 roman_characters_event.6.refuse:0 "He is an expensive dreamer; we have practical matters to attend to."
 
 # 7. NICCOLÒ MACHIAVELLI
 roman_characters_event.7.t:0 "The Prince of Realpolitik"
 roman_characters_event.7.d:0 "Niccolò Machiavelli, a former diplomatic official of the Florentine Provincial government, has been dismissed from service and subjected to torture on suspicion of conspiracy against the central authority. During his internal exile, he has channelled his bitterness and vast experience observing the factional wars into a treatise on governance; a brutally candid manual for acquiring and maintaining power. He argues that the ideal ruler of the State, whether Consul or Emperor, must be ready to be feared rather than loved, and that political necessity must always supersede morality or religious doctrine.\n\nHis writings are cynical, unsettling, and frighteningly effective, dispensing with the idealistic classical notions of virtue. He offers to lend his sharp political insight to our state, possessing a deep understanding of intelligence gathering and inter Prefecture diplomacy. His advice is invaluable, but the implementation of his ruthless principles may alienate our loyal neighbours and compromise the moral integrity of the Roman name."
 roman_characters_event.7.opt1:0 "Appoint him Spymaster to root out all threats to the state."
 roman_characters_event.7.opt2:0 "Bring him into the Senate; his pragmatic wisdom is required."
 roman_characters_event.7.opt3:0 "Send him abroad; his diplomatic experience is needed."
 roman_characters_event.7.opt4:0 "Place the fate of Rome in his hands; let him rule."
 roman_characters_event.7.refuse:0 "His principles are too wicked to be admitted into Roman discourse."
 
 # 8. ISAAC NEWTON
 roman_characters_event.8.t:0 "The Philosopher of Gravity"
 roman_characters_event.8.d:0 "From the faraway Roman island of Britannia emerges a recluse of staggering genius: Isaac Newton. The Imperial College of Natural Science is abuzz with his new work, the Philosophiae Naturalis Principia Mathematica, in which he outlines the laws governing motion and universal gravitation. He claims that the same force that pulls an apple to the ground dictates the precise orbits of the moons and planets, offering a single mathematical description for all physical phenomena; celestial and terrestrial. This work promises to revolutionise shipbuilding, siege weapon accuracy, and timekeeping.\n\nNewton is also a profound theologian, an alchemist obsessed with the chronology of ancient empires, and a notorious eccentric who defends his intellectual territory with ferocious intensity. Despite his academic leanings, he has demonstrated extreme competence in public administration, having been instrumental in restoring the Roman currency in his capacity as Master of the Mint. Bringing him into our administration would grant us unparalleled insight into the fundamental workings of the universe."
 roman_characters_event.8.opt1:0 "Grant him a position; let him apply his natural philosophy to the state."
 roman_characters_event.8.refuse:0 "His theories are too esoteric for practical use."
 
 # 9. NAPOLEONE DI BUONAPARTE
 roman_characters_event.9.t:0 "The Corsican Artilleryman"
 roman_characters_event.9.d:0 "The chaos of the recent civil strife has created a vacuum of power, allowing men of extraordinary talent to rise with unprecedented speed. Napoleone di Buonaparte, a military officer of modest Corsican noble origins, has distinguished himself as an artillery expert and a master of troop deployment. He possesses an almost supernatural ability to inspire devotion and terror in equal measure, commanding the loyalty of his men while simultaneously cowing the enemy.\n\nHis strategic mind is cold and analytical, valuing speed and overwhelming force above all else. He dreams of restoring the glory of Rome, not as a subordinate, but as its chief architect. Reports indicate he is now powerful enough to seize the reins of the State and command the entire military apparatus. This move would provide tremendous military advantage, but at the cost of the established constitutional order and considerable domestic upheaval."
 roman_characters_event.9.opt1:0 "Appoint him General in Chief to command our best armies."
 roman_characters_event.9.opt2:0 "Keep him focused on logistics and grand strategy as a Commandant."
 roman_characters_event.9.opt3:0 "Utilise his organisation skills to restructure the military recruitment system."
 roman_characters_event.9.opt4:0 "Allow him to seize the supreme power of the State."
 roman_characters_event.9.refuse:0 "His ambition is a greater threat than any foreign foe."
 
 # 10. ALBERT EINSTEIN
 roman_characters_event.10.t:0 "The Theory of Relativity"
 roman_characters_event.10.d:0 "From the Roman province of Ulm, a relatively obscure bureaucrat named Albert Einstein has shattered two hundred years of established Newtonian physics. His work on special and general relativity demonstrates that space and time are not immutable constants, but are interwoven and dynamic. Most terrifyingly, his famous equation, E equals M C squared, reveals an almost incomprehensible amount of energy locked within every gram of matter; energy that could be harnessed for either civic betterment or unimaginable military destruction.\n\nEinstein is a theoretical physicist of the highest honour, yet his pacifist nature means he is hesitant to see his discoveries exploited for war. Recruiting him would give Rome an unparalleled edge in technological and scientific labour, allowing us to rapidly advance into new eras of engineering and military hardware. However, his work is purely abstract, requiring a tremendous leap of faith and funding from the State to translate theory into applicable technology."
 roman_characters_event.10.opt1:0 "Fund his research into theoretical physics."
 roman_characters_event.10.opt2:0 "Task him with developing the next generation of destructive weapons."
 roman_characters_event.10.refuse:0 "His ideas are far too abstract to be of immediate use."

 # 11. HYPATIA
 roman_characters_event.11.t:0 "Hypatia of Alexandria"
 roman_characters_event.11.d:0 "The ancient schools of Alexandria, the lasting monument to Classical wisdom, still produce exceptional minds, none more brilliant than the female philosopher Hypatia. A Neo-Platonist and a master of mathematics and astronomy, she teaches publicly on the principles of reason and science, drawing vast audiences from all corners of the Empire. Her work perfecting the astrolabe and the hydroscope is already aiding our navigators and engineers.\n\nHowever, her reliance on rigorous philosophical principles and empirical methods put her at odds with the increasingly powerful adherents of the official doctrine in the city, especially the Clergy who view her academy as a threat to their theological monopoly. Her knowledge of commerce and civil administration, derived from her mathematical rigour, is profound, but recruiting her risks exacerbating the philosophical and political tensions within the Eastern Prefecture."
 roman_characters_event.11.opt1:0 "Appoint her to the Imperial College of Science."
 roman_characters_event.11.opt2:0 "Let her advise us on matters of state philosophy and ethics."
 roman_characters_event.11.opt3:0 "Her mathematical mind will help stabilise our currency."
 roman_characters_event.11.refuse:0 "Her wisdom is too controversial for the current climate."

 # 12. TRIBONIAN
 roman_characters_event.12.t:0 "The Codifier of Laws"
 roman_characters_event.12.d:0 "For centuries, the vast body of Roman law, encompassing the edicts of the Republic and the decrees of a hundred Emperors, has become a labyrinth of contradictions, redundancy, and historical baggage, slowing justice to a crawl. Tribonian, a jurist and quaestor from the capital, has approached the Senate with a proposal of monumental ambition; the complete systematisation and codification of the entire Roman legal tradition into a single, comprehensive body of work, the Corpus Juris Civilis.\n\nHe argues that this immense labour will ensure legal uniformity across every Prefecture, stabilize commerce, and make Roman administration efficient once more. He is notoriously industrious and possesses a profound understanding of Imperial finance and treasury management, having served in several high fiscal posts. However, his work is extremely time consuming and requires absolute focus, potentially distracting him from his day to day duties of governing the Imperial coffers."
 roman_characters_event.12.opt1:0 "His legal mind must be put to use managing our treasury."
 roman_characters_event.12.opt2:0 "Let his understanding of value stabilise our currency."
 roman_characters_event.12.refuse:0 "The laws of Rome are fine as they are."

 # 13. NARSES
 roman_characters_event.13.t:0 "Narses, The Silent General"
 roman_characters_event.13.d:0 "Following the great campaigns of Belisarius, the Imperial Court needs a figure of quiet competence and administrative genius. Narses, a high ranking official, a chamberlain and chief treasurer, has proven that his skills extend far beyond the Imperial palace. Despite his frail appearance and his background in civilian governance, he is a masterful strategist, combining his intimate knowledge of the treasury with decisive military action.\n\nUnlike many flamboyant commanders, Narses is known for his patience, his reliance on superior logistics, and his ability to finance prolonged campaigns without bankrupting the state. He proved his mettle by raising vast armies from the Eastern Prefectures and leading them to improbable victory over the Goths in Italia, relying on swift cavalry manoeuvre and superior supply lines. He stands ready to serve the State, demanding only absolute authority over the men and resources under his command."
 roman_characters_event.13.opt1:0 "Give this steady hand command of a major Legion."
 roman_characters_event.13.opt2:0 "His administrative rigour is needed in the military high command."
 roman_characters_event.13.opt3:0 "Task him with modernising our fortifications and siege tools."
 roman_characters_event.13.opt4:0 "His logistical genius is best used ensuring our armies are fed and supplied."
 roman_characters_event.13.refuse:0 "He is an administrator, not a true field commander."

 # 14. ISIDORE OF SEVILLE
 roman_characters_event.14.t:0 "The Scholar of Sevilla"
 roman_characters_event.14.d:0 "From the far Western Prefecture of Hispania Baetica, a figure of staggering scholastic and academic authority has emerged: Isidore, the lead Scholar of Sevilla. Recognizing that the ancient knowledge of the Empire is fragmenting, he has undertaken the immense task of compiling a complete encyclopaedia of all human knowledge, sacred and secular, known as the Etymologiae. This work preserves the grammar, history, science, and Imperial Faith's doctrine of the Roman world, protecting it from obscurity.\n\nIsidore is a tireless champion of the official doctrine, capable of articulating complex philosophical arguments that defend the Imperial Faith against regional variations and other heretical doctrines. His influence over the Clergy and regional political affairs is absolute. Bringing him to the capital would consolidate Academic Authority across the Empire, but his fierce dedication to doctrinal purity may lead to the violent suppression of those who stray from the established Faith."
 roman_characters_event.14.opt1:0 "Welcome him to the Imperial Council as Chief Scholastic."
 roman_characters_event.14.opt2:0 "Task him with rooting out doctrinal heresy in the Western Prefectures."
 roman_characters_event.14.refuse:0 "His focus is too narrow; we need political minds."

 # 15. TARIQ IBN ZIYAD
 roman_characters_event.15.t:0 "Tariq, The Scourge of the Barbarians"
 roman_characters_event.15.d:0 "The Western Prefectures have long been troubled by restlessness along the vast Mauretanian frontier. Now, a general of Berber descent, Tariq ibn Ziyad, has risen to fame for his sheer audacity and brutal effectiveness in commanding the light infantry and cavalry along the African coast. He recently undertook a daring, unauthorized crossing of the strait separating Africa from Hispania, routing a massive barbarian coalition that threatened to destabilise the entire peninsula.\n\nHis speed and willingness to engage enemies in overwhelming force are legendary. His success at the great rock fortress overlooking the strait, now known as the Rock of Tariq, has earned him the honour of command over a major Roman army. He is a master of rapid deployment and manoeuvre, capable of swiftly crushing threats before they can consolidate. However, his methods are unconventional and he demands complete autonomy over his troops."
 roman_characters_event.15.opt1:0 "Grant him a full Legion; let him secure the West."
 roman_characters_event.15.opt2:0 "His leadership is best applied organising garrisons."
 roman_characters_event.15.opt3:0 "Use his experience to train lighter, faster Roman armies."
 roman_characters_event.15.refuse:0 "We do not reward unauthorised command."

 # 16. IBN RUSHD (AVERROES)
 roman_characters_event.16.t:0 "The Commentator of Cordoba"
 roman_characters_event.16.d:0 "The flourishing intellectual centre of Cordoba sends us a unique figure: Ibn Rushd, a jurist, philosopher, and medical scholar. His fame rests upon his voluminous commentaries on the works of Aristotle, which he insists must be read literally, without the theological overlay favoured by earlier scholars. He champions the rigorous application of reason, logic, and scientific inquiry in all aspects of life, even those pertaining to the Imperial Faith.\n\nHis rationalist approach is causing severe anxiety among the more traditional Clergy in the capital, who fear that excessive adherence to philosophy will corrupt the prevailing doctrine. He offers to serve the Empire as a jurist and academic, believing that a state governed by reasoned law and secular knowledge will achieve ultimate stability. Acquiring his service risks creating a major schism between the secular and religious authorities across the Empire."
 roman_characters_event.16.opt1:0 "Appoint him as a philosopher in the Imperial Academy."
 roman_characters_event.16.opt2:0 "Let him apply his reasoned logic to matters of State Doctrine."
 roman_characters_event.16.refuse:0 "His views are too divisive to be tolerated."

 # 17. MAIMONIDES
 roman_characters_event.17.t:0 "The Physician of the West"
 roman_characters_event.17.d:0 "Following a period of severe religious intolerance in Hispania, a family of distinguished thinkers has sought refuge in the more tolerant provinces of the Eastern Prefecture. From that lineage emerges Moses ben Maimon, known to the scholarly world as Maimonides. He is a physician of unparalleled renown, having served as the personal doctor to the Vizier of the Prefect of Aegyptus. Yet, his primary contribution is philosophical; he has authored a monumental treatise, The Guide for the Perplexed, which attempts to harmonize the science of Aristotle with the revealed Imperial Faith.\n\nHis works cover medicine, law, and philosophy with extraordinary depth and precision, aiming to prove that reason and Faith are not contradictory, but complementary paths to truth. Maimonides offers the Empire his comprehensive medical knowledge, which he codified in several texts, and his rationalist mind to improve the health and education of our civil service."
 roman_characters_event.17.opt1:0 "Appoint him to the Imperial College of Medicine and Science."
 roman_characters_event.17.refuse:0 "We have enough philosophers already."

 # 18. LEONARDO FIBONACCI
 roman_characters_event.18.t:0 "The Master of Calculation"
 roman_characters_event.18.d:0 "A merchant's son from the city of Pisa, Leonardo Fibonacci, has returned from his travels along the African coast and Eastern trade routes with revolutionary knowledge. The Roman world still relies on the cumbersome abacus and the complex system of Roman numerals for calculation. Fibonacci, however, champions the Hindu-Arabic numeral system, which includes the concept of zero; a symbol unknown to the West but essential for complex mathematics. \n\nHis foundational work, Liber Abaci, demonstrates the ease with which merchants could calculate profit, loss, and interest using this new positional system. He offers the Empire a complete overhaul of its Treasury and Mint, promising efficiency gains that will render the old Imperial counting methods obsolete. His work, while initially met with skepticism by traditional Roman accountants, promises to revolutionize commerce, administration, and public works if adopted widely."
 roman_characters_event.18.opt1:0 "Appoint him Imperial Treasurer to reform our accounting."
 roman_characters_event.18.opt2:0 "Let him supervise the Mint and implement the new numerals."
 roman_characters_event.18.opt3:0 "Commission his mathematical genius for engineering and public works."
 roman_characters_event.18.refuse:0 "We trust our abacus more than this Eastern superstition."

 # 19. THOMAS AQUINAS
 roman_characters_event.19.t:0 "The Dumb Ox of Naples"
 roman_characters_event.19.d:0 "The scholar Thomas Aquinas hails from an influential landowning family near Naples. During his academic career, his slow, deliberate manner of speaking earned him the mocking nickname, 'The Dumb Ox' from his peers. However, his intellectual output has proven that his mind is anything but dull. He is the pre-eminent figure in the Scholastic movement, attempting to synthesize the rediscovered philosophy of Aristotle with the tenets of the Imperial Faith.\n\nHis masterpiece, Summa Theologiae, is a vast, systematic work that uses rigorous Aristotelian logic to structure and defend the established Faith, providing an intellectual bulwark against heresy and philosophical challenges. His method is systematic, detailed, and utterly comprehensive. Bringing Aquinas to the capital will provide the State with an unparalleled theological authority to unify religious thought across the Empire, while also benefiting from his wide ranging study of ethics and natural science."
 roman_characters_event.19.opt1:0 "Appoint him as the chief Theologian of the Empire."
 roman_characters_event.19.opt2:0 "Let him apply his systematic method to our Imperial science."
 roman_characters_event.19.refuse:0 "His loyalty is too split between the Church and the Empire."

 # 20. RODRIGO DIAZ DE VIVAR (EL CID)
 roman_characters_event.20.t:0 "El Cid, The Master"
 roman_characters_event.20.d:0 "The Hispanian Prefecture has produced a military legend in Rodrigo Diaz de Vivar, known widely by the epithet El Cid, meaning 'The Master'. His reputation was forged not in the service of a single ruler, but by his sheer, brutal effectiveness as a commander of mercenary and provincial forces. He has demonstrated total command over diverse troops, from heavy Roman cavalry to light Hispanian skirmishers, earning respect even from the rebel warlords he defeats.\n\nHis tactical prowess is matched only by his political independence. He holds the city of Valencia as his own domain, having carved out a semi-autonomous zone while ostensibly serving the Imperial authority. To admit such a powerful and popular commander into direct service is a risk; his loyalty is conditional, but his skill in battle is priceless. He offers his sword to the State, or perhaps, he is simply taking the State for himself."
 roman_characters_event.20.opt1:0 "Bring this great General to lead our main armies."
 roman_characters_event.20.opt2:0 "Allow him to seize the title and govern the province."
 roman_characters_event.20.opt3:0 "Appoint him Commandant to reorganize our training regimen."
 roman_characters_event.20.opt4:0 "His logistical skill is best used organizing the supply lines."
 roman_characters_event.20.refuse:0 "Such conditional loyalty is unacceptable."
 
 # 21. IBN KHALDUN
 roman_characters_event.21.t:0 "The Sociologist of Tunis"
 roman_characters_event.21.d:0 "The Maghrebian Prefecture sends us an extraordinary scholar: Ibn Khaldun, a jurist, academic, and statesman from Tunis. After serving in the tumultuous courts of the North African and Hispanian Prefectures, he composed a profound historical work, the Muqaddimah, which argues that civilizations follow cyclical patterns of rise and fall governed by social cohesion and decadence. He analyzes the forces of nomadic 'Asabiyyah', or group solidarity, and its ability to overcome the settled populations of the Empire.\n\nHis work is revolutionary, arguing that history is not merely a record of rulers, but a science subject to laws. He offers the Empire his services, bringing not only theoretical philosophical insight but also practical experience as a diplomat and administrator, having navigated the treacherous politics of the Western and African provinces. His insights into the collapse of regimes could prove invaluable to the stability of the entire Empire."
 roman_characters_event.21.opt1:0 "Let him apply his philosophy to the mechanics of the state."
 roman_characters_event.21.opt2:0 "His political experience is needed in the Imperial Court."
 roman_characters_event.21.opt3:0 "Send him as a diplomat to negotiate with the steppe hordes."
 roman_characters_event.21.refuse:0 "He is an academic; his theories are too abstract for governance."

 # 22. FILIPPO BRUNELLESCHI
 roman_characters_event.22.t:0 "The Master of Perspective"
 roman_characters_event.22.d:0 "The city of Florentia has become the centre of a revolution in the arts, largely due to the genius of Filippo Brunelleschi. Trained as a goldsmith, he is now recognized as the foremost architect of his generation. His most famous achievement is the design and erection of the great dome of the Florentine Cathedral, a feat of engineering thought impossible since the classical era; he developed new hoisting machinery and structural methods entirely through intellectual effort.\n\nMore fundamentally, he is credited with rediscovering the mathematical laws of linear perspective, which are transforming all Roman art and design. He is also a skilled military engineer, capable of designing complex fortifications and siege weaponry. His mind is a perfect synthesis of aesthetic genius and practical application, a true revival of the classical Roman spirit. He demands vast funds to pursue his grand architectural schemes, promising structures that will stand for a thousand years."
 roman_characters_event.22.opt1:0 "Commission him to sculpt and build magnificent monuments."
 roman_characters_event.22.opt2:0 "Task him with modernizing our fortifications and military camps."
 roman_characters_event.22.refuse:0 "We have greater need for legions than for domes."

 # 23. DONATELLO
 roman_characters_event.23.t:0 "The Father of Renaissance Sculpture"
 roman_characters_event.23.d:0 "Another product of the Florentine artistic revolution, Donatello, stands as the most influential sculptor since the days of Imperial Rome. Breaking from the stylized, flat medieval forms, his work focuses on realistic human anatomy, dynamic movement, and expressive emotionality. He revolutionized the shallow relief technique and revived the classical nude form, imbuing his bronze and marble works with lifelike psychological depth.\n\nHis patrons are some of the wealthiest families in the Empire, and his workshop is a training ground for the next generation of Roman artists. His presence in the capital would greatly enhance the prestige of the state and signal a revival of classical ideals. He is often temperamental, however, and requires immense artistic freedom and generous patronage to produce his works."
 roman_characters_event.23.opt1:0 "Offer him generous patronage to sculpt for the Imperial City."
 roman_characters_event.23.refuse:0 "His style is perhaps too shocking for traditional tastes."

 # 24. GJERGJ KASTRIOTI (SKANDERBEG)
 roman_characters_event.24.t:0 "The Albanian Dragon"
 roman_characters_event.24.d:0 "From the wild mountains of the Balkans comes Gjergj Kastrioti, known by his military epithet, Skanderbeg, a commander of unsurpassed tactical skill in mountain warfare. He has spent his life fighting fiercely against the various rebel warlords and barbarian confederations that plague the Balkan Prefecture, often relying on small, highly mobile forces and ambushes to defeat enemies vastly superior in number.\n\nHis military career is a continuous campaign of daring and defiance, making him a symbol of resistance in the fractured border provinces. Although his command is currently localized, he possesses a statesman's understanding of how to manage tribal loyalties and forge alliances out of necessity. He offers his sword and his political acumen to the state, but his history of local autonomy suggests a restless spirit and a reluctance to fully submit to central authority. Granting him supreme command, or even the title of governor, may secure the border, but it invites future instability."
 roman_characters_event.24.opt1:0 "Appoint him General of the Balkan Legions."
 roman_characters_event.24.opt2:0 "His experience is invaluable for training our light infantry."
 roman_characters_event.24.opt3:0 "Utilize his political skill to pacify the tribal territories."
 roman_characters_event.24.opt4:0 "Let him rule the Balkans from Rome."
 roman_characters_event.24.refuse:0 "His loyalty is too regional to be trusted."

 # 25. GEMISTUS PLETHO
 roman_characters_event.25.t:0 "The Neo-Platonist of Morea"
 roman_characters_event.25.d:0 "Gemistus Pletho, a philosopher from Morea, represents the highest expression of classical thought surviving in the Empire. He is a passionate revivalist of the original Hellenic wisdom and Neo-Platonism, arguing that the Empire's spiritual and intellectual renewal depends entirely on returning to the ancient philosophical roots of Greece. He has created an academy in Mistra, attracting scholars from across the Empire who seek classical learning.\n\nHis ideas are radical; he proposes sweeping social and political reforms based on Plato's Republic, and he is deeply critical of the established Imperial Faith, believing it lacks the intellectual rigour necessary for true societal order. This stance has drawn the intense scrutiny of the Clergy. He offers his profound philosophical insights to the state, though his presence in the capital will inevitably ignite a divisive intellectual conflict between tradition and revivalism."
 roman_characters_event.25.opt1:0 "Embrace his philosophy; let him reform the Imperial Academy."
 roman_characters_event.25.opt2:0 "Appoint him Chief Censor to suppress dangerous new philosophical trends."
 roman_characters_event.25.refuse:0 "His ideas are too dangerously heterodox."
 
 # 26. AMERIGO VESPUCCI
 roman_characters_event.26.t:0 "The Map Maker of Florentia"
 roman_characters_event.26.d:0 "Amerigo Vespucci, a meticulous Florentine merchant and map maker, has returned from multiple voyages across the great Western Ocean. Unlike those who merely charted islands, Vespucci insists that the vast coastline discovered is not the fringe of Cathay, but an entirely new continental landmass, separated from Asia by a huge, unexplored ocean. His detailed letters and accounts have convinced the scholarly class that Rome has stumbled upon not the Indies, but a Nova Roma; a New World.\n\nHis cartographical skills are unparalleled, combining classical learning with empirical data gathered during his travels. While previously employed by the maritime faction of the Hispanian Prefectures, he has now petitioned the central Imperial Court for direct employment, promising to produce maps of such detail that they will ensure Roman dominance over the entire new hemisphere. Employing him would solidify the understanding of our new territories."
 roman_characters_event.26.opt1:0 "Send him back to chart the coastlines of the New World."
 roman_characters_event.26.opt2:0 "Let him train our naval captains in navigation and geography."
 roman_characters_event.26.opt3:0 "Appoint him governor over the early settlements."
 roman_characters_event.26.refuse:0 "We shall wait for others to confirm his extravagant claims."

 # 27. VASCO DA GAMA
 roman_characters_event.27.t:0 "The Admiral of the East Route"
 roman_characters_event.27.d:0 "For decades, Roman merchants have been forced to rely on costly land routes and middlemen to acquire the spices of the East. Now, Vasco da Gama, an experienced mariner from the coastal Prefecture of Lusitania, proposes a daring naval solution. He insists that by sailing south around the entire African continent, the 'Cape of Storms', he can find a direct sea route to the markets of India, completely bypassing the established Mediterranean trade networks.\n\nHe is known for his iron discipline and his relentless pursuit of efficiency. While his proposal was initially rejected by the Procurator of Lusitania, who deemed the voyage too long and dangerous, Da Gama's confidence is infectious. Granting him a small fleet to attempt this circumnavigation of Africa promises unimaginable wealth for the Imperial coffers, provided his ships survive the journey through the tumultuous southern seas and the hostile native populations."
 roman_characters_event.27.opt1:0 "Fund his expedition to find the sea route to India."
 roman_characters_event.27.opt2:0 "His experience is needed to navigate the treacherous South Atlantic."
 roman_characters_event.27.opt3:0 "He is the right man to govern any trading posts established in the East."
 roman_characters_event.27.refuse:0 "The risk of losing ships and crew is too great."

 # 28. FERDINAND MAGELLAN
 roman_characters_event.28.t:0 "The Circumnavigator"
 roman_characters_event.28.d:0 "Ferdinand Magellan, a captain originally from the same Prefecture as Da Gama, has presented the Imperial Admiralty with an even more audacious plan: a complete circumnavigation of the globe. He argues that by sailing westwards, past the new continental mass, he can find a strait that leads directly to the Spice Isles, proving once and for all that the Earth is a continuous sphere, not merely a flat disc surrounded by ocean.\n\nMagellan is a brilliant navigator but has a reputation for insubordination and a fierce temper, having fallen out with several Prefectural admirals over slights to his honour. Despite these flaws, his conviction is unmatched. If he succeeds, his voyage would be the single greatest achievement in Roman naval history, shattering all traditional geographical understanding. We must decide whether to invest vast resources in a man whose success will bring eternal glory, but whose failure means certain ruin."
 roman_characters_event.28.opt1:0 "Invest heavily in this historic voyage."
 roman_characters_event.28.opt2:0 "Appoint him chief navigator to oversee our Western fleet."
 roman_characters_event.28.opt3:0 "He can be entrusted to govern a colony far from the capital."
 roman_characters_event.28.refuse:0 "His plan is too risky and his temper too volatile."

 # 29. HERNAN CORTES
 roman_characters_event.29.t:0 "The Captain of Fortune"
 roman_characters_event.29.d:0 "From the province of Extremadura in Hispania comes Hernan Cortes, a man whose ambition burns brighter than the tropical sun. Cortes has spent years as a minor official in the new Western colonies, learning the native languages and customs, but his heart is set on glory and gold. He believes that deep in the interior of the new continental landmass lies a massive, sophisticated native empire, ripe for conquest and plunder. He seeks command of an expeditionary force, intending to march inland and subdue this empire using audacity, diplomacy, and ruthlessness.\n\nHis actions are often independent and border on outright piracy, but his military and diplomatic talents are undeniable; he knows how to exploit internal divisions amongst the native tribes. Recruiting him as a Conquistador would unleash a terrible, efficient engine of conquest, promising unimaginable riches, but his lack of respect for law or authority guarantees future problems for the Imperial governance of the new territories."
 roman_characters_event.29.opt1:0 "Grant him the authority to conquer and settle the interior."
 roman_characters_event.29.opt2:0 "Utilize his military talents on the frontiers."
 roman_characters_event.29.opt3:0 "Appoint him Governor; his talents are best used maintaining order."
 roman_characters_event.29.refuse:0 "His methods are too brutal and unlawful."

 # 30. MIMAR SINAN
 roman_characters_event.30.t:0 "The Imperial Architect"
 roman_characters_event.30.d:0 "The construction of monuments in the Imperial Capital of Constantinople has reached new heights of sophistication under the guidance of Mimar Sinan. Originally trained as a military engineer, he applied his knowledge of geometry, physics, and material strength to the construction of enormous civic and religious structures. His masterpiece, the Suleymaniye, is a sublime blend of classical Roman design with Eastern innovation, demonstrating a harmony of form and function thought lost since the days of the Great Architects.\n\nSinan is not merely an artist; he is a master engineer who designed complex infrastructure, including aqueducts and bridges, while also supervising the construction and defence of our border fortifications. Bringing him into the direct employ of the state would ensure that all Imperial construction, from basilicas and academies to barracks and siege lines, benefits from his genius, securing both the Empire's cultural legacy and its military future."
 roman_characters_event.30.opt1:0 "Commission him to design a new set of Imperial buildings."
 roman_characters_event.30.opt2:0 "Utilize his genius for the construction of fortifications and bridges."
 roman_characters_event.30.refuse:0 "His projects are too expensive and long term."
 
 # 31. MIGUEL DE CERVANTES
 roman_characters_event.31.t:0 "The Satirist of La Mancha"
 roman_characters_event.31.d:0 "Miguel de Cervantes, a veteran of the Imperial Navy who lost the use of his left hand fighting against the Eastern hordes at the Battle of Lepanto, has turned his considerable wit and philosophical insight toward literature. His recently published masterpiece, Don Quixote, is a biting, satirical commentary on the rigid bureaucracy and absurd idealism of the late Imperial Age, chronicling the misadventures of a delusional knight and his pragmatic servant.\n\nHis work is immensely popular but deeply unsettling to the ruling classes, as it mocks the chivalric traditions that underpin much of the Hispanian military culture. Cervantes possesses a deep understanding of human folly and honour, which could be channelled into advising the state on matters of morale and ethics. He offers to serve the Imperial Court, provided he is granted the freedom to continue his philosophical observations of Roman society."
 roman_characters_event.31.opt1:0 "Appoint him a Philosopher to the Imperial Academy."
 roman_characters_event.31.opt2:0 "Commission him to compose grand epics that truly honour the state."
 roman_characters_event.31.refuse:0 "His satire is dangerous and should not be encouraged."

 # 32. GALILEO GALILEI
 roman_characters_event.32.t:0 "The Starry Messenger"
 roman_characters_event.32.d:0 "The scientific world is in turmoil due to the radical findings of Galileo Galilei, a natural philosopher and mathematician from Pisa. Having refined the new optical device known as the telescope, Galileo has turned it towards the heavens, discovering four moons orbiting Jupiter and the true nature of the moon's surface. These observations provide powerful, undeniable evidence supporting the heliocentric theory; the idea that the Earth revolves around the Sun, rather than the Sun around the Earth.\n\nThis finding is in direct contradiction with the official astronomical models endorsed by the highest academic and religious authorities of the Empire. Galileo is facing severe scrutiny from the Clergy, who fear his findings undermine the established order of the cosmos. Recruiting him would instantly grant the Imperial Science College the greatest observational astronomer of the age, but risks igniting a public conflict between empirical science and religious dogma."
 roman_characters_event.32.opt1:0 "Welcome him to the Imperial Academy and fund his continued research."
 roman_characters_event.32.refuse:0 "We cannot afford to contradict the accepted cosmic order."

 # 33. ARTEMISIA GENTILESCHI
 roman_characters_event.33.t:0 "The Baroque Master of Rome"
 roman_characters_event.33.d:0 "Artemisia Gentileschi, a Roman native and the daughter of a prominent painter, has achieved fame as one of the most talented and psychologically profound artists of the Baroque era. Her masterful use of tenebrism and her focus on powerful female figures in dramatic scenes have earned her the admiration of courts across the Empire, including the highest levels of the aristocracy in Neapolis and Florence.\n\nHer access to the upper echelons of society, combined with her acute powers of observation honed through portraiture, gives her a unique insight into the secrets and intrigues of the Empire's elite. While her official capacity is artistic, her sharp mind and fierce discretion suggest a talent for more clandestine affairs. She offers to lend her artistic skill and social network to the service of the state."
 roman_characters_event.33.opt1:0 "Commission her to paint the great scenes of Roman history."
 roman_characters_event.33.opt2:0 "Utilize her network and observational skill as a Spymaster."
 roman_characters_event.33.refuse:0 "We have enough artists in the capital."

 # 34. GIAN LORENZO BERNINI
 roman_characters_event.34.t:0 "The Sculptor of Grandeur"
 roman_characters_event.34.d:0 "Gian Lorenzo Bernini, born in the southern Italian Prefecture of Neapolis, is without question the most influential artistic figure of the seventeenth century, mastering sculpture, architecture, and painting. His work defines the Baroque style, characterized by dramatic emotion, theatricality, and movement. His greatest architectural achievements are concentrated in the capital, transforming Roman civic spaces into monuments of Imperial grandeur.\n\nBernini is not only an artist, but a practical engineer who has worked on waterworks and military designs, making him capable of blending aesthetics with structural necessity. Though he faces intense rivalry with other architects who envy his immense success and influence, his ability to execute massive, transformative public works is precisely what the Empire needs to project an image of unstoppable power and sophistication to the world."
 roman_characters_event.34.opt1:0 "Appoint him Chief Architect for all Imperial building projects."
 roman_characters_event.34.opt2:0 "Utilize his engineering genius for our fortifications and water supply."
 roman_characters_event.34.refuse:0 "His baroque style is too excessive and expensive."

 # 35. ANTONIO VIVALDI
 roman_characters_event.35.t:0 "The Red Priest of Venice"
 roman_characters_event.35.d:0 "The city of Venetia, with its opulent canals and flourishing theatres, has given rise to Antonio Vivaldi, a prolific composer and musician. Though known as the famous Red Haired Priest due to his distinctive hair colour, he is primarily recognized as a composer of dazzling speed and invention, writing hundreds of concertos, operas, and sacred pieces that are performed across every Prefecture of the Empire.\n\nHis music is characterized by its dramatic contrasts, intricate rhythms, and virtuoso solo passages, marking him as one of the greatest masters of the Baroque musical tradition. Bringing Vivaldi into the direct service of the Imperial Court would elevate the cultural standing of the capital and provide a constant stream of new musical works to celebrate Imperial triumphs and ceremonies."
 roman_characters_event.35.opt1:0 "Appoint him composer and master of the Imperial Orchestra."
 roman_characters_event.35.refuse:0 "His constant demands for performances are disruptive."
 
 # 36. VOLTAIRE
 roman_characters_event.36.t:0 "The Sceptic of Paris"
 roman_characters_event.36.d:0 "From the Gallic Prefecture comes Francois-Marie Arouet, known by his pen name, Voltaire. The preeminent philosopher of the Age of Enlightenment, he wields satire and wit as his primary weapons, targeting political corruption, the rigid structure of the Clergy, and the archaic injustices of Imperial law. He champions the ideals of free speech, tolerance, and separation of governance from the official Faith, becoming a thorn in the side of traditional authorities.\n\nVoltaire's writings are celebrated across Europe, influencing rulers and prefects alike with their calls for rational reform. He has spent time in exile, demonstrating his resilience and commitment to his principles, which are often summarized as 'Ecrasez l'infame'; destroy the infamous thing. Bringing him into the service of the state would align Rome with the most progressive intellectual currents of the age, but his demands for radical reform may be difficult to satisfy."
 roman_characters_event.36.opt1:0 "Appoint him as a philosopher to reform our ethical principles."
 roman_characters_event.36.opt2:0 "Utilize his influence and diplomatic connections."
 roman_characters_event.36.refuse:0 "His attacks on established order are too destabilizing."

 # 37. WOLFGANG AMADEUS MOZART
 roman_characters_event.37.t:0 "The Genius of Salzburg"
 roman_characters_event.37.d:0 "The Prefecture of Noricum sends forth a composer of unprecedented genius: Wolfgang Amadeus Mozart. A child prodigy who astonished the Imperial Courts since his youth, Mozart has matured into a master who synthesizes the entire European musical tradition, producing operas, symphonies, and concertos of astonishing depth and emotional power. His melodies are recognizable across the whole Empire, and his output is prolific, though his personal finances are often in disarray.\n\nMozart's music defines the highest achievements of the Classical style, blending popular accessibility with profound complexity. His works are often revolutionary in their dramatic structure and orchestral complexity, making him a central figure in the cultural life of the Empire. Securing his patronage would ensure the Imperial Court remains the cultural centre of the civilized world, though his flamboyant character may clash with the rigid protocol of the Senate."
 roman_characters_event.37.opt1:0 "Grant him a generous stipend as Imperial Court Composer."
 roman_characters_event.37.refuse:0 "He is a brilliant musician but a chaotic administrator."

 # 38. JOHANN WOLFGANG VON GOETHE
 roman_characters_event.38.t:0 "The Universal Man of Frankfurt"
 roman_characters_event.38.d:0 "Johann Wolfgang von Goethe is the embodiment of the Roman concept of the universal man; a poet, playwright, novelist, philosopher, scientist, and high-ranking civil servant. Born in the German Prefecture, he is celebrated for his dramatic works, including the epic tragedy Faust, which grapples with the ambition, knowledge, and moral limits of modern man.\n\nBeyond literature, he has served for decades as a respected statesman in the Provincial Courts, dealing with complex administrative and financial affairs. Furthermore, he is an avid natural scientist, having developed significant, albeit controversial, theories on light and botanical morphology. Recruiting Goethe would bring a staggering intellect to the Imperial Court, capable of advising on literature, philosophy, and practical governance simultaneously."
 roman_characters_event.38.opt1:0 "Utilize his decades of experience in high civil administration."
 roman_characters_event.38.opt2:0 "Commission him to compose a new foundational epic for Rome."
 roman_characters_event.38.opt3:0 "Fund his scientific research into the nature of light and colour."
 roman_characters_event.38.refuse:0 "His focus is too divided among too many disciplines."

 # 39. ARTHUR WELLESLEY
 roman_characters_event.39.t:0 "The Iron Duke of Dublin"
 roman_characters_event.39.d:0 "Arthur Wellesley, hailing from the Hibernian Prefecture, is renowned across the military establishment for his methodical discipline, cautious strategy, and unwavering competence. He rose to fame commanding Roman forces in various colonial conflicts and civil wars, mastering the combined arms tactics necessary to defeat rebel warlords and the large field armies of the various usurpers who have threatened the State.\n\nHis greatest success came at the Battle of Waterloo, where his disciplined use of infantry squares and superior positioning decisively crushed the forces of the would be Emperor Napoleone. Wellesley is known as the 'Iron Duke' due to his rigid command style and his imperviousness to pressure. He possesses extensive knowledge of supply lines, logistics, and military engineering. Recruiting him ensures that the state gains the most reliable and tactically adept military commander of the modern era."
 roman_characters_event.39.opt1:0 "Appoint him General in Chief of the entire Imperial Army."
 roman_characters_event.39.opt2:0 "Task him with command and control of our primary military bases."
 roman_characters_event.39.opt3:0 "Utilize his knowledge to fortify the most vulnerable frontiers."
 roman_characters_event.39.opt4:0 "Place him in charge of reforming the entire army command structure."
 roman_characters_event.39.refuse:0 "His personal demands for command are excessive."

 # 40. GIUSEPPE GARIBALDI
 roman_characters_event.40.t:0 "The Hero of the Two Worlds"
 roman_characters_event.40.d:0 "The tumultuous politics of the nineteenth century have given rise to Giuseppe Garibaldi, a native of the Alpine Prefecture of Nicaea, and a fervent advocate for a unified and revitalized Roman State based on popular will. A master of guerrilla warfare, he leads a devoted corps of volunteers, the famed 'Red Shirts', who have fought in civil wars across the Empire, from the South American colonies to the Italian heartland. His charismatic leadership and military audacity are unmatched; he commands the absolute loyalty of the common people.\n\nGaribaldi's goal is not merely to serve an Emperor or Senate, but to establish a true, democratic Roman state. He offers his sword to the cause of stabilizing the Empire, but his primary ambition is political reform. His ability to rally commoners to the cause makes him an incredibly potent military leader, but his democratic ideals are a clear and present threat to the traditional structure of authority."
 roman_characters_event.40.opt1:0 "Bring this charismatic General into the official command structure."
 roman_characters_event.40.opt2:0 "His unique leadership style is best applied organising garrisons."
 roman_characters_event.40.opt3:0 "Use his experience to train lighter, faster Roman armies."
 roman_characters_event.40.opt4:0 "Allow him to seize control and declare a new Roman State."
 roman_characters_event.40.refuse:0 "We cannot allow democratic sentiments to spread."
 
 # 41. CAMILLO BENSO (CAVOUR)
 roman_characters_event.41.t:0 "The Realpolitik of Turin"
 roman_characters_event.41.d:0 "Camillo Benso, Count of Cavour, is a political genius from the Alpine Prefecture of Turin, known for his relentless pragmatism and his belief that the ends of state power justify the means. He is a master of political manoeuvring, economic liberalization, and covert diplomacy, having previously served as Prime Minister to the regional Roman Viceroy.\n\nCavour is a staunch advocate for modernization, free trade, and investment in infrastructure, but he is equally adept at orchestrating secret diplomatic alliances and utilizing spy networks to undermine rivals within the central administration. His immediate goal is the political unification and modernization of the entire Western Prefecture under a single, liberal government. Recruiting him would give the state an extremely talented, if morally ambiguous, statesman capable of rapid administrative and economic transformation."
 roman_characters_event.41.opt1:0 "Bring him to the Imperial Council as Statesman."
 roman_characters_event.41.opt2:0 "Appoint him Spymaster; his networks are invaluable."
 roman_characters_event.41.opt3:0 "Utilize his economic genius to reform the currency."
 roman_characters_event.41.opt4:0 "Send him abroad to secure diplomatic alliances."
 roman_characters_event.41.refuse:0 "His liberal tendencies are too dangerous for the established order."

 # 42. FLORENCE NIGHTINGALE
 roman_characters_event.42.t:0 "The Lady with the Lamp"
 roman_characters_event.42.d:0 "Florence Nightingale, a wealthy Roman citizen born in Florentia, has gained renown across the Empire for her relentless pursuit of sanitary reform. During the recent catastrophic war against the steppe tribes in the Danube frontier, she travelled to the field hospitals and discovered that more soldiers were dying from disease and poor sanitation than from combat wounds. She established revolutionary standards of cleanliness, nursing, and efficient ward management, drastically reducing mortality rates.\n\nNightingale is not merely a nurse; she is a rigorous statistician and a master of logistical efficiency, using detailed data analysis to prove the link between environment and disease. Her skills are invaluable for calculating supply needs, budgeting, and ensuring the health of the civilian population. She offers to serve the state, but insists on full authority to implement sanitary reform throughout the entire military and administrative structure."
 roman_characters_event.42.opt1:0 "Utilize her talent for statistical analysis in the Imperial Mint."
 roman_characters_event.42.opt2:0 "Fund her research into public health and sanitation."
 roman_characters_event.42.opt3:0 "Appoint her Quartermaster General to organize military supply."
 roman_characters_event.42.refuse:0 "Her insistence on disrupting military tradition is annoying."

 # 43. NIKOLA TESLA
 roman_characters_event.43.t:0 "The Master of Lightning"
 roman_characters_event.43.d:0 "From the wild Balkan province of Lika comes Nikola Tesla, a visionary inventor whose concepts threaten to overthrow the established mechanical and electrical standards of the Empire. He is the champion of alternating current, a system he insists is superior to the direct current favoured by rival Imperial engineers. His inventions, including the induction motor and designs for wireless power transmission, promise to revolutionize the energy infrastructure of the entire Empire.\n\nTesla is notoriously eccentric and terrible at financial management, often losing patents and funding due to his grand, impractical schemes, yet his intellectual output is staggering. He possesses a secretive, almost paranoid nature, which has given him a unique insight into the methods of industrial espionage and counter intelligence. Recruiting him would instantly place Rome at the forefront of the new electrical age."
 roman_characters_event.43.opt1:0 "Fund his research into alternating current and wireless energy."
 roman_characters_event.43.opt2:0 "Utilize his paranoia and knowledge of technology for intelligence."
 roman_characters_event.43.refuse:0 "His alternating current ideas are far too dangerous."

 # 44. MARIE CURIE
 roman_characters_event.44.t:0 "The Pioneer of the Atomic Age"
 roman_characters_event.44.d:0 "Marie Curie, a tireless natural philosopher from the northern city of Warsaw, has redefined physics through her groundbreaking work on radioactivity. Working in poorly equipped laboratories, she successfully isolated new, powerful radioactive elements. Her discoveries have earned her the highest academic honour, including the recognition of her peers across the Imperial scientific world.\n\nHer work immediately revolutionized the field of chemistry and promised vast applications in medicine, particularly for diagnostic imaging and therapy. She is a woman of immense scientific rigour and personal sacrifice, dedicated entirely to the expansion of human knowledge. Recruiting her would give Rome an unparalleled lead in the coming atomic age, though her research involves new, powerful materials that pose unknown health hazards."
 roman_characters_event.44.opt1:0 "Provide her with the resources to continue her research into radioactivity."
 roman_characters_event.44.refuse:0 "Her materials are too dangerous to have near the capital."

 # 45. MUSTAFA KEMAL
 roman_characters_event.45.t:0 "The Founder"
 roman_characters_event.45.d:0 "The long decline of the Empire has been met by internal collapse and external aggression, but from the ruins emerges Mustafa Kemal, a brilliant military officer born in Thessaloniki. Kemal rose to prominence during the chaotic period of Imperial Civil War, successfully commanding the defence of key Anatolian positions against rival warlords and foreign invaders.\n\nHe is not merely a soldier, but a radical modernizer and uncompromising secularist who blames the Empire's weakness on its antiquated institutions and its subjugation to the Clergy. He advocates for rapid social and political reform, including the establishment of a modern, functional Roman state free from religious and traditional constraints. His military genius and political vision make him the only figure capable of preserving the integrity of the state in the modern era, but his revolutionary methods will destroy the ancient structure of Roman society."
 roman_characters_event.45.opt1:0 "Appoint him General in Chief to command the entire military."
 roman_characters_event.45.opt2:0 "Bring him into the Imperial Council as a Reform Statesman."
 roman_characters_event.45.opt3:0 "Task him with modernizing our military doctrine and training."
 roman_characters_event.45.opt4:0 "Allow him to seize the reins of the state and found the new Republic."
 roman_characters_event.45.refuse:0 "His radicalism is too destructive to the Empire's traditions."
 
 # 46. PABLO PICASSO
 roman_characters_event.46.t:0 "The Andalusian Cubist"
 roman_characters_event.46.d:0 "Pablo Picasso, a painter from the Hispanian province of Malaca, is perhaps the most radically transformative artistic figure of the modern era. He is the principal pioneer of Cubism, a style that shattered the millennia old classical tradition of perspective and representation, depicting the world as fragmented planes and geometric forms. His work, which is often controversial and disturbing, reflects the chaos and fracturing of the post Imperial Civil War age.\n\nPicasso commands immense influence in the global art world, though his style is dismissed by traditionalists as an assault on beauty and order. Bringing him into the service of the state would signal Rome's embrace of the cultural avant garde and the profound artistic shifts of the twentieth century. His commissions are extremely expensive, but they guarantee the Imperial City remains a centre of intellectual ferment and artistic innovation."
 roman_characters_event.46.opt1:0 "Commission him to paint a series of modernist Imperial murals."
 roman_characters_event.46.refuse:0 "His art is too controversial and expensive for our treasury."

 # 47. GUGLIELMO MARCONI
 roman_characters_event.47.t:0 "The Wireless Pioneer"
 roman_characters_event.47.d:0 "Guglielmo Marconi, an inventor from the Romagnan city of Bononia, has successfully translated the theoretical work of physicists into a powerful, practical technology: wireless telegraphy. He demonstrated that Hertzian waves could be used to transmit signals across vast distances without cables, an innovation that promises to revolutionize global communication, military command, and public information dissemination.\n\nThis technology makes instant communication between the capital and the most distant provinces possible, solving long standing issues of administrative delay and logistical coordination. His expertise is crucial not only for scientific development but also for the practical application of his inventions to the military supply chain and the coordination of the Imperial legions across the enormous extent of the Roman territories."
 roman_characters_event.47.opt1:0 "Fund his research into wireless broadcasting and radio."
 roman_characters_event.47.opt2:0 "Utilize his technology to coordinate military supply lines and forces."
 roman_characters_event.47.refuse:0 "His wireless technology is unreliable and unproven."

 # 48. ENRICO FERMI
 roman_characters_event.48.t:0 "The Architect of the Atomic Age"
 roman_characters_event.48.d:0 "The physics department in the capital has produced a mind of devastating clarity: Enrico Fermi. A theoretician and an experimentalist of equal skill, Fermi is the undisputed master of neutron physics. His work has demonstrated the possibility of controlled nuclear chain reactions, proving that the immense energy locked within the atom can be released for human use.\n\nHe has successfully constructed the first working atomic reactor in an underground laboratory, demonstrating the fundamental feasibility of generating unprecedented amounts of power or, conversely, unleashing unimaginable destructive force. Recruiting Fermi would place Rome at the very forefront of the modern scientific world, granting exclusive access to the theoretical underpinnings of atomic power, a technology that will irrevocably change warfare and industry."
 roman_characters_event.48.opt1:0 "Grant him unlimited funding to harness the power of the atom."
 roman_characters_event.48.refuse:0 "His research is too dangerous and unethical."

 # 49. ENZO FERRARI
 roman_characters_event.49.t:0 "The Motorsport Magnate"
 roman_characters_event.49.d:0 "Enzo Ferrari, hailing from Mutina, is an icon of modern engineering, speed, and commerce. Originally a racing driver, he translated his obsession with performance into the manufacturing of high speed vehicles. His company is renowned for its innovative engine design, meticulous material science, and superior mechanical engineering, often incorporating military grade technology into civilian applications.\n\nFerrari's expertise lies in much more than luxury cars; he understands the rigorous logistical and mechanical demands of high performance engineering, making him an excellent Quartermaster candidate. Furthermore, his vehicles are highly sought after across the global elite, making him a master of high value, international trade. Recruiting him would align Imperial manufacturing with the pursuit of modern mechanical perfection."
 roman_characters_event.49.opt1:0 "Appoint him to the Imperial Council of Mechanical Science."
 roman_characters_event.49.opt2:0 "Utilize his organizational skills for military transport logistics."
 roman_characters_event.49.opt3:0 "Appoint him as a state trader for high value goods."
 roman_characters_event.49.refuse:0 "His obsession with speed is frivolous."

 # 50. WERNHER VON BRAUN
 roman_characters_event.50.t:0 "The Rocket Scientist"
 roman_characters_event.50.d:0 "Wernher von Braun, a brilliant but controversial engineer from the German Prefecture, has mastered the technology of rocketry. He and his team designed the colossal V-2 missile, a revolutionary weapon of devastating power and speed capable of striking distant targets with no defence possible. His mind is singularly focused on the dream of spaceflight, having used the urgency of the Imperial Civil War to justify his expensive and ambitious research.\n\nHis expertise is now the most critical strategic asset in the world, capable of building weapons that will guarantee Roman military superiority for the next century, and potentially allowing humanity to reach the moon. Recruiting him is a necessity for the state's military future, but his past association with the losing faction of the recent Imperial conflict, combined with the moral ambiguity of his weapons, makes his integration difficult and controversial."
 roman_characters_event.50.opt1:0 "Grant him command of the entire Imperial Rocket Program."
 roman_characters_event.50.refuse:0 "His past is too dark to be associated with Rome."
 
 # 51. GNAEUS DOMITIUS CORBULO
 roman_characters_event.51.t:0 "The Discipline of Corbulo"
 roman_characters_event.51.d:0 "Gnaeus Domitius Corbulo, a Senator and General from the capital, is a figure of legendary military discipline and success. Known for his campaigns in the troubled Eastern Prefectures, he famously reinstated order by forcing his legions to march in full armour during peacetime, instilling an unbreakable regimen that won critical victories in the Mesopotamian theatre. He is a master of logistics, engineering, and troop morale, capable of forging an invincible army from the most decadent or disheartened recruits.\n\nHowever, Corbulo's immense success, popularity, and strict discipline have inevitably attracted the suspicion of the Central Authority. He has been rumoured to possess ambitions exceeding that of a mere general. Recruiting him secures military genius, but his reputation is so immense that any failure or perceived disloyalty would provide powerful enemies within the Senate with ammunition against him."
 roman_characters_event.51.opt1:0 "Appoint him General of the entire Eastern Army."
 roman_characters_event.51.opt2:0 "Utilize his mastery of logistics and field command."
 roman_characters_event.51.opt3:0 "Task him with completely overhauling the legionary training regimen."
 roman_characters_event.51.refuse:0 "Such a popular man is too great a threat to the stability of the state."

 # 52. FLAVIUS AETIUS
 roman_characters_event.52.t:0 "The Last of the Romans"
 roman_characters_event.52.d:0 "In the chaotic decline of the Western Prefectures, Flavius Aetius stands as the final great figure of military competence. Born in the Prefecture of Moesia, Aetius spent much of his youth among the barbarian tribes as a hostage, giving him an unparalleled understanding of their customs, alliances, and tactics. He masterminded the brilliant, almost miraculous defence of the Western Prefectures against the vast, terrifying coalition of the steppe tribes, culminating in the titanic confrontation on the Catalaunian Plains.\n\nHis strategic insight lies in balancing the use of Roman heavy cavalry with shifting alliances among the fractured barbarian groups, playing one enemy off another. His success has granted him total political control over the army and the entire Western administration. Recruiting him is the only way to ensure the survival of the State against external collapse, but his absolute power has already bred intense jealousy in the Court, suggesting a tragic end to his career."
 roman_characters_event.52.opt1:0 "Give this genius full control of the Western Legions."
 roman_characters_event.52.opt2:0 "Utilize his unique knowledge to staff our military high command."
 roman_characters_event.52.opt3:0 "Task him with adapting our legions for cavalry warfare."
 roman_characters_event.52.refuse:0 "His reliance on barbarian allies is too great a betrayal of Roman values."

 # 53. FLAVIUS STILICHO
 roman_characters_event.53.t:0 "The Vandal Defender"
 roman_characters_event.53.d:0 "Flavius Stilicho, born to a Vandal family but rising to the highest rank of *Magister Militum* in the capital, represents the complex nature of the late Imperial military. He is a phenomenal general, who successfully drove back the Gothic invasions of Italia and quelled multiple rebellions in the fragmented Western Prefectures, often serving as the true power behind the throne of the central command. His primary focus is the security of the Imperial heartland, relying heavily on integrated barbarian cavalry units which he commands with fierce loyalty.\n\nHowever, his Germanic heritage and his immense influence over the State have made him the target of a xenophobic and jealous court faction. Recruiting him secures the most capable commander of the era, but the ensuing political intrigue and the inevitable charges of treason will require immense political resolve to manage."
 roman_characters_event.53.opt1:0 "Appoint him General in Chief for the defence of Italia."
 roman_characters_event.53.opt2:0 "His logistical genius is needed in the military high command."
 roman_characters_event.53.opt3:0 "Task him with adapting our military structure to rely on cavalry units."
 roman_characters_event.53.refuse:0 "We cannot entrust the defence of Rome to a barbarian."

 # 54. ROGER DE FLOR
 roman_characters_event.54.t:0 "The Almogavar of Messina"
 roman_characters_event.54.d:0 "The Mediterranean is currently troubled by the activities of the Grand Catalan Company, a powerful mercenary cohort of experienced Almogavar soldiers and seamen led by Roger de Flor, a former pirate who rose through the ranks of mercenary service. Though based in Sicily, his fleets and companies are the most effective fighting force in the region, capable of crushing rebel fleets and seizing coastal fortresses with astonishing speed and brutality.\n\nRoger de Flor is primarily motivated by wealth, offering his massive mercenary army and fleet to the highest bidder. He is a tactical genius on both land and sea, capable of enacting rapid naval deployment and reform. Recruiting him secures an immense pool of highly trained manpower and naval power, but his forces are notoriously undisciplined, answerable only to him, and expensive, threatening to embroil Rome in unnecessary conflicts for profit."
 roman_characters_event.54.opt1:0 "Hire him and his fleet as the new Imperial Admiral."
 roman_characters_event.54.opt2:0 "Appoint him Grand Captain over our mercenary forces."
 roman_characters_event.54.opt3:0 "Utilize his experience to modernize our galley fleet designs."
 roman_characters_event.54.opt4:0 "Grant him trading rights in exchange for his service."
 roman_characters_event.54.refuse:0 "We do not hire pirates."

 # 55. ANDREA DORIA
 roman_characters_event.55.t:0 "The Prince of Genoa"
 roman_characters_event.55.d:0 "Andrea Doria, a member of the powerful Doria family of Genoa, is perhaps the greatest naval commander of the Renaissance period. He commands a formidable personal fleet of galleys, built and manned by Genoese citizens, and has established a reputation for tactical brilliance in the chaotic naval wars of the Mediterranean. Doria is a complex political figure, shifting his allegiance between various Roman courts and rival factions to maintain the commercial independence of his native city.\n\nHis primary value lies in his unmatched experience in naval command, his deep understanding of maritime commerce, and his innovative approach to naval architecture, ensuring his ships are always at the cutting edge. To bring Doria into the fold would secure Roman maritime supremacy, but his power is such that he may not be content with merely serving; he may desire to govern himself."
 roman_characters_event.55.opt1:0 "Appoint him Admiral of the entire Imperial Fleet."
 roman_characters_event.55.opt2:0 "Utilize his knowledge to expand our Mediterranean trade routes."
 roman_characters_event.55.opt3:0 "Task him with implementing naval reforms and new ship designs."
 roman_characters_event.55.opt4:0 "Allow him to seize control."
 roman_characters_event.55.refuse:0 "His allegiance is too transient to be trusted."

 # 56. HAYREDDIN BARBAROSSA
 roman_characters_event.56.t:0 "The Red Beard of Lesbos"
 roman_characters_event.56.d:0 "From the Aegean island of Lesbos comes the legendary admiral Hayreddin, known by his epithet Barbarossa, the Red Beard. He and his brother amassed a vast privateering fleet, dominating the Mediterranean and North African coastlines. Barbarossa is a phenomenal naval commander, a master of galley warfare, and a strategist whose sudden appearances and raids strike terror into the hearts of Roman rivals and rebel coastal provinces alike.\n\nHis intimate knowledge of the coastal prefectures, combined with his network of spies and informants along the African coast, makes him a master of intelligence gathering in the Mediterranean theatre. His command would instantly elevate the skill and shock value of the Imperial Navy, but his methods are brutal, and he demands absolute freedom to conduct his operations with minimal oversight, threatening to turn Imperial forces into a mercenary pirate fleet."
 roman_characters_event.56.opt1:0 "Appoint him Grand Admiral to command our entire Mediterranean Fleet."
 roman_characters_event.56.opt2:0 "Utilize his network of informants as the Imperial Spymaster."
 roman_characters_event.56.opt3:0 "Task him with modernizing our naval doctrine and ship designs."
 roman_characters_event.56.refuse:0 "His pirate origins are too great a stain on the Imperial Honour."

 # 57. DON JOHN OF AUSTRIA
 roman_characters_event.57.t:0 "The Victor of the Eastern Seas"
 roman_characters_event.57.d:0 "Don John, the charismatic commander of the Imperial Fleet, achieved eternal fame at the great naval battle of Lepanto. At the head of a massive Roman galley armada, he decisively crushed the vast fleet of the Eastern Steppe Confederacy, eliminating the immediate threat to the Mediterranean and securing Roman control over the Eastern Trade routes. He is hailed as a military saviour and a shining example of Imperial virtue.\n\nHe is a superb naval tactician, but he also possesses significant diplomatic charm and is adept at managing the complex trade negotiations in the wake of major naval victories. His celebrity status across the Empire is immense, making him an ideal figurehead. However, his political ambitions are equally large, and his immense popularity requires careful management to ensure it serves the State and not his personal ends."
 roman_characters_event.57.opt1:0 "Appoint him Admiral of the entire Imperial Navy."
 roman_characters_event.57.opt2:0 "Utilize his knowledge of trade routes and wealth as a state trader."
 roman_characters_event.57.opt3:0 "Send him to secure peace treaties and trading rights in the East."
 roman_characters_event.57.refuse:0 "His fame is too great a source of friction in the Court."

 # 58. GIOVANNI GIUSTINIANI
 roman_characters_event.58.t:0 "The Defender of the Walls"
 roman_characters_event.58.d:0 "The long decline of the Eastern Prefectures has created numerous specialists in siege defence, none more famous than Giovanni Giustiniani, a highly skilled mercenary captain from the Genoese territories. He rose to international fame by committing his entire personal force of experienced heavy infantry and engineers to the defence of the Imperial Capital during a catastrophic siege laid by barbarian forces.\n\nGiustiniani is known for his mastery of defensive engineering, the swift repair of breaches, and the courageous deployment of his heavy infantry at the walls' most vulnerable points. He offers his services to the Empire, providing unparalleled expertise in fortification design, siege engineering, and the logistics of prolonged defence. He demands only absolute control over the sector of the wall or frontier he is assigned to defend."
 roman_characters_event.58.opt1:0 "Appoint him General to command the Imperial Garrison."
 roman_characters_event.58.opt2:0 "Utilize his genius to modernize the fortifications of the capital."
 roman_characters_event.58.refuse:0 "We cannot rely on mercenary captains for Imperial defence."

 # 59. SEBASTIEN DE VAUBAN
 roman_characters_event.59.t:0 "The Master of Fortification"
 roman_characters_event.59.d:0 "Sebastien de Vauban, an engineer from the Gallic Prefecture, has utterly revolutionized siege warfare, rendering many classical fortifications obsolete. His defensive designs centre on the symmetrical star fort, with overlapping fields of fire and earthen ramparts that absorb artillery fire, while his offensive strategy involves meticulous trench digging and controlled artillery placement. He famously never failed to capture a fortress he besieged, nor failed to successfully defend a fortress he designed.\n\nVauban's engineering genius is matched by his administrative competence, overseeing the massive construction and supply efforts required for Imperial fortifications. Recruiting him would give Rome a monopoly on the modern military engineering, allowing us to rapidly construct impregnable frontiers and efficiently capture enemy strongholds."
 roman_characters_event.59.opt1:0 "Appoint him Chief Military Engineer for the entire Empire."
 roman_characters_event.59.opt2:0 "Task him with overseeing the supply chain for all frontier fortifications."
 roman_characters_event.59.refuse:0 "His designs are too costly and resource intensive."

 # 60. RAIMONDO MONTECUCCOLI
 roman_characters_event.60.t:0 "The Theorist of War"
 roman_characters_event.60.d:0 "Raimondo Montecuccoli, a General and diplomat from the Northern Italian Prefecture of Modena, is celebrated not only for his battlefield victories but for his profound philosophical approach to war. He codified the principles of modern warfare, emphasizing the balance between offensive and defensive operations, the importance of logistics, and the necessity of diplomacy to secure victory without fighting.\n\nHe is a true polymath, capable of advising on military engineering, grand strategy, and statecraft. He served as the primary Imperial General in the wars against the various Eastern threats, earning fame for his caution, strategic patience, and intellectual command style. Montecuccoli offers the Empire a synthesis of military experience and philosophical thought, promising stability and success in both war and diplomacy."
 roman_characters_event.60.opt1:0 "Appoint him General in Chief to command our main armies."
 roman_characters_event.60.opt2:0 "Utilize his knowledge for designing military fortifications."
 roman_characters_event.60.opt3:0 "Bring him into the Senate as a military statesman."
 roman_characters_event.60.opt4:0 "Appoint him a philosopher to the Imperial Academy."
 roman_characters_event.60.refuse:0 "His theories are too slow and cautious for our present needs."
 
 # 61. EUGENE OF SAVOY
 roman_characters_event.61.t:0 "Prince Eugenio, The Imperial Warrior"
 roman_characters_event.61.d:0 "Prince Eugene of Savoy, though originally trained for the Clergy, has proven himself the greatest military mind of the age, rising to supreme command after crushing a powerful enemy coalition on the Eastern front. He is a master of rapid march and strategic surprise, often achieving victory against armies vastly superior in size. He served the Central Authority diligently, yet his early rejection by the initial administration fueled a rivalry that made his success even sweeter.\n\nHe is a skilled diplomat and statesman, as comfortable navigating the intricate politics of the Imperial Chancellery as he is commanding troops on the battlefield. His ambition is boundless, and his loyalty to the concept of a powerful Roman state is absolute. His military prestige is such that he commands immense public support, making him a perennial, destabilizing figure in the political landscape of the Empire. He offers the state either his sword or the chance to reshape governance itself."
 roman_characters_event.61.opt1:0 "Appoint him General in Chief for the Eastern Wars."
 roman_characters_event.61.opt2:0 "Utilize his mastery of strategy in the high command."
 roman_characters_event.61.opt3:0 "Bring him to the Senate to reform Imperial bureaucracy."
 roman_characters_event.61.opt4:0 "Allow him to seize the title and command the Empire."
 roman_characters_event.61.refuse:0 "His talent is too dangerous to concentrate in one man."

 # 62. MICHIEL DE RUYTER
 roman_characters_event.62.t:0 "The Guardian of the Northern Sea"
 roman_characters_event.62.d:0 "Michiel de Ruyter, a mariner from the coastal Prefecture of Zeeland, has risen from humble beginnings as a ship's boy to become the greatest naval commander of the Northern Prefectures. Known for his tactical brilliance and his exceptional courage in action, he has repeatedly defended the sea routes against rival Prefectural fleets and northern marauders. He is a master of line of battle tactics and is deeply respected by his sailors for his personal bravery and fair leadership.\n\nBeyond command, De Ruyter possesses intimate knowledge of naval architecture and ship design, having implemented numerous reforms to improve the speed and firepower of the fleet. His long background in maritime commerce makes him equally adept at managing trade convoys and identifying valuable commercial ventures. Recruiting him would secure the maritime defence of our most economically vital northern territories."
 roman_characters_event.62.opt1:0 "Appoint him Admiral to command the Northern Fleet."
 roman_characters_event.62.opt2:0 "Utilize his expertise to reform our naval doctrine and ships."
 roman_characters_event.62.opt3:0 "Appoint him as a state trader overseeing northern commerce."
 roman_characters_event.62.refuse:0 "His reputation is too localized to be of Imperial value."

 # 63. HORATIO NELSON
 roman_characters_event.63.t:0 "The Hero of the Nile"
 roman_characters_event.63.d:0 "Horatio Nelson, a naval officer from the Britannic Prefecture, is an admiral renowned for his aggressive tactics and his complete disregard for established naval conventions. He achieved legendary status after crushing a rival Imperial fleet at the Nile, and later annihilated the combined usurper fleets at Trafalgar, securing Roman naval supremacy for a century. He is recognized by his numerous battle wounds, including the loss of an eye and an arm, earned through his refusal to command from the rear.\n\nNelson revolutionized naval doctrine by deliberately breaking the line of battle to engage the enemy at point blank range, relying on superior gunnery and morale. His influence over his officers and sailors is absolute. Recruiting him would grant the Empire the most brilliant and innovative naval mind in its history, though his aggressive style and public celebrity often lead to complications with the more cautious Admiralty."
 roman_characters_event.63.opt1:0 "Appoint him Admiral of the Grand Fleet."
 roman_characters_event.63.opt2:0 "Utilize his tactical genius to reform our naval doctrine."
 roman_characters_event.63.refuse:0 "His personal life is too scandalous for the Imperial Court."

 # 64. ALEXANDER SUVOROV
 roman_characters_event.64.t:0 "The Unbeaten General"
 roman_characters_event.64.d:0 "Alexander Suvorov, a general from the Russian Prefecture, is one of the most successful and unconventional commanders in Roman history, never having lost a battle in a career spanning decades. He is known for his simple, brutal doctrine: 'The bullet is a fool, the bayonet is a hero', prioritizing relentless attack, speed, and aggressive use of cold steel. He personally trained his soldiers to be fanatically disciplined and highly motivated, capable of marching immense distances through impossible terrain.\n\nHis greatest victories were achieved against numerous Eastern barbarians and rebel armies in the Caucasus and Steppe regions. Suvorov is eccentric and often disregarded the bureaucratic rules of the Imperial military establishment, but his success rate is unparalleled. His inclusion in the high command would secure military genius, but his unorthodox style and contempt for traditional strategists may cause significant internal friction."
 roman_characters_event.64.opt1:0 "Appoint him General in Chief to command the Eastern Army."
 roman_characters_event.64.opt2:0 "Utilize his unique training regimen to drill our infantry."
 roman_characters_event.64.refuse:0 "His methods are too brutal and unconventional for the Imperial Army."

 # 65. CARL VON CLAUSEWITZ
 roman_characters_event.65.t:0 "The Philosopher of War"
 roman_characters_event.65.d:0 "Carl von Clausewitz, an officer from the German Prefecture, is not famous for victories on the battlefield, but for his profound philosophical contribution to the theory of conflict. His seminal, incomplete work, On War, argues that military force is not an end in itself, but merely 'the continuation of policy by other means'. He codified the nature of 'friction' and 'fog of war', recognizing that uncertainty governs all combat.\n\nHis doctrine revolutionizes military thinking, insisting that political goals must always drive strategy and that military institutions must be constantly reformed to adapt to new political realities. Clausewitz possesses a deep understanding of diplomacy and statecraft. Recruiting him would grant the Imperial high command unparalleled theoretical insight into the nature of modern conflict and the necessary reforms to ensure the state's military structure reflects its political aims."
 roman_characters_event.65.opt1:0 "Appoint him as Army Reformer to reorganize the high command."
 roman_characters_event.65.opt2:0 "Utilize his philosophical genius in the Imperial Academy."
 roman_characters_event.65.opt3:0 "Send him as a diplomat; his understanding of policy is vital."
 roman_characters_event.65.refuse:0 "His philosophy is too complex for practical use in the field."

 # 66. HELMUTH VON MOLTKE
 roman_characters_event.66.t:0 "Moltke the Elder, The Silent Master"
 roman_characters_event.66.d:0 "Helmuth von Moltke, a General from the German Prefecture of Brandenburg, is credited with completely revolutionizing military command through the establishment of a modern, efficient General Staff system. Known for his quiet, methodical planning, Moltke mastered the use of new technologies, especially the railway, to ensure rapid mobilization and logistical superiority over the enemy.\n\nHe is the architect of several major victories against rival Prefectural factions and external threats, always maintaining meticulous control over his forces from a central command centre, delegating authority to brilliant subordinates. Moltke's system ensures military genius is institutionalized, not reliant on a single man. Recruiting him would secure the greatest organizational mind of the century, ensuring the Imperial armies are always mobilized faster, supplied better, and commanded more efficiently than any potential rival."
 roman_characters_event.66.opt1:0 "Appoint him General in Chief to command the Imperial armies."
 roman_characters_event.66.opt2:0 "Utilize his talent to create a modern Imperial General Staff."
 roman_characters_event.66.opt3:0 "Task him with completely reforming the military recruitment and reserve system."
 roman_characters_event.66.refuse:0 "His system is too bureaucratic and complicated."

 # 67. ROBERT E. LEE
 roman_characters_event.67.t:0 "The Chivalry of Virginia"
 roman_characters_event.67.d:0 "Robert E. Lee, a Virginian-born military engineer and general, achieved fame leading the secessionist cause during the Imperial Colonial Wars in the Western Continent. A man of deep honour and classical military training, Lee was renowned for his chivalric conduct and his ability to achieve spectacular victories against numerically superior Imperial forces using audacious tactics and rapid manoeuvre.\n\nDespite ultimately losing the conflict, his military genius is undisputed, and his reforms regarding troop discipline and organization were revolutionary for colonial warfare. Though he fought against the Central Authority, his reputation remains untarnished by the bitterness of defeat. Recruiting him would grant the Empire one of the finest defensive and offensive generals of the modern era, but his association with the secessionist cause makes his loyalty conditional and politically sensitive."
 roman_characters_event.67.opt1:0 "Grant him a full pardon and command of a major Legion."
 roman_characters_event.67.opt2:0 "Utilize his experience to reform the organization of colonial garrisons."
 roman_characters_event.67.refuse:0 "We cannot be seen to reward rebellion."

 # 68. MAURICE OF NASSAU
 roman_characters_event.68.t:0 "The Father of Modern Infantry"
 roman_characters_event.68.d:0 "Maurice of Nassau, a prince from the lowlands Prefecture of Holland, is the figure credited with beginning the Military Revolution of the early modern era. Facing a long struggle against a rival Imperial faction, Maurice realized that the old methods of warfare were obsolete. He introduced systematic drilling, standardized command signals, and the concept of continuous volley fire, transforming disorganized levies into disciplined, professional fighting machines.\n\nHis reforms resurrected the tactical principles of the ancient Roman legions, adapting them for pike and shot warfare. He is also a skilled diplomat, capable of forging political alliances necessary to fund and maintain his expensive military machine. Recruiting him would instantly grant the Empire the most effective military reformer of the age, allowing us to revolutionize the structure, discipline, and effectiveness of our entire infantry force."
 roman_characters_event.68.opt1:0 "Appoint him General in Chief to command the Northern Legions."
 roman_characters_event.68.opt2:0 "Task him with completely reforming our infantry drilling and tactics."
 roman_characters_event.68.opt3:0 "Utilize his diplomatic skill to forge alliances against rebel factions."
 roman_characters_event.68.refuse:0 "His reforms are too expensive and disruptive to implement quickly."

 # 69. GUSTAVUS ADOLPHUS
 roman_characters_event.69.t:0 "The Lion of the North"
 roman_characters_event.69.d:0 "Gustavus Adolphus, a talented military commander from the remote Northern Prefectures, achieved fame by revolutionizing the combination of infantry, cavalry, and artillery in the field. He pioneered the use of light, mobile artillery and introduced the concept of continuous platoon fire, transforming the battlefield from a mass of static blocks into a dynamic, flexible force of combined arms. He is one of the most brilliant offensive minds of the early modern era.\n\nBeyond command, he possessed an almost fanatical dedication to logistical planning, personally overseeing the supply and quartering of his vast armies across vast distances. Recruiting him would instantly modernize the Imperial Army's offensive capabilities, allowing for rapid deployment and overwhelming force. His intense focus on logistics ensures that his armies, unlike others, can remain supplied deep in enemy territory."
 roman_characters_event.69.opt1:0 "Appoint him General in Chief to command our main armies."
 roman_characters_event.69.opt2:0 "Utilize his dedication to planning as Imperial Quartermaster."
 roman_characters_event.69.refuse:0 "His aggressive tactics are too risky for Imperial armies."

 # 70. JOHN PAUL JONES
 roman_characters_event.70.t:0 "I Have Not Yet Begun to Fight"
 roman_characters_event.70.d:0 "John Paul Jones, a Scots-born sailor, achieved notoriety during the Colonial Civil Wars as a ferocious privateer and commander of the separatist fleet, launching daring raids directly against the wealthy ports of the Britannic Prefecture. He is best known for his battle against the Imperial frigate Serapis, where, despite his own ship sinking, he famously refused to surrender, capturing the Roman ship instead.\n\nJones is an aggressive, innovative naval commander, capable of turning any encounter into a desperate close quarters brawl. His background in privateering gives him intimate knowledge of naval espionage, coastal intelligence, and illicit trade networks. Though his loyalty is suspect due to his rebel past, his skill is undeniable. Recruiting him would secure a naval hero capable of boosting the morale of our fleets and disrupting enemy trade."
 roman_characters_event.70.opt1:0 "Grant him command of a squadron to disrupt enemy trade."
 roman_characters_event.70.opt2:0 "Utilize his knowledge of coastal networks for intelligence gathering."
 roman_characters_event.70.opt3:0 "Appoint him as a state trader, specializing in illicit goods."
 roman_characters_event.70.refuse:0 "His history as a privateer makes him a political liability."
 
 # 71. ERWIN ROMMEL
 roman_characters_event.71.t:0 "The Desert Fox"
 roman_characters_event.71.d:0 "The chaos of the modern conflicts in the African Prefectures has revealed the tactical brilliance of Erwin Rommel, a general from the German Prefecture of Ulm. Rommel pioneered the use of rapid armoured warfare, relying on speed, surprise, and decentralized command to achieve stunning victories against numerically superior forces in the North African deserts. He mastered the Blitzkrieg concept, transforming tanks into a mobile striking force rather than mere infantry support.\n\nHis mastery of logistics and unorthodox tactical decisions are legendary, earning him the moniker 'The Desert Fox' from his enemies. However, his tendency to operate far ahead of his supply lines and his sometimes politically naive view of the Imperial power structure have caused friction with the High Command. Recruiting him would instantly elevate the Roman military's ability to wage modern, mechanized warfare."
 roman_characters_event.71.opt1:0 "Appoint him General in Chief of the African Legions."
 roman_characters_event.71.opt2:0 "Utilize his expertise to train our armoured corps commandants."
 roman_characters_event.71.refuse:0 "His reliance on risky deep penetration tactics is unacceptable."

 # 72. ALAN TURING
 roman_characters_event.72.t:0 "The Code Breaker of Britannia"
 roman_characters_event.72.d:0 "From the Britannic Prefecture emerges Alan Turing, a mathematician and logician whose work during the recent Imperial conflicts proved essential for intelligence gathering. He led the efforts to design and build 'thinking machines' capable of rapidly deciphering the complex cryptographic codes used by rival factions and hostile powers, granting the Empire an unparalleled advantage in military and diplomatic intelligence.\n\nTuring is a polymath, whose theoretical work on computation fundamentally changed logistics, mathematics, and philosophy. His systems can be applied to census data, financial modeling, and currency stabilization. Recruiting him means securing a mind whose insight into logic and data processing is vital for modern governance, counter espionage, and the fiscal health of the Empire."
 roman_characters_event.72.opt1:0 "Appoint him Spymaster to coordinate the Imperial intelligence agencies."
 roman_characters_event.72.opt2:0 "Utilize his analytical skills to stabilize the Imperial currency."
 roman_characters_event.72.opt3:0 "Task him with reforming the Imperial treasury and financial accounting."
 roman_characters_event.72.opt4:0 "Grant him a position in the Imperial College of Science."
 roman_characters_event.72.refuse:0 "His focus is too abstract and his personal conduct is irregular."

 # 73. HENRI DE TURENNE
 roman_characters_event.73.t:0 "The Marshal of Maneuver"
 roman_characters_event.73.d:0 "Henri de Turenne, a Marshal from the Gallic Prefecture, is recognized as the strategic genius of the seventeenth century. He is renowned for his mastery of manoeuvre warfare, his patience, and his ability to achieve strategic victories through brilliant positioning and calculated risks, often saving the Imperial forces from imminent defeat during the destructive Gallic civil wars and regional conflicts.\n\nUnlike many generals who rely on shock and brutality, Turenne emphasized logistics, careful supply planning, and intelligence gathering. Though famously unassuming and devout, his victories speak louder than any boast. Recruiting him would give the Empire one of the most brilliant strategic minds of the modern era, capable of operating effectively on multiple fronts and achieving victory through minimal battlefield attrition."
 roman_characters_event.73.opt1:0 "Appoint him General in Chief to command the Gallic Legions."
 roman_characters_event.73.refuse:0 "We need a commander of greater offensive shock."

 # 74. CORNELIUS TACITUS
 roman_characters_event.74.t:0 "The Voice of the Senate"
 roman_characters_event.74.d:0 "Cornelius Tacitus, an orator, jurist, and Senator from the Gallic Prefecture, is the State's preeminent historian. His great works, the Annals and the Histories, chronicle the moral compromises of the present regime with unflinching, subtle prose, contrasting the glorious classical past with the corruption of Imperial power. He believes that the true function of history is to prevent vice and celebrate virtue, serving as a political conscience for the Roman ruling class.\n\nTacitus is a master of rhetoric and political philosophy, who served as Proconsul of Asia and commanded great respect in the Senate. His insights into the mechanics of power, corruption, and the dangers of autocracy are invaluable for the health of the State. Recruiting him would mean securing the conscience of the Empire, but his honest critique of centralized power may cause serious friction with any ruling faction."
 roman_characters_event.74.opt1:0 "Bring him into the Senate as a key Statesman and advisor."
 roman_characters_event.74.opt2:0 "Appoint him Philosopher to the Imperial Academy."
 roman_characters_event.74.refuse:0 "His writings are too critical of the Central Authority's dignity."

 # 75. LUCIUS ANNAEUS SENECA
 roman_characters_event.75.t:0 "The Stoic of Cordoba"
 roman_characters_event.75.d:0 "Lucius Annaeus Seneca, born in the Hispanian Prefecture of Cordoba, is the foremost Stoic philosopher, playwright, and essayist of the early Empire. His philosophical works on ethics, anger, and clemency served as a moral guide to generations of Roman citizens and rulers, promoting duty, self control, and asceticism as the highest virtues. He is also famous for having served as the personal tutor and later chief political advisor to the Emperor Nero.\n\nSeneca's political career was tumultuous, marked by periods of immense power, exile, and eventual forced suicide, demonstrating the treacherous nature of Imperial court politics. His experience makes him uniquely qualified to advise rulers on the dangerous relationship between absolute power and moral philosophy. His counsel, though invaluable, comes with the heavy weight of his past political failures and the ultimate tragedy of his service."
 roman_characters_event.75.opt1:0 "Appoint him Philosopher to guide the moral life of the central command."
 roman_characters_event.75.refuse:0 "His philosophical pessimism is ill suited to our triumphant state."

 # 76. GNAEUS JULIUS AGRICOLA
 roman_characters_event.76.t:0 "The Conqueror of Britannia"
 roman_characters_event.76.d:0 "Gnaeus Julius Agricola, a talented commander from the Gallic Prefecture, cemented his legacy by leading the Roman conquest and permanent settlement of the island Prefecture of Britannia. His campaigns were marked by exceptional military success and a policy of benign civil administration; he promoted Roman language, law, and culture, encouraging the local chieftains to adopt Roman customs and architecture. He is the ideal synthesis of a Roman general and civil administrator.\n\nHis reforms of the army structure and training regimen in Britannia were fundamental to pacifying the wild northern tribes. Though his success ultimately earned him the quiet jealousy of the Emperor, his administrative talent is undeniable. Recruiting him would secure a military leader capable of both ruthless conquest and intelligent long term civil development in newly conquered territories."
 roman_characters_event.76.opt1:0 "Appoint him General for our furthest Imperial campaigns."
 roman_characters_event.76.opt2:0 "Utilize his successful methods to recruit and train colonial legions."
 roman_characters_event.76.opt3:0 "Bring him into the Imperial Council to govern new Prefectures."
 roman_characters_event.76.refuse:0 "His popularity among the legions is too great a source of concern."

 # 77. PLINY THE ELDER
 roman_characters_event.77.t:0 "The Inquisitive Naturalist"
 roman_characters_event.77.d:0 "Gaius Plinius Secundus, known as Pliny the Elder, from the Prefecture of Cisalpine Gaul, embodies the spirit of insatiable Roman curiosity. A military commander, administrator, and jurist, his true passion was the compilation of all scientific knowledge into a single work: the Natural History. This monumental encyclopaedia covers astronomy, geography, zoology, mineralogy, art, and medicine, encompassing nearly forty thousand facts gathered from over two thousand sources.\n\nPliny was also a senior naval commander, serving in the fleet off Misenum, and had practical experience in Imperial administration and commerce. He famously perished while observing the eruption of Mount Vesuvius in his selfless pursuit of knowledge. Recruiting him means securing the most comprehensive scientific mind of the age, capable of advising the state on everything from engineering and logistics to trade and natural resources."
 roman_characters_event.77.opt1:0 "Appoint him Chief Natural Scientist for the Empire."
 roman_characters_event.77.opt2:0 "Utilize his knowledge of geography and resources for trade expansion."
 roman_characters_event.77.opt3:0 "Commission his comprehensive knowledge for philosophical and administrative texts."
 roman_characters_event.77.refuse:0 "His scientific curiosity is too distracting for a practical servant."

 # 78. BOETHIUS
 roman_characters_event.78.t:0 "The Last Roman Scholar"
 roman_characters_event.78.d:0 "Anicius Manlius Severinus Boethius, a nobleman from the great Anician family of Rome, served as the chief magistrate and Master of Offices to the powerful non Roman King of Italia during the tumultuous period of the Western collapse. He was renowned as the 'Last Roman Scholar', attempting to translate the entire works of Plato and Aristotle into Latin, preserving classical philosophy for the medieval world.\n\nHis greatest work, The Consolation of Philosophy, was written while awaiting execution after falling victim to court intrigue and false charges of treason. His ultimate downfall was rooted in the conflict between his commitment to Roman traditional ideals and the pragmatic authority of the ruling power. He offers the state an intellect of profound moral and administrative clarity, though his political end serves as a grim warning of the dangers of serving non Roman power."
 roman_characters_event.78.opt1:0 "Appoint him Chief Philosopher to the Imperial Court."
 roman_characters_event.78.opt2:0 "Bring him into the Senate as a respected Statesman."
 roman_characters_event.78.opt3:0 "Allow him to seize the title and govern the Empire."
 roman_characters_event.78.refuse:0 "His fate suggests his counsel brings only tragedy."

 # 79. FRANCESCO PETRARCA
 roman_characters_event.79.t:0 "The Father of Humanism"
 roman_characters_event.79.d:0 "Francesco Petrarca, a poet and scholar from the Tuscan Prefecture, is the pivotal figure who initiated the Renaissance. Dismayed by the decline of classical Latin and the scholastic focus on narrow theological issues, Petrarca dedicated his life to rediscovering and celebrating the literary achievements of ancient Rome. He sought out lost manuscripts of Cicero, Virgil, and Livy, believing that a return to classical learning was the only path to moral and cultural renewal.\n\nHis poetry, written both in classical Latin and the vernacular, is highly influential, establishing new standards of romantic expression and formal elegance. Petrarca is a transitional figure, blending the piety of the medieval period with the classical Humanism of the coming age. Recruiting him would instantly elevate the cultural prestige of the Imperial Court and drive the rediscovery of lost Roman arts and sciences."
 roman_characters_event.79.opt1:0 "Appoint him Philosopher to champion the study of classical texts."
 roman_characters_event.79.opt2:0 "Commission him to compose epic poems for the Empire."
 roman_characters_event.79.refuse:0 "He is too focused on the past to serve the future."

 # 80. SANDRO BOTTICELLI
 roman_characters_event.80.t:0 "The Allegorist of Florence"
 roman_characters_event.80.d:0 "Sandro Botticelli, a painter of the Florentine Renaissance, is famed for his delicate lines, elegant forms, and his unique blending of Christian piety with classical mythology and allegory. His masterpieces, including the Birth of Venus and Primavera, were largely commissioned by the powerful local ruling family, who sought to demonstrate their wealth and intellectual connection to the classical Roman world.\n\nBotticelli represents the height of early Renaissance art, infusing classical themes with a dreamy, emotional style that captivated the educated elite. Bringing him into the service of the Imperial Court would cement the capital's status as the ultimate patron of the arts, ushering in a new era of allegorical and mythological painting celebrating the glory of Rome."
 roman_characters_event.80.opt1:0 "Offer him lavish patronage to paint for the Imperial City."
 roman_characters_event.80.refuse:0 "His mythological subjects are too esoteric for general appreciation."
 
 # 81. TITIAN
 roman_characters_event.81.t:0 "Titian, The Master of Colour"
 roman_characters_event.81.d:0 "Tiziano Vecelli, known simply as Titian, is the undisputed master of Venetian painting and one of the most influential artists of the High Renaissance. Renowned for his revolutionary use of colour, light, and texture, his oil paintings are imbued with a passionate, sensual quality that captivates the viewer. He established the supremacy of oil paint over drawing and perfected the art of the state portrait, capturing the psychological depth of every Emperor and Senator he painted.\n\nHis longevity and consistent output made him the most sought after portraitist in the Empire, serving under successive generations of Imperial patronage. Recruiting Titian would ensure the Imperial Court possesses a legacy of artistry and colour mastery unparalleled in the Western world, cementing Rome's cultural hegemony for generations."
 roman_characters_event.81.opt1:0 "Offer him immense patronage to serve as the Imperial Court Painter."
 roman_characters_event.81.refuse:0 "His constant demands for commissions are too extravagant."

 # 82. RENE DESCARTES
 roman_characters_event.82.t:0 "The Rationalist of Gaul"
 roman_characters_event.82.d:0 "From the Gallic Prefecture emerges Rene Descartes, a philosopher and mathematician whose single declaration, 'Cogito, ergo sum', I think, therefore I am, forms the bedrock of modern Western philosophy. He proposed a revolutionary method of systematic doubt and rational inquiry, demanding that all knowledge be built upon self evident certainty. His work in analytical geometry unified mathematics and ushered in the Scientific Revolution.\n\nDescartes is also a trained military officer, having served in the Roman forces and possessing a keen understanding of tactics, logistics, and siegecraft. His mind, trained in both rigorous logic and practical military application, offers the Empire a unique fusion of theory and practice. Recruiting him would secure a genius capable of advancing philosophy, science, and the art of war simultaneously."
 roman_characters_event.82.opt1:0 "Appoint him Chief Scientist to advance mathematics and physics."
 roman_characters_event.82.opt2:0 "Appoint him Philosopher to guide the Empire's intellectual life."
 roman_characters_event.82.opt3:0 "Grant him a commission; his logical mind is needed in the legions."
 roman_characters_event.82.refuse:0 "His philosophy of systematic doubt may corrupt the public mind."

 # 83. BLAISE PASCAL
 roman_characters_event.83.t:0 "The Theologian of Uncertainty"
 roman_characters_event.83.d:0 "Blaise Pascal, a polymath from the Gallic Prefecture, is an intellectual prodigy whose contributions span mathematics, physics, and philosophy. He invented the first mechanical calculator, explored the principles of hydrostatics, proving that a vacuum exists, and pioneered the mathematical theory of probability. His scientific rigour is immense, yet his later life was marked by a profound, almost mystical devotion to the Faith.\n\nHis unfinished philosophical work, the Pensées, defends the Faith using logic and probability, arguing that humanity is bound to wager its life on the divine. This blending of intense mathematical logic with spiritual devotion makes him uniquely suited to act as a censor or inquisitor, capable of applying scientific scrutiny to theological debate. Recruiting him provides a genius whose intellectual honesty and scientific method are unparalleled."
 roman_characters_event.83.opt1:0 "Appoint him Chief Scientist to advance physics and mathematics."
 roman_characters_event.83.opt2:0 "Utilize his fierce intellect to scrutinize doctrinal purity as Inquisitor."
 roman_characters_event.83.refuse:0 "His delicate health and religious fervor make him unreliable."

 # 84. DIEGO VELAZQUEZ
 roman_characters_event.84.t:0 "The Painter of the Court"
 roman_characters_event.84.d:0 "Diego Velazquez, the master of the Hispanian Baroque, is recognized as one of the greatest portraitists of all time. Having risen from humble origins in Seville, he became the primary court painter to the Imperial Viceroys in Hispania, capturing the grandeur, rigidity, and psychological isolation of the ruling dynasty. His work is characterized by astonishing realism, masterful use of light, and subtle commentary on social hierarchy.\n\nUnlike many painters, Velazquez was an intimate member of the court, giving him rare access to the inner workings of Imperial power. His technique, including his revolutionary use of broad brushstrokes and impasto, defined painting for the next two centuries. Recruiting him would secure the greatest realist painter of the age, ensuring that the legacy of our rule is captured with an honest, timeless dignity."
 roman_characters_event.84.opt1:0 "Appoint him Painter to the Imperial Court."
 roman_characters_event.84.refuse:0 "His paintings are too slow to produce for our needs."

 # 85. FRANCISCO GOYA
 roman_characters_event.85.t:0 "The Chronicler of the Dark Age"
 roman_characters_event.85.d:0 "Francisco Goya, a painter and printmaker from the Hispanian Prefecture, is a transitional figure whose art spans the frivolity of the late court aristocracy and the horrors of modern Imperial civil war. Originally a court painter, his later work descended into raw, emotional documentation of the atrocities, madness, and superstition unleashed by internal Roman conflict and the chaos of the Napoleonic period.\n\nHis powerful print series, including The Disasters of War, strip away all romantic illusion, showing the brutal truth of military conflict and political repression. He possessed an uncompromising artistic integrity and a profound sympathy for the common people. Recruiting him would give the Empire an artist capable of both sublime court portraiture and searing, insightful social commentary."
 roman_characters_event.85.opt1:0 "Commission him to record the true history of our recent struggles."
 roman_characters_event.85.refuse:0 "His recent works are too disturbing and critical of authority."

 # 86. LOUIS PASTEUR
 roman_characters_event.86.t:0 "The Biologist of the Microscopic"
 roman_characters_event.86.d:0 "Louis Pasteur, a chemist and biologist from the Gallic Prefecture, is responsible for one of the greatest advances in public health: the germ theory of disease. His meticulous experiments proved that fermentation and disease are caused by invisible microorganisms, not spontaneous generation, fundamentally changing medicine and hygiene. He pioneered the process of pasteurization, saving countless lives, and developed crucial vaccines for diseases like rabies.\n\nPasteur's work laid the groundwork for modern immunology and antiseptic surgery, drastically reducing mortality rates across the Empire. His findings are directly applicable to military medicine, civilian health, and industrial food production. Recruiting him would secure a genius whose scientific dedication and findings are vital for the demographic and military health of the entire Roman world."
 roman_characters_event.86.opt1:0 "Grant him funding and resources to lead the Imperial Health Commission."
 roman_characters_event.86.refuse:0 "His germ theories are too radical for traditional doctors."

 # 87. VICTOR HUGO
 roman_characters_event.87.t:0 "The Conscience of the Century"
 roman_characters_event.87.d:0 "Victor Hugo, the preeminent French Romantic poet, novelist, and dramatist, is celebrated for his vast literary output and his passionate commitment to social justice and democratic ideals. His novels, including The Hunchback of Notre Dame and Les Miserables, are epic in scope, capturing the full spectrum of Roman society from the highest aristocracy to the deepest poverty, championing the cause of the oppressed.\n\nHugo's political career was turbulent, leading to long periods of defiant exile during the authoritarian phases of the Central Command, but his moral authority remained unmatched. His philosophy centers on the progressive improvement of humanity and the necessary overthrow of political tyranny. Recruiting him would secure the most powerful moral voice in the Empire, capable of influencing public opinion and providing deep insight into the structural weaknesses of Roman governance."
 roman_characters_event.87.opt1:0 "Appoint him Philosopher to advise on social and ethical reform."
 roman_characters_event.87.opt2:0 "Commission his immense literary talent to write works for the state."
 roman_characters_event.87.refuse:0 "His radical democratic views are too dangerous to employ."

 # 88. ANTONI GAUDI
 roman_characters_event.88.t:0 "The Architect of the Organic"
 roman_characters_event.88.d:0 "Antoni Gaudi, an architect from the Catalan Prefecture, is the master of Modernisme, a style based on organic, natural forms rather than classical symmetry. His revolutionary use of parabolic arches, hyperbolic paraboloids, and leaning columns allows him to create immense, flowing structures that defy traditional engineering, such as the colossal Sagrada Familia. His genius lies in blending the visual arts with mathematical physics.\n\nGaudi's structural innovation is often based on models that demonstrate precise weight distribution, giving him a powerful, practical understanding of engineering. His ability to fuse art, mathematics, and unconventional structure could be applied to complex military architecture, such as defensive fortifications or immense logistical structures. Recruiting him would secure a genius capable of defining the future aesthetic of the Roman world."
 roman_characters_event.88.opt1:0 "Offer him patronage to design a new Imperial capital centre."
 roman_characters_event.88.opt2:0 "Utilize his expertise in complex geometry for our siege and defensive works."
 roman_characters_event.88.refuse:0 "His structures take too long to complete and are difficult to maintain."

 # 89. GIACOMO PUCCINI
 roman_characters_event.89.t:0 "The Verismo Master of Opera"
 roman_characters_event.89.d:0 "Giacomo Puccini, a composer from the Tuscan Prefecture, is the leading figure in the Verismo movement of opera, known for its intense emotional realism and depiction of ordinary life, rather than merely mythological or historical subjects. His operas, including La Bohème and Tosca, are among the most popular ever written, commanding packed houses across every major city in the Empire.\n\nPuccini mastered the integration of music and drama, using leitmotifs and rich orchestral textures to heighten the emotional intensity of his narratives. His work is often characterized by its melancholic beauty and its focus on human suffering and passion. Recruiting him would ensure the Imperial cultural scene remains vibrant and emotionally powerful, commissioning operas that reflect the complex life of the modern Roman citizen."
 roman_characters_event.89.opt1:0 "Appoint him master of the Imperial Opera and Music School."
 roman_characters_event.89.refuse:0 "We prefer more traditional, heroic themes for our entertainment."

 # 90. FEDERICO GARCIA LORCA
 roman_characters_event.90.t:0 "The Poet of the People"
 roman_characters_event.90.d:0 "From the southern Hispanian province of Granada emerges Federico Garcia Lorca, a poet and playwright whose work captures the essence of Andalusian folk culture, mixing intense lyrical beauty with dramatic fatalism and raw social critique. He drew heavily from Flamenco and Gypsy traditions, infusing them into powerful plays and poetry that resonated deeply with the common people.\n\nLorca was a passionate advocate for social justice, establishing travelling theatre troupes to bring art to the rural Prefectures. His political and artistic outspokenness, however, made him a fierce enemy of the reactionary factions during the tumultuous periods of Imperial civil strife, eventually leading to his execution. Recruiting him would secure a literary voice of intense beauty and moral clarity, though his association with revolutionary causes makes him a potent political symbol."
 roman_characters_event.90.opt1:0 "Commission his dramatic works for the Imperial Theatre."
 roman_characters_event.90.refuse:0 "His politics are too dangerous to allow his ideas to spread."
 
 # 91. MARIA MONTESSORI
 roman_characters_event.91.t:0 "The Pioneer of Pedagogy"
 roman_characters_event.91.d:0 "Maria Montessori, the first female physician in Italy, has achieved international renown not for her medical practice, but for her revolutionary scientific approach to education. Working primarily with underprivileged children in the Roman slums, she developed a method based on the principle of self directed activity, hands on learning, and structured freedom, arguing that true development stems from a child's natural psychological drives.\n\nHer methods are spreading globally, proving dramatically successful at improving intelligence and discipline across different social strata. She offers the Empire her expertise, believing that her pedagogy is the key to creating a disciplined, self reliant, and intellectually capable new generation of Roman citizens. Recruiting her would ensure that the Imperial educational system is the most advanced in the world."
 roman_characters_event.91.opt1:0 "Fund her research into child psychology and educational science."
 roman_characters_event.91.opt2:0 "Appoint her Philosopher to guide the Empire's educational policy."
 roman_characters_event.91.refuse:0 "Her focus on the individual child contradicts state hierarchy."

 # 92. ALBERT CAMUS
 roman_characters_event.92.t:0 "The Philosopher of the Absurd"
 roman_characters_event.92.d:0 "Albert Camus, a philosopher, author, and journalist from the turbulent North African Prefectures, emerged as a leading moral voice in the aftermath of the great Imperial Civil Wars. His philosophy, Absurdism, grapples with the human need for meaning in a universe that is cold and indifferent, yet he insists that we must embrace revolt, freedom, and passion to find dignity in that struggle.\n\nHis novels and essays, including The Stranger and The Plague, are profound meditations on moral courage, human solidarity, and the nature of tyranny. Having witnessed immense suffering and political violence in the colonies, his counsel would be vital for any statesman attempting to rebuild the Empire on a foundation of ethical clarity. Recruiting him would secure a conscience for the state, though his political views are deeply socialist and anti authoritarian."
 roman_characters_event.92.opt1:0 "Appoint him Philosopher to guide the moral reconstruction of the Empire."
 roman_characters_event.92.refuse:0 "His pessimism and anti authoritarianism are unacceptable."

 # 93. UMBERTO ECO
 roman_characters_event.93.t:0 "The Semiotician of Turin"
 roman_characters_event.93.d:0 "Umberto Eco, a scholar from Turin, is one of the most prominent intellectuals of the contemporary age. He is a master of semiotics, the study of signs and symbols, allowing him unique insight into propaganda, political communication, and the construction of cultural narratives. He is equally famous for his historical novels, notably The Name of the Rose, which blend medieval studies with intricate philosophical and semiotic puzzles.\n\nEco's work is essential for understanding modern mass communication and the complex relationship between high culture and popular culture. His expertise could be vital for designing effective state propaganda, analyzing foreign diplomatic signals, or simply for enhancing the cultural life of the capital. Recruiting him would ensure that the state commands the most advanced theoretical understanding of information flow."
 roman_characters_event.93.opt1:0 "Appoint him Philosopher to guide Imperial communication strategy."
 roman_characters_event.93.opt2:0 "Commission his immense literary talent for Imperial historical narratives."
 roman_characters_event.93.refuse:0 "His focus is too theoretical and detached from practical governance."

 # 94. SEPTIMIUS SEVERUS
 roman_characters_event.94.t:0 "The Punic Warlord"
 roman_characters_event.94.d:0 "From the African Prefecture of Leptis Magna comes Lucius Septimius Severus, a general who achieved supreme power during the catastrophic civil wars following the assassination of the Emperor. Severus marched his African and Danubian legions directly into the capital, seizing the throne and brutally executing his political rivals and military competitors. He famously advised his sons to 'Enrich the soldiers, scorn all others', establishing a military dictatorship designed solely to keep the legions loyal and the frontiers secure.\n\nSeverus is a stern, disciplined, and highly effective military commander who successfully secured the Empire's vast Eastern borders and reformed the army with Punic ruthlessness. His rule ensures stability through absolute force and military priority. Recruiting him as a ruler will secure the Empire, but will destroy the remnants of the civil bureaucracy and subordinate all civil institutions to the will of the army."
 roman_characters_event.94.opt1:0 "Appoint him General in Chief to secure the fractious frontiers."
 roman_characters_event.94.opt2:0 "Allow him to seize the supreme power of the Empire."
 roman_characters_event.94.refuse:0 "We cannot allow the legions to dictate our ruler."

 # 95. GEORGE MANIAKES
 roman_characters_event.95.t:0 "Maniakes, The Defiant General"
 roman_characters_event.95.d:0 "George Maniakes, a massive and imposing general, gained fame for his relentless and effective campaigns in the chaotic territories of the Eastern and Italian Prefectures. He led a combined Roman and mercenary army to reconquer key territories in Sicily and the Levant, often relying on his sheer personal charisma and brutal discipline to inspire loyalty in diverse troops, including Norsemen and Varengians.\n\nHis successes were often hampered by court intrigues and jealous potentates who feared his popularity. When recalled from command by a suspicious court, Maniakes defiantly declared himself Emperor and marched against the capital, demonstrating both his military genius and his fatal political ambition. Recruiting him provides an unparalleled commander for the Italian and Eastern fronts, but his temperament is volatile and his loyalty to the central government is conditional."
 roman_characters_event.95.opt1:0 "Grant him command of the Eastern Legions immediately."
 roman_characters_event.95.refuse:0 "His history of rebellion is too dangerous to ignore."

 # 96. GONZALO DE CORDOBA
 roman_characters_event.96.t:0 "El Gran Capitan, The Great Captain"
 roman_characters_event.96.d:0 "Gonzalo Fernandez de Córdoba, known by the epithet El Gran Capitan, is the leading military figure of the Renaissance, credited with revolutionizing infantry tactics. He transformed the Spanish military into the dominant fighting force of the age, primarily by perfecting the Tercio formation, a disciplined, mixed unit of pike, shot, and sword that could defeat both heavy cavalry and massed infantry.\n\nHis victories in the Italian campaigns were decisive, establishing the Tercio as the foundation of modern infantry. He is an unparalleled military organizer and trainer, whose reforms emphasize discipline, small unit cohesion, and the integration of new black powder weaponry. Recruiting him would allow Rome to instantly adopt the most advanced military organization in the world, securing the Imperial Legions' dominance for the coming century."
 roman_characters_event.96.opt1:0 "Appoint him General in Chief to command our main forces."
 roman_characters_event.96.opt2:0 "Task him with reforming our infantry into the new Tercio system."
 roman_characters_event.96.refuse:0 "His demands for control over the armies are excessive."

 # 97. ALVARO DE BAZAN
 roman_characters_event.97.t:0 "The Marquis of Santa Cruz"
 roman_characters_event.97.d:0 "Alvaro de Bazan, the Marquis of Santa Cruz, is a seasoned naval commander from the Andalusian coast and one of the most successful admirals of the age of galley and sail warfare. He fought brilliantly alongside Don John of Austria at the Battle of Lepanto, and later commanded massive Imperial fleets in operations against North African pirates and rebel factions.\n\nBazan is one of the few naval commanders to achieve lasting fame for his victories, never suffering a defeat in his career. His expertise extends beyond command to naval logistics, intelligence gathering, and the organization of maritime trade convoys. Recruiting him would secure a proven, undefeated Admiral, capable of securing vital sea lanes and expanding Roman maritime commerce across the globe."
 roman_characters_event.97.opt1:0 "Appoint him Admiral to command the main Imperial Fleet."
 roman_characters_event.97.opt2:0 "Utilize his knowledge of sea lanes and logistics as a state trader."
 roman_characters_event.97.refuse:0 "His fees for service are astronomically high."

 # 98. FRANCESCO MOROSINI
 roman_characters_event.98.t:0 "The Lion of the Morea"
 roman_characters_event.98.d:0 "Francesco Morosini, a celebrated Venetian naval officer, is one of the most famous admirals of the late seventeenth century. He spent his career fighting to maintain Roman maritime control over the turbulent Aegean and Dalmatian seas, achieving fame for his daring campaigns and the temporary reconquest of the entire Morea Prefecture. He is hailed as the 'Lion of the Morea' for his decisive naval victories.\n\nMorosini is an experienced diplomat, a master of naval supply, and possesses a keen understanding of finance, having served as the head of the Venetian Prefecture's administration. His massive popularity and long record of service make him a dangerous political figure. Recruiting him could place a supremely qualified, popular figure at the head of the state, but his history of pursuing independent glory may undermine the Central Authority."
 roman_characters_event.98.opt1:0 "Appoint him Admiral to command the Eastern Fleet."
 roman_characters_event.98.opt2:0 "Utilize his experience to stabilize Roman maritime trade."
 roman_characters_event.98.opt3:0 "Appoint him Master of the Mint to reform the treasury."
 roman_characters_event.98.opt4:0 "Allow him to seize the title and govern the Empire."
 roman_characters_event.98.refuse:0 "His popular acclaim is too potent a threat."

 # 99. LAMBROS KATSONIS
 roman_characters_event.99.t:0 "The Naval Guerrilla of the Aegean"
 roman_characters_event.99.d:0 "Lambros Katsonis, a sailor and military officer from the Athenian Prefecture, is the most famous naval commander in the Aegean during the period of late Imperial decline and external conflicts. He commanded small, highly mobile squadrons of ships, operating as a relentless privateer and naval guerrilla, launching constant raids against the larger fleets of the barbarian confederacies and rebel factions.\n\nHis tactics rely on speed, surprise, and a deep knowledge of the Aegean islands and coastlines, making him impossible for slow Imperial fleets to contain. Recruiting him would give the Empire a master of fast, unconventional naval warfare, capable of disrupting enemy trade and intelligence, though his status as a privateer makes him difficult to integrate into the rigid structure of the Imperial Admiralty."
 roman_characters_event.99.opt1:0 "Grant him command of a fast squadron for anti privateer operations."
 roman_characters_event.99.refuse:0 "His methods are too chaotic and difficult to control."

 # 100. IBRAHIM PASHA
 roman_characters_event.100.t:0 "The Modernizer of Aegyptus"
 roman_characters_event.100.d:0 "Ibrahim Pasha, the son of the Viceroy of Aegyptus, is the most formidable military commander of the modern Eastern Prefectures. He is the architect of a revolutionary military reform that has transformed the traditional Imperial armies of the East into a disciplined, European style fighting force, capable of mass mobilization and strategic campaigns.\n\nHis victories in the Arabian and Syrian theatres proved the decisive superiority of his new, reformed armies over both tribal forces and traditional Imperial legions. Ibrahim Pasha is a master of command, siege warfare, and logistical support. Recruiting him would secure the single most competent commander and military modernizer in the Eastern Mediterranean, essential for re asserting Roman control over the vast and fractious territories of the Orient."
 roman_characters_event.100.opt1:0 "Appoint him General in Chief of the entire Eastern Army."
 roman_characters_event.100.refuse:0 "His focus on Eastern reform does not serve the Western capital."

 # 101. LASKARINA BOUBOULINA
 roman_characters_event.101.t:0 "The Amazon of the Seas"
 roman_characters_event.101.d:0 "Laskarina Bouboulina, a wealthy naval officer from the Morean Prefecture, is a heroic figure of the recent struggles for regional autonomy against central Imperial mismanagement. She personally funded, armed, and commanded her own fleet of warships, leading daring naval assaults and blockade running operations across the Aegean. She is renowned for her fierce independence, her tactical brilliance in naval combat, and her willingness to defy authority to secure the liberation of her people.\n\nHer courage in leading her men into battle, despite facing overwhelming odds, earned her legendary status across the Eastern Prefectures. Recruiting her would instantly provide the Imperial Navy with a supremely capable and aggressive Admiral, capable of training our fleet in unconventional naval warfare, though her political loyalties are firmly rooted in regional autonomy."
 roman_characters_event.101.opt1:0 "Grant her a commission as Admiral in the Imperial Navy."
 roman_characters_event.101.refuse:0 "Her past actions amount to naval piracy."

 # 102. EMIR ABDELKADER
 roman_characters_event.102.t:0 "The Strategist of the Maghreb"
 roman_characters_event.102.d:0 "Emir Abdelkader, a scholar and military leader from the Maghrebian Prefecture, is the primary figure of resistance and organization in North Africa. Faced with external pressures and local rebellion, he has demonstrated extraordinary skill in organizing a unified front, utilizing effective guerrilla warfare and diplomacy to maintain order and autonomy in the turbulent western territories. He is celebrated for his chivalrous conduct in war and his deep dedication to the principles of the Imperial Faith.\n\nHis expertise lies in both military organization and philosophical governance. He codified a strict but fair administrative structure in his territories and is a renowned Theologian. Recruiting him would secure a military genius capable of pacifying the difficult African frontiers, while also gaining a theologian whose spiritual authority is immense."
 roman_characters_event.102.opt1:0 "Appoint him General to command the African frontiers."
 roman_characters_event.102.opt2:0 "Bring him to the capital as a theologian to guide the Clergy."
 roman_characters_event.102.refuse:0 "His loyalty to regional autonomy is too strong."

 # 103. ITALO BALBO
 roman_characters_event.103.t:0 "The Air Marshal"
 roman_characters_event.103.d:0 "Italo Balbo, a general and political figure from the Prefecture of Emilia, is one of the leading figures in the modern authoritarian movement that has swept the State. He is known for his immense administrative competence, his charismatic presence, and his pioneering role in developing long range flight capabilities. His military experience, organizational skill, and diplomatic ability make him a powerful figure in modern Roman politics.\n\nHe has successfully led massive diplomatic and air power missions across the world, projecting Roman influence far beyond our traditional borders. His methods are purely pragmatic, valuing efficiency and centralized control above all else. Recruiting him would secure a leader capable of rapid modernization and administrative centralization, though his political ideology is based on ruthless centralized authority."
 roman_characters_event.103.opt1:0 "Appoint him General in Chief to command our modernized forces."
 roman_characters_event.103.opt2:0 "Bring him into the Imperial Council as a Statesman."
 roman_characters_event.103.opt3:0 "Send him abroad to secure vital diplomatic agreements."
 roman_characters_event.103.refuse:0 "His political goals are antithetical to the Senate."

 # 104. GIACOMO DE MEDICI
 roman_characters_event.104.t:0 "The Merchant Prince"
 roman_characters_event.104.d:0 "Giacomo de Medici, a member of the wealthiest and most politically astute family in the Florentine Prefecture, has demonstrated immense talent in banking, trade, and state administration. The Medici family's financial network spans the globe, providing vast economic resources and political influence, often acting as financiers and patrons to the Central Authority itself.\n\nGiacomo is a skilled diplomat and administrator, having previously managed the finances and foreign relations of the Florentine territory. His deep knowledge of trade routes and finance is invaluable for the health of the Imperial treasury. Recruiting him would secure a master of state finance and diplomacy, or, given the family's history, installing him as the nominal head of the entire State might secure a massive financial windfall for the State."
 roman_characters_event.104.opt1:0 "Appoint him as the Chief Imperial Trader."
 roman_characters_event.104.opt2:0 "Bring him into the Imperial Council as Statesman."
 roman_characters_event.opt3:0 "Allow him to seize the title and command the Empire through his financial power."
 roman_characters_event.104.refuse:0 "We refuse to be beholden to Florentine banking interests."

 # 105. ENRICO MATTEI
 roman_characters_event.105.t:0 "The Industrial Spymaster"
 roman_characters_event.105.d:0 "Enrico Mattei, a self made industrialist from Ancona, is a revolutionary figure in the modern energy sector, responsible for securing vital oil and gas supplies for the Empire. He is a master of resource negotiation, often outmanoeuvring large foreign conglomerates to secure favorable deals for Rome. His energy network is vast, powerful, and essential for the modern military and industrial sectors of the state.\n\nMattei is not merely a businessman; he commands an immense network of intelligence, often blurring the line between commerce, diplomacy, and espionage to achieve his goals. He offers his services to the state, promising to use his ruthless acumen to secure industrial dominance. Recruiting him would grant Rome a brilliant industrialist, diplomat, and spymaster, capable of securing the resources necessary to fuel the Empire's future."
 roman_characters_event.105.opt1:0 "Appoint him Chief Trader to manage all Imperial resource acquisition."
 roman_characters_event.105.opt2:0 "Bring him into the Imperial Council to guide industrial policy."
 roman_characters_event.105.opt3:0 "Appoint him Spymaster to focus on industrial espionage."
 roman_characters_event.105.refuse:0 "His methods are too aggressive and destabilizing."

 # 106. ANDREA PALLADIO
 roman_characters_event.106.t:0 "The Master of Classical Proportion"
 roman_characters_event.106.d:0 "Andrea Palladio, an architect from the Venetian Prefecture, is the single most influential figure in modern architecture. His detailed study of the classical Roman ruins and the writings of Vitruvius led him to codify the principles of symmetry, proportion, and harmony, creating the Palladian style. This style has defined the aesthetic of Imperial and civil architecture across the entire Western hemisphere for centuries.\n\nPalladio is also a skilled military engineer, capable of applying classical geometry to the construction of fortifications and defensive works. His work embodies the spirit of classical Roman revivalism. Recruiting him would ensure the Imperial capital's architecture is guided by the strictest classical standards, preserving Roman aesthetic tradition while incorporating modern structural needs."
 roman_characters_event.106.opt1:0 "Commission him to design a series of new Imperial public buildings."
 roman_characters_event.106.opt2:0 "Utilize his knowledge of geometry for military engineering."
 roman_characters_event.106.refuse:0 "His style is too rigid for contemporary tastes."

 # 107. GIOVANNI DA VERRAZZANO
 roman_characters_event.107.t:0 "The Atlantic Explorer"
 roman_characters_event.107.d:0 "Giovanni da Verrazzano, a mariner from the Florentine Prefecture, has emerged as one of the most successful explorers of the new Western continent. He achieved fame by charting the entire coastline of the northern region of the New World, identifying the vast bay of the future capital of Nova Roma, and securing vital trade data on native populations.\n\nVerrazzano is a master of navigation, naval command, and coastal trade logistics. His voyages were daring, often venturing into unknown seas for months at a time. Recruiting him would secure a tested explorer and naval commander, vital for establishing and protecting trade routes and new colonies in the vast Western hemisphere."
 roman_characters_event.107.opt1:0 "Send him on new voyages of exploration and discovery."
 roman_characters_event.107.opt2:0 "Appoint him Admiral to command the Atlantic Fleet."
 roman_characters_event.107.opt3:0 "Utilize his knowledge of coastal trade as an Imperial Trader."
 roman_characters_event.107.opt4:0 "Appoint him chief Navigator to train our fleet captains."
 roman_characters_event.107.refuse:0 "The Atlantic Ocean remains too unpredictable."

 # 108. SOPHIA LOREN
 roman_characters_event.108.t:0 "The Face of the Roman Empire"
 roman_characters_event.108.d:0 "Sophia Loren, a world renowned actress from the Neapolitan Prefecture, is the single most recognizable cultural figure in the modern Empire. Her powerful presence and performances have made her a global celebrity, symbolizing the beauty, resilience, and passion of the modern Roman people. Her influence spans far beyond cinema, extending into fashion, diplomacy, and global commerce.\n\nLoren possesses unparalleled access to the global elite and can influence public opinion across every continent. Her charm and strategic acumen make her uniquely suited for sensitive diplomatic and intelligence gathering roles. Recruiting her would give the Empire an irresistible cultural tool, capable of boosting morale, facilitating high level diplomatic contact, and expanding Roman cultural influence globally."
 roman_characters_event.108.opt1:0 "Appoint her as a cultural ambassador and Artist advisor."
 roman_characters_event.108.opt2:0 "Utilize her global endorsement power to expand Imperial trade."
 roman_characters_event.108.opt3:0 "Appoint her Spymaster; her access to global elites is unmatched."
 roman_characters_event.108.opt4:0 "Send her as a special Diplomat on sensitive missions."
 roman_characters_event.108.refuse:0 "Film stars have no place in Imperial governance."

 # 109. MARCUS ULPIUS TRAIANUS
 roman_characters_event.109.t:0 "Trajan, The Optimus Princeps"
 roman_characters_event.109.d:0 "Marcus Ulpius Traianus, a general born in the Hispanian Prefecture, is universally regarded as the greatest ruler, the 'Optimus Princeps' or Best Citizen. He earned his fame by expanding the State to its largest territorial extent through brilliant, relentless military campaigns against the Dacians and the Parthians, securing vital resources and frontier stability. He is a master of siegecraft, naval command, and legionary reform.\n\nTrajan's authority was characterized by massive public works, liberal governance, and respect for the Senate. He embodies the ideal fusion of military might, administrative competence, and public service. Recruiting him as a ruler would return the State to its greatest historical potential, securing military excellence and setting the highest possible standard for governance and territorial expansion."
 roman_characters_event.109.opt1:0 "Appoint him General in Chief to command the legions."
 roman_characters_event.109.opt2:0 "Grant him command of the Imperial Fleet."
 roman_characters_event.109.opt3:0 "Utilize his experience to reorganize the Imperial army structure."
 roman_characters_event.109.opt4:0 "Allow him to seize the title and rule as the Optimus Princeps."
 roman_characters_event.109.refuse:0 "His standards are impossibly high for our current state."

 # 110. FLAVIUS VALERIUS CONSTANTINUS
 roman_characters_event.110.t:0 "Constantine, The Great Unifier"
 roman_characters_event.110.d:0 "Flavius Valerius Constantinus, a brilliant commander born in the Danube Prefecture of Serbia, rose to power during the turbulent civil wars of the late Empire, eventually unifying the entire Roman world under his sole authority. His decisive victory at the Milvian Bridge, achieved after adopting the banner of the new prevailing Faith, secured his ultimate triumph.\n\nConstantine is most famous for his role in cementing the status of the Imperial Faith and for founding the new capital of Constantinople, shifting the gravitational centre of the Empire eastward. He is a master strategist, military reformer, and political operator, who understood that spiritual authority must reinforce secular power. Recruiting him would secure a leader capable of ruthless military excellence, complete administrative centralization, and the absolute enforcement of a unified State doctrine."
 roman_characters_event.110.opt1:0 "Appoint him General in Chief to command the legions."
 roman_characters_event.110.opt2:0 "Utilize his resolve to enforce doctrinal conformity across the Empire."
 roman_characters_event.110.opt3:0 "Appoint him Commandant to reorganize the Palace Guard and Field Army."
 roman_characters_event.110.opt4:0 "Allow him to seize the title and rule as the great Unifier."
 roman_characters_event.110.refuse:0 "We refuse to tolerate another military usurper."