l_english:
  # --- 1. ROME: The Pontifical Palace ---
 roman_pontifical_palace:0 "Palatium Pontificium"
 
 start_roman_pontifical_palace:0 "Ruins of the Palatine"
 start_roman_pontifical_palace_desc:0 "The site where the hellenic priests is a perfect spot for a grand temple. It awaits a ruler pious enough to fund its construction."
 
 tier_1_roman_pontifical_palace:0 "Roman Collegium"
 tier_1_roman_pontifical_palace_desc:0 "We have cleared the rubble and established the sacred perimeter. The priests have joined to perform the rites."
 
 tier_2_roman_pontifical_palace:0 "Great Temple Complex"
 tier_2_roman_pontifical_palace_desc:0 "The Palatine Hill shines with marble and gold. Missionaries are trained here and sent to the furthest provinces to enforce the Imperial Truth."
 
 tier_3_roman_pontifical_palace:0 "The Caput Mundi"
 tier_3_roman_pontifical_palace_desc:0 "This is the spiritual center of the world. From this throne, the High Priest dictates the fate of souls. Heresy cannot survive in the shadow of this monument."
 
 # --- 2. FLORENTIA: The Academia Florentina ---
 roman_academia_florentina:0 "Academia Florentina"
 
 start_roman_academia_florentina:0 "The Tuscan Schools"
 start_roman_academia_florentina_desc:0 "The hills of Tuscany have always been home to poets and thinkers, yet they lack a unifying center. Scattered scrolls and private tutors are all that remain of the region's intellectual potential, waiting for an Imperial patron to organize them."
 
 tier_1_roman_academia_florentina:0 "The Medicean Library"
 tier_1_roman_academia_florentina_desc:0 "A great library has been commissioned in Florentia, gathering the lost texts of the Greeks and the Etruscans. Scribes work day and night to preserve the wisdom of the ancients, ensuring that the knowledge of the past is not lost to the barbarians."
 
 tier_2_roman_academia_florentina:0 "University of Neo-Platonism"
 tier_2_roman_academia_florentina_desc:0 "The library has expanded into a full university dedicated to the study of Plato and the nature of the One. Philosophers from across the Empire flock here to debate theology and metaphysics, blending Roman pragmatism with Greek idealism."
 
 tier_3_roman_academia_florentina:0 "The Great Academy of the West"
 tier_3_roman_academia_florentina_desc:0 "Florentia has eclipsed Athens as the intellectual capital of the world. Here, science, philosophy, and theology are fused into a single pursuit of truth. The Academy stands as a beacon of reason, proving that the Roman mind is as sharp as the Roman sword."

 # --- 3. TURIN: Castra Praetoria Alpina ---
 roman_alpine_command:0 "Castra Praetoria Alpina"
 
 start_roman_alpine_command:0 "The Piedmont Outposts"
 start_roman_alpine_command_desc:0 "The passes of the Alps are treacherous and poorly guarded. While local garrisons watch the snows for barbarian movement, there is no centralized command capable of repelling a full-scale invasion from the north."
 
 tier_1_roman_alpine_command:0 "Fortified Border Command"
 tier_1_roman_alpine_command_desc:0 "Stone has replaced wood, and a permanent Legatus has been assigned to Augusta Taurinorum. The fortress now serves as the primary observation point for the Alpine frontier, ensuring that no army crosses the mountains undetected."
 
 tier_2_roman_alpine_command:0 "The Regional Castra"
 tier_2_roman_alpine_command_desc:0 "A sprawling military city has grown around the fortress. Blacksmiths, fletchers, and engineers work tirelessly to supply the northern legions. It is a machine of war, churning out supplies and disciplined recruits to man the walls of Italy."
 
 tier_3_roman_alpine_command:0 "The Shield of Italy"
 tier_3_roman_alpine_command_desc:0 "The Castra Praetoria Alpina is impregnable. With triple-layered walls and a garrison that never sleeps, it is the ultimate deterrent against the north. As long as Augusta Taurinorum stands, the heartland of the Empire remains safe from the barbarian hordes."

 # --- 4. LYON: The Altar of the Three Gauls ---
 roman_altar_gaul:0 "Altar of the Three Gauls"
 
 start_roman_altar_gaul:0 "The Federal Sanctuary"
 start_roman_altar_gaul_desc:0 "The ancient meeting place of the Gallic tribes is currently a modest site. While the local chieftains still gather to discuss trade, the spiritual bond that once tied them to the Emperor in Rome has frayed with time."
 
 tier_1_roman_altar_gaul:0 "Restored Council Chamber"
 tier_1_roman_altar_gaul_desc:0 "The federal council has been formalized once more. Representatives from all the Gallic provinces gather annually to renew their oaths of loyalty. The Altar is maintained, and the imperial cult begins to take root in the local aristocracy."
 
 tier_2_roman_altar_gaul:0 "Temple of Rome and Augustus"
 tier_2_roman_altar_gaul_desc:0 "A magnificent temple dedicated to Rome and the Emperor now dominates the confluence of the rivers. The distinct tribal identities are melting away, replaced by a unified Gallo-Roman culture that looks to Lugdunum as its spiritual heart."
 
 tier_3_roman_altar_gaul:0 "The Heart of the Provinces"
 tier_3_roman_altar_gaul_desc:0 "Lugdunum is no longer just a provincial capital; it is the pivot of the West. The Altar of the Three Gauls is a symbol of perfect integration, proving that one can be both Gallic by blood and Roman by spirit. Separatism is a memory here."

 # --- 5. TARRAGONA: The Great Harbor ---
 roman_harbor_tarraco:0 "Great Harbor of Tarraco"
 
 start_roman_harbor_tarraco:0 "The Old Scipio Docks"
 start_roman_harbor_tarraco_desc:0 "The ancient docks built by the Scipios are silting up. While local fishermen still ply their trade, the harbor lacks the depth and infrastructure to support a true Imperial warfleet or heavy merchant traffic."
 
 tier_1_roman_harbor_tarraco:0 "Dredged Deepwater Port"
 tier_1_roman_harbor_tarraco_desc:0 "Imperial engineers have dredged the harbor and reinforced the seawalls with concrete. Merchant vessels from across the Mediterranean can now dock safely, bringing the wealth of Hispania to the rest of the Empire."
 
 tier_2_roman_harbor_tarraco:0 "The Imperial Shipyards"
 tier_2_roman_harbor_tarraco_desc:0 "Huge drydocks and warehouses now line the coast. The forests of the interior are floated downriver to construct the Empire's heavy triremes. Tarraco has become the primary naval logistics hub for the Western Mediterranean."
 
 tier_3_roman_harbor_tarraco:0 "Gate of the Atlantic"
 tier_3_roman_harbor_tarraco_desc:0 "The Great Harbor of Tarraco is the envy of the world. It is a city on the water, capable of harboring a thousand ships. From here, Roman power projects not just into the Mare Nostrum, but out past the Pillars of Hercules into the Unknown Ocean."

 # --- 6. THESSALONIKI: Imperial Palace ---
 roman_palace_thessalonica:0 "Imperial Palace of Thessalonica"
 
 start_roman_palace_thessalonica:0 "Galerius's Legacy"
 start_roman_palace_thessalonica_desc:0 "The structures left by the Tetrarch Galerius still stand, but they are faded and repurposed. The Rotunda is quiet, and the hippodrome sees few races. The city waits for a new Emperor to breathe life into its stone."
 
 tier_1_roman_palace_thessalonica:0 "Restored Rotunda"
 tier_1_roman_palace_thessalonica_desc:0 "The massive brick Rotunda has been restored and consecrated to the Imperial Cult. The Arch of Galerius has been polished, reminding the local populace of the triumphs of the past and the strength of the legions."
 
 tier_2_roman_palace_thessalonica:0 "The Eastern Court"
 tier_2_roman_palace_thessalonica_desc:0 "A fully functional Imperial Palace has been constructed, allowing the Emperor to reside here comfortably while campaigning in the East. It is a second capital, bustling with generals, diplomats, and spies from the steppes."
 
 tier_3_roman_palace_thessalonica:0 "Command of the Balkans"
 tier_3_roman_palace_thessalonica_desc:0 "Thessalonica is the iron fist of the Empire. The palace complex serves as the nerve center for the entire Balkan defense network. From here, the Danube frontier is managed with ruthless efficiency, ensuring civilization never falls."

 # --- 7. BAALBEK: Temple of Jupiter Heliopolitanus ---
 roman_temple_heliopolis:0 "Great Temple of Heliopolis"
 
 start_roman_temple_heliopolis:0 "The Phoenician Stones"
 start_roman_temple_heliopolis_desc:0 "The ancient site of Baalbek has been holy since the dawn of time. The massive foundation stones—the largest ever quarried—lie waiting for a structure worthy of their immense scale."
 
 tier_1_roman_temple_heliopolis:0 "Temple of the Sun"
 tier_1_roman_temple_heliopolis_desc:0 "Construction has begun on a massive scale. A new sanctuary dedicated to the Solar aspect of Jupiter is rising. The local population, seeing their ancient gods honored by Rome, begins to align their loyalty with the Empire."
 
 tier_2_roman_temple_heliopolis:0 "The Court of the Hexagon"
 tier_2_roman_temple_heliopolis_desc:0 "The massive forecourt and the hexagonal entrance have been completed. It is a pilgrimage site for the entire East, a place where Roman discipline meets the mysticism of the Levant. The sheer size of the columns leaves visitors in awe."
 
 tier_3_roman_temple_heliopolis:0 "Sanctuary of Jupiter Heliopolitanus"
 tier_3_roman_temple_heliopolis_desc:0 "The Trilithon is complete. The Temple of Jupiter Heliopolitanus is the largest religious structure in the world, a mountain of stone carved by human hands. It stands as eternal proof that the Roman gods are supreme over all others."

 # --- 8. CARTHAGE: Temple of Juno Caelestis ---
 roman_temple_carthage:0 "Temple of Juno Caelestis"
 
 start_roman_temple_carthage:0 "Ruins of the Byrsa"
 start_roman_temple_carthage_desc:0 "The citadel of the Byrsa was flattened long ago by Scipio. Though a Roman colony sits nearby, the hilltop remains a scar, haunted by the ghosts of the Punic Wars."
 
 tier_1_roman_temple_carthage:0 "Colonia Iulia Carthago"
 tier_1_roman_temple_carthage_desc:0 "The hilltop has been leveled and consecrated. A new temple foundation is laid, dedicated to Tanit under her Roman name, Juno Caelestis. The city is growing again, feeding the grain fleets of the Empire."
 
 tier_2_roman_temple_carthage:0 "Temple of the Queen of Heaven"
 tier_2_roman_temple_carthage_desc:0 "A magnificent temple now crowns the Byrsa hill. Juno Caelestis is worshipped as the protector of the imperial grain supply and the patron of the African fleet. Carthage is no longer a rival, but a daughter of Rome."
 
 tier_3_roman_temple_carthage:0 "Citadel of the South"
 tier_3_roman_temple_carthage_desc:0 "Carthage has been fully reborn, rivaling Alexandria in splendor. The Temple of Juno Caelestis serves as a beacon for ships miles out at sea. It is the impregnable hub of Roman Africa, ensuring the breadbasket of the Empire is forever secure."

 # --- 9. SIWA: Oracle of Zeus-Ammon ---
 roman_oracle_siwa:0 "Oracle of Zeus-Ammon"
 
 start_roman_oracle_siwa:0 "The Silent Oasis"
 start_roman_oracle_siwa_desc:0 "The desert track to Siwa is treacherous and the old temple is crumbling. The Oracle speaks rarely now, and few travelers brave the sands to hear the whispers of the hidden god."
 
 tier_1_roman_oracle_siwa:0 "Restored Pathway"
 tier_1_roman_oracle_siwa_desc:0 "Waystations have been built along the desert route, making the pilgrimage safe for imperial officials. The temple facade has been reinforced, and the priests of Ammon have been brought under the Pontifex's protection."
 
 tier_2_roman_oracle_siwa:0 "The Syncretic Sanctuary"
 tier_2_roman_oracle_siwa_desc:0 "Egyptian mystery meets Roman order. The temple has been expanded with a mix of Pharaonic and Classical architecture. The Oracle is consulted on matters of state, providing divine sanction for the state's decrees."
 
 tier_3_roman_oracle_siwa:0 "Sanctuary of the Hidden One"
 tier_3_roman_oracle_siwa_desc:0 "Siwa is the spiritual gateway to the mysteries of the desert. The Oracle of Zeus-Ammon is revered as the ultimate source of divine truth. Here, the State is confirmed as an extension of the divine, granting a reputation that transcends borders."