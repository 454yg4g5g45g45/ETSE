 #cb types
 cb_conclude_civil_war: "Conclude the Civil War"
 cb_conclude_civil_war_desc: "Our realm, once united, is now divided in a period of civil war. Both sides of the civil war wish to put an end to the disunity and unite all of the land under one ruling power once more. With this casus belli, we can fully annex our enemy - on the other hand, they shall have the same justification to do the same to us should we lose."
 
 cb_claim_eastern_provinces: "Claim the Eastern Provinces"
 cb_claim_eastern_provinces_desc: "As the Corrector Totius Orientis, or Righter of the Entire East, we are de jure the overall commander of all Roman armies and provincial governors in the eastern provinces including Anatolia and Egypt. §OWith this casus belli, Roman provinces controlled by us in the Egypt, Mashriq or Anatolia regions will automatically defect to us after being controlled for about 6 months.§!"
 
