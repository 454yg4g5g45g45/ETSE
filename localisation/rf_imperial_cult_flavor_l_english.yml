l_english:
 # Event 1: The Apotheosis
 # Context: This is the rare moment the Collegium breaks tradition to worship you while alive.
 imperial_cult_flavor.1.t:0 "Apotheosis of the Living Ruler"
 imperial_cult_flavor.1.d:0 "In a rare and momentous session, the Collegium Pontificum has unanimously voted to grant you the honors of Apotheosis while you yet live. Usually reserved for the 'Divi', the great ancestors deified after death, this decree recognizes your Genius (guardian spirit) as essential to the survival of the State. Statues of your likeness are being moved into the inner sanctuaries, placing you on equal footing with Romulus. You are no longer merely the High Priest of Rome; you are becoming its deity."
 imperial_cult_flavor.1.a:0 "The State and the Divine are one."

 # Event 2: Caesar vs Cincinnatus
 # Context: Choosing a role model for your administration.
 imperial_cult_flavor.2.t:0 "The Mos Maiorum"
 imperial_cult_flavor.2.d:0 "As Supreme Magistrate and Pontifex Maximus, you embody the will of the Roman people. The Collegium looks to you to set the moral tone of the era. Two ancient examples dominate the debate: Julius Caesar, who seized absolute power to reshape the world through force of will, and Cincinnatus, who accepted the dictatorship only as a burden to save the state, returning to his plow when duty was done. The legions desire the glory of Caesar; the Senate prays for the virtue of Cincinnatus."
 imperial_cult_flavor.2.a:0 "Caesar's way. Power must be wielded."
 imperial_cult_flavor.2.b:0 "Cincinnatus's way. Power is a sacred trust."

 # Event 3: Seneca
 # Context: Administrative philosophy.
 imperial_cult_flavor.3.t:0 "The Counsel of Seneca"
 imperial_cult_flavor.3.d:0 "The intellectual faction of the Collegium, modeling themselves after the great Stoic advisor Seneca, has presented a petition. They argue that the majesty of the Ruler is best demonstrated not through gold or wars, but through the benevolent administration of the provinces and the cultivation of the citizenry. They urge you to divert funds from the military treasury to public works, arguing that a stable and prosperous Rome is the only offering the Gods truly desire."
 imperial_cult_flavor.3.a:0 "Wisdom is the virtue of rulers. Approve the funds."
 imperial_cult_flavor.3.b:0 "The Treasury exists to fund the Legions."

 # Event 4: Cicero
 # Context: Diplomatic vs Military approach.
 imperial_cult_flavor.4.t:0 "The Cicero Faction"
 imperial_cult_flavor.4.d:0 "A diplomatic crisis has emerged on the frontier. The 'Ciceronians' within the Collegium urge you to use rhetoric, alliances, and soft power to resolve the situation, citing the example of the great Orator himself. However, your generals are restless. They see negotiation as a sign of weakness in the Head of State and argue that the only language barbarians understand is the sword. The Collegium warns that a war now would disrupt the sacred peace of the realm."
 imperial_cult_flavor.4.a:0 "Follow Cicero. Words can be sharper than steel."
 imperial_cult_flavor.4.b:0 "Rome does not negotiate. March the legions."

 # Event 5: The Veto
 # Context: The clash between your political power and their religious tradition.
 imperial_cult_flavor.5.t:0 "The Collegium's Veto"
 imperial_cult_flavor.5.d:0 "Shockwaves have rippled through the capital. The Collegium Pontificum has formally refused to ratify your latest decree, claiming it violates the 'Mos Maiorum', the unwritten way of the ancestors. While you are the Pontifex Maximus and Head of State, the Collegium acts as the keeper of tradition. They argue that even the Supreme Magistrate cannot overturn the sacred customs of the past without risking the Pax Deorum. To proceed would be to declare open war on the priesthood."
 imperial_cult_flavor.5.a:0 "My will is the only tradition that matters!"
 imperial_cult_flavor.5.b:0 "We cannot insult the ancestors. Withdraw the decree."

 # Event 6: The Pretender
 # Context: A challenger to your spiritual legitimacy, not necessarily your godhood.
 imperial_cult_flavor.6.t:0 "The False Lineage"
 imperial_cult_flavor.6.d:0 "A charismatic general in the provinces has risen in revolt. Worse than a simple usurpation, he claims to have discovered genealogical proof linking him directly to the Divi of old, the deified emperors of the past. He challenges your spiritual legitimacy, calling you a pretender who has lost the favor of the Gods. If the legions believe that the 'Auctoritas' has passed to him, your administration will collapse from within."
 imperial_cult_flavor.6.a:0 "Prove my mandate on the battlefield. Crush him."
 imperial_cult_flavor.6.b:0 "Pay the Priests to expose his lies."