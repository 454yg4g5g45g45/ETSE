 roman_assimilation.1.t:0 "The Romanization of Iberia"
 roman_assimilation.1.d:0 "The transformation of Hispania is no longer merely political. It is carved into the very stone of the peninsula. Where once isolated tribal castros clung defensively to the hilltops, sprawling urbane settlements now dominate the valleys and are fed by the lifeblood of Roman engineering. Great aqueducts span the dry ravines. Their limestone arches stand as monuments to order amidst the rugged terrain. The new roads are paved with deep foundations to cut straight paths through ancient forests and connect distant tribes to the heartbeat of the Empire. Yet this is not Rome transplanted but Rome adapted. The new basilicas and villas utilize our concrete and grid systems yet they are adorned with the intricate metalwork and geometric masonry unique to the Celtiberian tradition. A new dialect rings out in the forums. It is a vulgar Latin softened by local tongues. These people are no longer conquered subjects. They are the architects of a new and distinct province."
 roman_assimilation.1.a:0 "A vital province, forged in stone and blood."
 roman_assimilation.1.b:0 "They are merely provincials mimicking greatness."
 
 roman_assimilation.2.t:0 "The Romanization of Gallia"
 roman_assimilation.2.d:0 "The transformation of Gaul is tasted in the wine and heard in the poetry of the new generation. The aristocracy has traded their heavy trousers and gold torcs for fine wool togas and senatorial rings. While the druidic groves are silent the altars to Mercury and Mars are piled high with offerings yet the gods sculpted there bear distinctly Gallic features. In the dining halls the consumption of beer and roasted boar has given way to imported vintage wines and sauces seasoned with garum. The pottery workshops of the region now produce red gloss wares that rival the kilns of Italy and are sold across the known world. A new class of Gallian scholars has risen. They master the art of Latin rhetoric with a passion that outshines even the orators of Rome."
 roman_assimilation.2.a:0 "A fusion of Celtic spirit and Roman order."
 roman_assimilation.2.b:0 "Let the tribes remain in the forest."

 roman_assimilation.3.t:0 "The Romanization of Britannia"
 roman_assimilation.3.d:0 "In the mist-shrouded north a unique society is forming at the edge of the world. The locals have learned that Roman citizenship offers warmth against the chill as they gather in the public baths to gossip in a hybrid tongue of Latin and Brythonic. The worship of the goddess Sulis has merged seamlessly with Minerva creating a healing cult that draws pilgrims from across the seas to the hot springs. Britannia is no longer a wild frontier but a workshop of the Empire. The heavy hooded cloaks woven here are prized in Rome itself and British hunting dogs are exported to the furthest arenas. The chieftains now send their sons to serve in the legions not as auxiliaries but as officers who wear the crest of Rome with island pride."
 roman_assimilation.3.a:0 "Civilization reaches the edge of the world."
 roman_assimilation.3.b:0 "The fog is too thick to conquer."

 roman_assimilation.6.t:0 "The Romanization of Mauretania"
 roman_assimilation.6.d:0 "The coast of Africa has blossomed into a powerhouse of culture and commerce. The chaotic tribal councils have evolved into orderly municipal senates where men of Berber and Punic descent argue Roman law with a fervor that frightens the Italians. The rich scent of olive oil presses fills the air of the cities while the ports overflow with grain destined to feed the plebs of Rome. Even the gods have adapted. The ancient worship of Baal continues under the guise of Saturn and the rituals of the desert are performed within the marble colonnades of the Forum. The Africian identity is one of intense intellectualism and agricultural wealth. They are a people who view themselves as the new soul of the Latin West."
 roman_assimilation.6.a:0 "The granary of the Empire is secure."
 roman_assimilation.6.b:0 "Sand will eventually bury the stone."

 roman_assimilation.5.t:0 "The Romanization of Egypt"
 roman_assimilation.5.d:0 "A strange and beautiful synthesis has taken hold along the Nile. The ancient obsession with the afterlife remains but the faces that stare back from the mummy cases are now painted in the realistic style of Roman portraiture. The high priests of Memphis and Thebes now wear the toga over their linen robes and offer prayers to the Emperor as a living god in the pharaonic tradition. In the bustling streets of Alexandria the complex bureaucracy of the Ptolemies has been streamlined by Roman efficiency turning the province into a machine of taxation and grain production. The Aegyptians have not lost their heritage. They have merely encased it in Roman armor. They serve the Empire with the patience of a people who have seen dynasties rise and fall for three thousand years."
 roman_assimilation.5.a:0 "Heirs to the Nile and the Tiber."
 roman_assimilation.5.b:0 "The old gods are too jealous to share."

 roman_assimilation.7.t:0 "The Romanization of Arabia"
 roman_assimilation.7.d:0 "The scent of frankincense has always defined these lands but now it wafts through temples built to Jupiter and Dionysus. The great caravan leaders who once navigated by the stars now hold majestic banquets in colonnaded dining rooms where they discuss the price of silk in Latin. The tribal structures have not vanished but have been woven into the imperial fabric. The Sheikhs have become magistrates and their desert scouts now serve as highly paid auxiliaries patrolling the trade routes. The Nabathean script slowly morphs as it is used to record Roman contracts and laws. The Arabicans are a people who have successfully bridged the gap between the freedom of the dunes and the stability of the Forum."
 roman_assimilation.7.a:0 "Deserts tamed by paved roads."
 roman_assimilation.7.b:0 "Let the sands reclaim them."
 
 roman_assimilation.8.t:0 "The Romanization of Persia"
 roman_assimilation.8.d:0 "The ancient rivalry has ended not in destruction but in a magnificent union. The skyline of Ctesiphon is changing as Roman architects introduce the concrete dome to sit alongside the traditional brick vaults of the East. The King of Kings now wears the purple alongside the Senatorial stripe and the administration of the Satrapies is streamlined by the census takers of Rome. In the military camps the heavy cataphracts of the Persians are reorganized into the discipline of the legions to create an unstoppable force of iron and horseflesh. The fire altars still burn but they are now housed within temples that follow the geometric perfection of Vitruvius. The Persicans are no longer enemies of the West but its most cultured guardians."
 roman_assimilation.8.a:0 "A marriage of Eagle and Lion."
 roman_assimilation.8.b:0 "Do not disturb their traditions."

 roman_assimilation.9.t:0 "The Romanization of Khorasan"
 roman_assimilation.9.d:0 "On the far edge of the known world the Pax Romana has brought a golden age of stability to the Silk Road. The dusty trading posts of Bactria have been expanded into fortified cities where Roman customs houses tax the wealth of China and India. The descendants of Alexander's colonists have welcomed the legions as long lost cousins and Latin is spoken here with a strange Greek inflection. Massive stone watchtowers now line the trade routes to guard caravans from the steppe bandits. In the markets of Merv one can find spices from the east being sold for coins minted in Rome. The Arianaic people serve as the wealthy gatekeepers between the Empire and the rising sun."
 roman_assimilation.9.a:0 "The Silk Road is a Roman road."
 roman_assimilation.9.b:0 "Allow them their own ways."

 roman_assimilation.10.t:0 "The Romanization of Anatolia"
 roman_assimilation.10.d:0 "The peninsula has transformed from a collection of Hellenic states into the industrial and cultural engine of the East. The great cities of Ephesus and Pergamum are being rebuilt on a monumental scale with vast bath complexes and libraries that rival those of the capital. Roman aqueducts march across the valleys to bring fresh water to populations that have doubled in size under imperial rule. The hillsides are terraced for vineyards and the ports are expanded with deep concrete moles to shelter the grain fleets. While Greek philosophy is still cherished it is now debated in the Latin tongue by men wearing the toga. The Anatolians have become the most loyal and populous core of the Roman world."
 roman_assimilation.10.a:0 "The second heart of the Empire beats strong."
 roman_assimilation.10.b:0 "Let the locals retain their ways."

 roman_assimilation.11.t:0 "The Romanization of the Caucasus"
 roman_assimilation.11.d:0 "The legions have achieved what was thought impossible by taming the wild peaks between the two seas. Roman engineers have carved paved roads directly into the cliff faces of the Darial Gorge to turn treacherous goat paths into secure military highways. The rich mines of the region are now worked with hydraulic technology to extract gold and iron for the Imperial mints. In the valleys the ancient tradition of winemaking has been industrialized by Roman estate management. The fierce mountain clans have descended from their stone towers to enlist as elite mountaineer cohorts. The Colchians have traded their tribal feuds for the stability of Roman law and the prosperity of the valleys."
 roman_assimilation.11.a:0 "Iron discipline in the mountains."
 roman_assimilation.11.b:0 "Preserve their mountain independence."

 roman_assimilation.12.t:0 "The Romanization of the Pontic Steppe"
 roman_assimilation.12.d:0 "The endless sea of grass has been measured and marked by the surveyor. The nomadic courts of the Bosporus have settled into permanent towns protected by ditches and earthworks in the Roman fashion. The export of grain to the Mediterranean is now organized through massive stone warehouses on the coast that replace the temporary markets of the past. Even the dwellings have changed as the circular shape of the yurt is replicated in timber and fired brick villas designed to withstand the steppe winds. The horse lords have learned the value of infantry tactics and their chieftains study military manuals written in Latin. The Sarmatinian people are now the shield that protects civilization from the wild north."
 roman_assimilation.12.a:0 "Order brought to the wild fields."
 roman_assimilation.12.b:0 "Leave them to the steppe winds."

 roman_assimilation.13.t:0 "The Romanization of Carpathia"
 roman_assimilation.13.d:0 "The rich veins of gold in the Apuseni mountains now fuel the economy of the Empire and the province has flourished under the protection of the eagle. The ancient Dacian hill forts have been abandoned for planned cities in the valleys where veterans of the legions retire to farm the fertile soil. A unique culture has emerged from this settlement as the Latin spoken here preserves ancient forms lost elsewhere. The wolf standard of the old tribes now flies alongside the Roman eagle and the local religion has syncretized Zalmoxis with Jove. The Carpathians are a testament to the ability of Rome to turn a fierce enemy into a prosperous daughter."
 roman_assimilation.13.a:0 "Dacia Felix, happy and Roman."
 roman_assimilation.13.b:0 "Let the old spirits linger."

 roman_assimilation.14.t:0 "The Romanization of Greece"
 roman_assimilation.14.d:0 "The adage that captive Greece took captive her rude conqueror has never been truer. The cities of the Aegean have been restored to their former glory thanks to imperial patronage with Roman concrete reinforcing the marble of the classical age. The Agora and the Forum have merged into a single center of civic life where Roman law is debated with Stoic philosophy. The aristocracy of the region now holds dual citizenship and dominates the intellectual life of the Empire. The Hellenes have not been erased. Instead they have been elevated to become the teachers and co-rulers of the Roman world."
 roman_assimilation.14.a:0 "A synthesis of Wisdom and Strength."
 roman_assimilation.14.b:0 "Let the Greeks be Greeks."

 roman_assimilation.15.t:0 "The Romanization of the Balkans"
 roman_assimilation.15.d:0 "The rugged spine of the peninsula has become the primary recruiting ground for the legions and the culture here reflects a martial discipline. The winding Via Egnatia is paved with thick slabs to support the march of armies and acts as the lifeline of the province. Settlements here are built like fortresses with thick walls and watchtowers that loom over the mountain passes. The dialect spoken in the markets is the rough efficient Latin of the military camp. These Balkanians do not care for the soft luxuries of the capital but pride themselves on their iron hardness. They are the shield that guards the heart of the Empire."
 roman_assimilation.15.a:0 "The Sword of Rome is forged here."
 roman_assimilation.15.b:0 "Let their native customs remain."

 roman_assimilation.16.t:0 "The Romanization of South Germania"
 roman_assimilation.16.d:0 "The great frontier wall of the Limes no longer divides the world but acts as a spine of commerce. The dense Hercynian forest is being cleared to make way for vast farming estates modeled on the Italian villa rustica. On the sunlit slopes of the river valleys the locals have learned the Roman art of viticulture and replaced their mead with Riesling wine. The towns are built of timber and stone with steep roofs designed to shed the heavy snows of winter while the interiors are warmed by Roman hypocaust heating. The Germanicans have traded their tribal chaos for the stability of the grid and the prosperity of the plow."
 roman_assimilation.16.a:0 "The Rhine is a Roman river."
 roman_assimilation.16.b:0 "Allow their freedom."

 roman_assimilation.17.t:0 "The Romanization of North Germania"
 roman_assimilation.17.d:0 "The dark woods and misty bogs of the north are being tamed by the relentless spade of the legionary. Roman hydraulic engineering has drained the marshes to create rich pastureland protected by dikes and canals. The ports along the coast have been expanded with stone quays to handle the lucrative amber trade flowing from the Baltic. The longhouses of the tribal chieftains have evolved into great halls built with fired brick and tile yet they still retain the open hearths of their ancestors. The Sassonians have married their skill with the organizational genius of the Romans creating a culture that looks outward to the northern seas."
 roman_assimilation.17.a:0 "Order brought to the northern tides."
 roman_assimilation.17.b:0 "Let their independence endure."

 roman_assimilation.4.t:0 "The Romanization of the Lowlands"
 roman_assimilation.4.d:0 "The waterlogged delta of the Rhine has been tamed by the relentless application of Roman engineering. Where the tide once dictated life we now see massive dykes and canals that reclaim the land for agriculture and settlement. The Batavians have proven to be the Empire's most capable students. They have combined their legendary skill in swimming armed across rivers with the discipline of the Legion. Their villages of mud and thatch have been replaced by brick manufacturing towns that supply the northern frontier. In the markets the heavy barges unload grain and wine while the local magistrates conduct business in flawless Latin. They are a people of the river and the road."
 roman_assimilation.4.a:0 "Heirs to the Rhine and the Tiber."
 roman_assimilation.4.b:0 "Let the marshlands keep their own tongues."
 
 roman_assimilation.18.t:0 "The Romanization of the Levant"
 roman_assimilation.18.d:0 "The ancient crossroads of the world has been repaved with Roman stone. The great colonnaded streets of Antioch and Palmyra now rival the magnificence of the Capital itself. The famous law schools of Berytus train the greatest legal minds of the East ensuring that the Pax Romana is upheld with the pen as well as the sword. While the ancient tongues of Aramaic and Greek still whisper in the souks the language of power is Latin. The temples of the Sun God have been expanded with vast Roman domes and the local merchants travel the Silk Road with the confidence of citizens. The Syriacians have merged the wisdom of the prophets with the order of the Senate."
 roman_assimilation.18.a:0 "The East is ordered and prosperous."
 roman_assimilation.18.b:0 "Let them follow their own faith and tongue."
 
 roman_assimilation.19.t:0 "Unification of the Italic Peoples"
 roman_assimilation.19.d:0 "This is the fulfillment of a destiny written in the stars. The distinction between Roman and Ally has finally dissolved into history. The engineering genius of the Etruscans the hill-fort resilience of the Samnites and the austere discipline of the Latins have fused into a single glorious identity. The peninsula is now a seamless garden of villas and marble cities connected by the arteries of the Via Appia and the Via Flaminia. We no longer speak of conquered tribes but of a united Italic family that forms the beating heart of the world. From the Alps to Sicily the same laws protect every man and the same gods bless every hearth. Rome is no longer just a city. It is Italy itself."
 roman_assimilation.19.a:0 "E Pluribus Unum."
 roman_assimilation.19.b:0 "Let them cherish their distinct roots."
 
 roman_assimilation.20.t:0 "The Romanization of Scandinavia"
 roman_assimilation.20.d:0 "The light of civilization has pierced the long winters of the North. The fjords are no longer isolated inlets but thriving harbors where Roman merchant galleys dock alongside longships. The great timber halls of the chieftains have been retrofitted with stone foundations and hypocaust heating systems to defy the freezing winds. In the Thing assemblies the laws are now recorded on wax tablets in Latin script and the blood feuds of the past are settled in courts of law. The Nordanians have not lost their warrior spirit but they have tempered it with the discipline of the south. They are the ironclad guardians of the northern seas."
 roman_assimilation.20.a:0 "The Eagle flies over the fjords."
 roman_assimilation.20.b:0 "Let the old North endure."

 roman_assimilation.21.t:0 "The Romanization of the Baltic"
 roman_assimilation.21.d:0 "The Amber Coast has been integrated into the economy of the world. The dense and trackless woods are now cut by paved causeways that allow the legions to march where once only wolves roamed. The extraction of amber has been industrialized and the wealth it generates has built stone temples to Diana in the sacred groves. The Baltian people have traded their isolation for the protection of the Empire. Their ports are bustling hubs where furs and honey are exchanged for Roman wine and glass. They are the vigilant sentinels of the northeastern frontier loyal to the peace that brings them prosperity."
 roman_assimilation.21.a:0 "Civilization reaches the Amber Coast."
 roman_assimilation.21.b:0 "Let them remain free."

 roman_assimilation.22.t:0 "The Romanization of the Vistula"
 roman_assimilation.22.d:0 "The ancient Amber Road has evolved from a dirt track into a major paved artery of the Empire. The fertile plains of the Vistula are now dotted with Roman villas that manage vast agricultural estates using the latest iron plows and harvesting machines. The local chieftains have abandoned their wooden strongholds for brick manor houses and their sons study geometry to better manage the seasonal floods. The Vistulians have become the breadbasket of the north. They are a stoic people who have seamlessly blended the agricultural traditions of the Slavs with the market efficiency of the Forum."
 roman_assimilation.22.a:0 "Order brings a golden harvest."
 roman_assimilation.22.b:0 "Do not impose our ways."

 roman_assimilation.23.t:0 "The Romanization of Ruthenia"
 roman_assimilation.23.d:0 "The broad wild rivers of the steppe have been tamed by the arches of Roman bridges. Where once only light boats dared to venture massive stone quays now support heavy grain barges and patrol galleys. The Deneprians have built their cities on the high banks using a blend of white limestone and Roman concrete that gleams in the sun. The chaotic assemblies of the tribes have been replaced by municipal councils where the laws of the Twelve Tables are cited alongside ancient Slavic customs. These people have become the gatekeepers of the East merging the fierce independence of the steppe with the civic pride of the citizen."
 roman_assimilation.23.a:0 "A bridge between the steppe and the Senate."
 roman_assimilation.23.b:0 "Let their old ways remain."

 roman_assimilation.24.t:0 "The Romanization of Russia"
 roman_assimilation.24.d:0 "Deep within the endless taiga the sound of the axe has been replaced by the trowel of the mason. Roman engineers have carved straight roads through the dense woodlands connecting isolated settlements to the warmth of civilization. The harsh winters are no longer feared but managed as public baths and hypocaust systems bring Mediterranean heat to the frozen north. The Albinians serve as the wardens of the great forests. They export furs and timber to the south while importing the philosophy and literature of the classical world. They are a people of immense patience who have built a Rome of snow and stone."
 roman_assimilation.24.a:0 "Civilization defies the cold."
 roman_assimilation.24.b:0 "Let them keep their own customs."

 roman_assimilation.25.t:0 "The Romanization of the Ural"
 roman_assimilation.25.d:0 "We have reached the very limits of the map and found that the Eagle can soar even here. The mythical Riphean Mountains are no longer a legend but a province of industry. Roman mining technology has pierced the deep earth to extract the copper and gold that fuels the imperial economy. The settlements here are marvels of adaptation carved into the rock itself to shelter from the biting winds. The Hyperboreans have become a reality. They are a unique fusion of mountain mystic and Roman industrialist living at the edge of the world yet governed by the center."
 roman_assimilation.25.a:0 "From myth to province."
 roman_assimilation.25.b:0 "Respect their ancient traditions."
 
 roman_assimilation.26.t:0 "The Romanization of Central Asia"
 roman_assimilation.26.d:0 "The Silk Road has been paved with Roman stone transforming the dusty tracks of the caravan routes into the Via Serica. The great oasis cities of Samarkand and Bukhara have undergone a startling metamorphosis. The distinct blue tiles of the region now adorn massive concrete domes and triumphal arches that celebrate the reach of the Emperor. Water management has been revolutionized as Roman aqueducts feed into traditional Persian qanats to create lush gardens in the midst of the arid waste. The Turanians have emerged from this fusion. They are shrewd merchants who conduct trade in Latin and recite Virgil in the shade of the madrasas. They are the wealthy brokers between the Dragon of the East and the Eagle of the West."
 roman_assimilation.26.a:0 "Rome commands the Silk Road."
 roman_assimilation.26.b:0 "Let them keep their native traditions."

 roman_assimilation.27.t:0 "The Romanization of West Siberia"
 roman_assimilation.27.d:0 "The great rivers of the North have become the wet highways of the Empire. Along the banks of the Ob and the Irtysh the Roman obsession with bathing has found a new purpose as a survival necessity against the biting cold. Massive bathhouses built of timber and insulated with stone foundations serve as the communal hearts of these new settlements. The fur trade is no longer a barter among tribes but a regulated industry with stamped lead seals and tax collectors. The Obians are a people of the river who navigate their longboats with the discipline of the navy and face the dark winters with the stoicism of the Senate."
 roman_assimilation.27.a:0 "A new Tiber flows in the North."
 roman_assimilation.27.b:0 "Let them keep their native traditions."

 roman_assimilation.28.t:0 "The Romanization of East Siberia"
 roman_assimilation.28.d:0 "We have marched to the very edge of existence where the sun vanishes for months and the sky dances with spirit fire. Here the architecture of Rome has adapted to the extreme. Thick double walls filled with insulating earth protect the inhabitants and windows of thick mica trap the heat of the hearth. These settlements appear as beacons of light in the endless polar night where the discipline of the legion is the only thing standing between order and oblivion. The Ultarians are the sentinels at the end of the world. They are a hardened people who pray to Sol Invictus with a fervor known only to those who have seen the sun die and return."
 roman_assimilation.28.a:0 "The Legion stands watch in the dark."
 roman_assimilation.28.b:0 "Let them live as they always have."

 roman_assimilation.29.t:0 "The Romanization of the Eastern Steppe"
 roman_assimilation.29.d:0 "The endless ocean of grass is now bisected by the straight unyielding lines of Roman roads. The nomadic courts have not abandoned their horses but they have stabled them in brick cavalry forts that dot the landscape. The chaotic yurt encampments have evolved into circular walled towns where the skills of the archer are honed in organized gymnasiums. The cursus publicus or imperial post system has achieved its zenith here with relay stations allowing messages to fly across the steppe faster than the wind. The Equitans have combined the mobility of the nomad with the logistics of the Quartermaster. They are the centaurs of Rome."
 roman_assimilation.29.a:0 "Iron hooves on paved roads."
 roman_assimilation.29.b:0 "Let them keep their nomadic freedom."

 roman_assimilation.30.t:0 "The Romanization of the Eastern Provinces"
 roman_assimilation.30.d:0 "In these distant lands a unique harmony has been achieved between the rising and the setting sun. The terrace farming of the locals has been reinforced with Roman retaining walls and hydraulic pumps allowing for harvests of unprecedented size. The philosophy of the East with its emphasis on harmony and duty has blended seamlessly with the Roman virtues of Pietas and Gravitas. Temples here are open to the sky and built to align with the stars yet the rites performed within are strictly Latin. The Orientians see themselves as the final link in a chain that stretches across the entire world. They are the proof that Rome is universal."
 roman_assimilation.30.a:0 "The Empire has no horizon."
 roman_assimilation.30.b:0 "Let them follow their old customs."
 
 roman_assimilation.31.t:0 "The Genesis of the Pacoreans"
 roman_assimilation.31.d:0 "For generations, the eastern peninsula was viewed as a wild frontier, a land of fractured tribes and ancient feuds. Yet, under the steady hand of our governors and the cooperative spirit of the native aristocracy, order has been forged from chaos. A profound cultural syncretism is now sweeping through the provinces; Latin is spoken with the lilt of the eastern winds, and togas are worn alongside traditional silks. From this union of trade, law, and intermarriage, a distinct identity has been born: the Pacoreans. These people, styling themselves as the children of 'Peace' and the 'Orient,' have sworn to uphold the eternal light of Rome, standing as a disciplined bulwark beneath the rising sun."
 roman_assimilation.31.a:0 "Embrace this evolution."
 roman_assimilation.31.b:0 "Let them follow their old ways."
 
 roman_assimilation.32.t:0 "The Romanization of the Islands of the Dawn"
 roman_assimilation.32.d:0 "In these distant volcanic isles the Legions found a people whose obsession with honor rivaled that of the ancient Republic. A profound respect has bloomed between conqueror and conquered. The wooden castles of the Daimyos are being rebuilt with Roman mortar and stone creating impregnable fortresses that dominate the landscape. The local warrior class has adopted the lorica segmentata armor but wears it over traditional robes creating a terrifying silhouette on the battlefield. The tea ceremony is now performed in villas with open atriums and the code of Bushido has intertwined with the Stoic philosophy of Seneca. The Levitans are the result. A people of steel discipline who rise with the sun to serve the Empire."
 roman_assimilation.32.a:0 "The Katana and the Gladius serve one master."
 roman_assimilation.32.b:0 "Let them keep their ancient traditions."

 roman_assimilation.33.t:0 "The Harmony of Empires"
 roman_assimilation.33.d:0 "Two of the greatest civilizations in history have merged to create an administration of terrifying efficiency. The Mandate of Heaven is now secured by the Pax Romana. The vast plains of the north are bisected by arrow-straight Roman highways that allow the Imperial post to travel from the Great Wall to the capital in days. The confusing layout of the ancient cities has been reorganized into strict grids where Confucian scholars and Roman jurists draft laws that harmonize the rights of the citizen with the duties of the subject. The Sinosians are the ultimate bureaucrats and soldiers. They possess the industrial might of the East guided by the martial organization of the West."
 roman_assimilation.33.a:0 "The Dragon wears the Purple."
 roman_assimilation.33.b:0 "Allow them to follow their ancient ways."

 roman_assimilation.34.t:0 "The Romanization of the Silk Coast"
 roman_assimilation.34.d:0 "The warm and wet lands of the south have become the engine of Imperial wealth. Roman hydraulic engineers have revolutionized the ancient canal systems lining them with waterproof concrete to allow deep-draft barges to reach inland markets. The tea houses of the delta cities are now built with marble colonnades where merchants trade jade and silk using Roman currency. The naval tradition of the region has been enhanced by the introduction of the Corvus and the ballista turning local trade fleets into armed convoys. The Sericans are a people of refined taste and immense riches who view the Mediterranean as merely a western extension of their own trade network."
 roman_assimilation.34.a:0 "All rivers flow to Rome."
 roman_assimilation.34.b:0 "Let them keep their own customs."

 roman_assimilation.35.t:0 "The Romanization of the Highland Provinces"
 roman_assimilation.35.d:0 "In the cloud-wreathed valleys of the southwest the impossible has been achieved. Massive multi-tiered aqueducts and viaducts span the mist-filled gorges connecting mountain tribes that were once isolated for centuries. The terrace farming of the locals has been reinforced with Roman engineering allowing rice and grapes to grow on the steepest slopes. The diverse tribes have found unity under the cult of Juno whom they identify with their own mountain mother goddess. The Iunnians are a people of the peaks. They are miners and farmers who have learned that with enough stone and will even the mountains bow to Rome."
 roman_assimilation.35.a:0 "Bridges over the clouds."
 roman_assimilation.35.b:0 "Let them keep their mountain ways."

 roman_assimilation.36.t:0 "The Romanization of the Roof of the World"
 roman_assimilation.36.d:0 "The air is thin here but the ambition of Rome breathes freely. In the highest inhabited lands on earth the legionary spade has carved roads into the eternal ice. The great monasteries that cling to the cliff sides are now warmed by hypocaust systems allowing the monks to study Latin texts alongside their sutras through the deepest winter. A unique syncretism has occurred where the Emperor is revered as a Bodhisattva of Order and Jupiter is worshipped as the Lord of the Sky. The Caelarians are the guardians of the high passes. They look down upon the world with the serene confidence of those who dwell where the earth meets the heavens."
 roman_assimilation.36.a:0 "Rome touches the sky."
 roman_assimilation.36.b:0 "Let them keep their celestial solitude."

 roman_assimilation.37.t:0 "The Romanization of the Golden East"
 roman_assimilation.37.d:0 "The dense green wall of the jungle has been pierced by the straight line of the Roman road. In the Mekong delta the ancient irrigation techniques of the locals have been supercharged by Roman hydraulic engineering creating a breadbasket of rice that rivals Egypt. The cities here are a stunning vision of red brick and sandstone where the distinct towers of the Khmer style are topped with Roman domes. Elephants now walk the paved streets bearing magistrates in silk togas and the scent of fish sauce and garum mingles in the air. The Indorians are a people who have carved a civilization of order out of the chaos of the tropics."
 roman_assimilation.37.a:0 "The Jungle bows to the Surveyor."
 roman_assimilation.37.b:0 "Let them keep their native ways."

 roman_assimilation.38.t:0 "The Romanization of the Malay Coast"
 roman_assimilation.38.d:0 "The Romans have finally tamed the Golden Chersonese. The strategic straits are now lined with massive stone lighthouses modeled after the Pharos guiding merchant fleets through the treacherous shoals. The local Orang Laut sea nomads have been integrated into the Imperial Navy serving as the finest scouts in the fleet. The port cities consist of warehouses built on stone pilings where spices from the east are taxed and cataloged by Latin speaking clerks. The Euricians are the masters of the monsoon. They combine the navigational genius of the Austronesians with the commercial appetite of the Forum."
 roman_assimilation.38.a:0 "The Gate of the East is locked by Rome."
 roman_assimilation.38.b:0 "Let them keep their seafaring traditions."

 roman_assimilation.39.t:0 "The Romanization of the Island Seas"
 roman_assimilation.39.d:0 "Far beyond the known horizon the legions have planted the Eagle on the Spice Islands. The immense distance has created a unique maritime culture where the villa rustica is built upon stilts over crystal blue waters. The wealth generated here is staggering as cloves and nutmeg are harvested on industrial plantations managed by Roman botanists. The islanders have embraced Neptune as their supreme deity building shrines of coral stone to appease the typhoons. The Insulians are the furthest children of the Empire living in a tropical paradise that is bound by the iron chain of Roman law."
 roman_assimilation.39.a:0 "A fragrant jewel in the Imperial crown."
 roman_assimilation.39.b:0 "Let them keep their island freedom."

 roman_assimilation.40.t:0 "The Romanization of the Isles of Fire"
 roman_assimilation.40.d:0 "The Roman engineers have found their promised land among the volcanoes of the archipelago. The abundance of volcanic ash has allowed them to produce concrete of superior quality leading to a construction boom that defies the jungle. Massive terrace farms climb the slopes of the fire mountains supported by aqueducts that channel geothermal springs into public baths. The worship of Vulcan has merged with the local reverence for the mountain spirits creating a culture that is both industrious and explosive. The Ignians are the masters of fire utilizing the heat of the earth to forge a civilization of unshakeable strength."
 roman_assimilation.40.a:0 "Concrete forged in volcano fire."
 roman_assimilation.40.b:0 "Let them keep their island traditions."

 roman_assimilation.41.t:0 "The Romanization of the Land of Tranquility"
 roman_assimilation.41.d:0 "In the valley of the Irrawaddy the glint of gold is everywhere. The thousands of stupas that dot the landscape are now joined by marble rotundas and basilicas. A peaceful syncretism has taken hold as the Stoic philosophy of the West finds a natural partner in the Buddhist teachings of the East. The Royal Road has been paved and patrols guard the ruby mines that send tribute to the capital. The Serenians are a people of deep contemplation and quiet dignity who have gilded the pragmatism of Rome with the spiritual devotion of the Golden Land."
 roman_assimilation.41.a:0 "Wisdom flows like the great river."
 roman_assimilation.41.b:0 "Let them keep their tranquil ways."
 
 roman_assimilation.42.t:0 "The Romanization of the Ganges Delta"
 roman_assimilation.42.d:0 "The endless waterways of the delta have been disciplined by the greatest hydraulic engineers in history. The shifting mud banks are now reinforced with Roman pilings and concrete allowing for permanent stone cities to rise above the floodplains. The distinct terracotta architecture of the region has evolved as local bricklayers now construct vast libraries and basilicas using the Roman arch. In the academies the logic of Nyaya philosophy is debated in Latin and the poets compose epics that blend the Ramayana with the Aeneid. The Bengarians have ushered in a golden age where the intellect is valued as highly as the sword."
 roman_assimilation.42.a:0 "A Renaissance of brick and mind."
 roman_assimilation.42.b:0 "Let them follow their own muse."

 roman_assimilation.43.t:0 "The Romanization of the Land of Dharma"
 roman_assimilation.43.d:0 "The vast plains of the Ganges have become the new parade ground of the Empire. The ancient political science of the Arthashastra has been merged with the legal rigidity of the Twelve Tables creating a state of terrifying efficiency. The skyline of the holy cities has changed as the towering Shikharas of the temples are now flanked by the domes of the Pantheon style. The Emperor is hailed here not just as a Princeps but as a Chakravartin the universal ruler who turns the wheel of law. The Bharatians are the synthesis of two imperial giants heirs to a civilization where wisdom is as sacred as power."
 roman_assimilation.43.a:0 "The Ganges is the new Tiber."
 roman_assimilation.43.b:0 "Let them keep their sacred ways."

 roman_assimilation.44.t:0 "The Romanization of the Hindus Frontier"
 roman_assimilation.44.d:0 "The gateway to India has been paved with Roman stone. The arid coast is now lined with massive warehouses or horrea where the wealth of the world is stored before shipping to Rome. The famous stepwells of the region are now built with classical colonnades and Roman hydraulic pumps turn the dry earth into lush gardens. The merchant princes of Gujarat have adopted the toga but weave it from the finest cotton and gold thread. The Marutians are a people of the ledger and the sail who have realized that the Pax Romana is the most profitable venture in history."
 roman_assimilation.44.a:0 "Trade flows where the Legion goes."
 roman_assimilation.44.b:0 "Let them keep their desert ways."

 roman_assimilation.45.t:0 "The Romanization of the Deccan Plateau"
 roman_assimilation.45.d:0 "In the rugged heart of the peninsula the Roman passion for building has met the Indian genius for carving. Instead of building up with concrete the architects here have dug down carving monolithic basilicas and senate houses directly into the living basalt cliffs. These indestructible structures feature Roman proportions but are adorned with the intricate relief sculptures of the Dravidian style. The hill forts have been connected by high viaducts that span the deep valleys of the Ghats. The Dravinians are a people hewn from the earth itself solid, enduring, and monumentally grand."
 roman_assimilation.45.a:0 "Rome carved into living rock."
 roman_assimilation.45.b:0 "Let them follow their sacred craft."

 roman_assimilation.46.t:0 "The Romanization of the Coral Coast"
 roman_assimilation.46.d:0 "On the sunlit shores of the south the Empire has found its reflection in beauty. The towering Gopurams of the temples are now entered through Triumphal Arches celebrating the victories of peace. The pearl fisheries are managed by imperial prefects and the great artificial tanks irrigate the rice paddies with mathematical precision. The Sangam poetry is now written in Latin script and celebrates the glory of the Emperor with the imagery of the monsoon and the sea. The Corallians are the radiant children of the sun who have turned the administration of the empire into a high art form."
 roman_assimilation.46.a:0 "A symphony of salt and stone."
 roman_assimilation.46.b:0 "Let them keep their radiant ways."

 roman_colonial_culture_pot.1.t:0 "Adoption of the Nilassian Identity"
 roman_colonial_culture_pot.1.d:0 "The sun of the south burns hot but the discipline of our administration is cool and ordered. The colonial governors have ceased to look longingly back at the Mediterranean and have instead turned their eyes to the immense potential of the Upper Nile. In the great halls of the capital the toga is now worn with the heavy gold jewelry of the Kushite kings and Roman law is administered by magistrates who respect the ancient traditions of the Meroitic throne. The palace itself is a symbol of this new era where the steep pyramids of the ancestors are reflected in the marble pools of Roman atriums. We are no longer merely a colony of strangers guarding a frontier. We are the guardians of the southern gate and the masters of the black earth. We are Nilassians."
 roman_colonial_culture_pot.1.a:0 "We are the Rome of the South."
 roman_colonial_culture_pot.1.b:0 "Retain our ancestral ways."

 roman_colonial_culture_pot.2.t:0 "Cultural Integration along the Nile"
 roman_colonial_culture_pot.2.d:0 "The transformation of the province is visible in the very flow of the water. Roman hydraulic engineers have improved the ancient shadufs and water wheels with gears of brass and iron turning the banks of the river into a continuous garden of efficiency. The smoke of the iron foundries rises into the clear sky as the famous ores of Meroe are forged into gladius and pilum. In the marketplaces the distinct pottery of the region is now stamped with Latin seals of quality and the famous archers of the south drill in the disciplined maniples of the legion. The common people no longer see Rome as a distant conqueror but as the builder of their new stone cities. They speak a dialect that blends the sharp commands of Latin with the rhythmic tones of the Sudan."
 roman_colonial_culture_pot.2.a:0 "Iron, gold, and marble."
 roman_colonial_culture_pot.2.b:0 "Let local customs persist."

 roman_colonial_culture_pot.3.t:0 "Adoption of the Aurelian Identity"
 roman_colonial_culture_pot.3.d:0 "The rough frontier camps have given way to a civilization of granite and gold that belongs to this soil alone. The colonial governors and tribal kings now sit together in a Senate that values the strength of the warrior as much as the rhetoric of the politician. We have ceased to look to Italy for validation; our monuments are the deep mines and the massive dry-stone walls that now encircle our Roman forums. We remain loyal to the Eagle, but our spirit is forged by the Veld. We are the Aurelians, and we have built a new Rome of the South."
 roman_colonial_culture_pot.3.a:0 "Gold and Iron, Rome and Africa."
 roman_colonial_culture_pot.3.b:0 "Preserve the ancient ways."

 roman_colonial_culture_pot.4.t:0 "Cultural Integration of the South"
 roman_colonial_culture_pot.4.d:0 "The transformation of the province is found in the daily rhythm of the people. In the mining towns the public baths are heated by the same coal that fuels the smelters creating a culture of communal leisure after hard labor. The herdsmen of the interior now measure their cattle wealth in Roman sestertii and pave the paths between their kraals with stone. A new dialect has emerged in the taverns where local beef is roasted over open fires and washed down with vintage wine. The Aurelians are a people of the earth who have learned that Roman order makes the land yield even greater riches."
 roman_colonial_culture_pot.4.a:0 "A fusion forged in the mines."
 roman_colonial_culture_pot.4.b:0 "Respect their local customs."

 roman_colonial_culture_pot.5.t:0 "Adoption of the Zambyrian Identity"
 roman_colonial_culture_pot.5.d:0 "A new court has risen overlooking the great delta, one that resembles a Roman praetorium yet operates with the fluidity of the river clans. The magistrates here wear the toga, but they govern with the wisdom of the Madagascar kings and the Zambezi river-lords. They have forged a peace that relies not on legions sent from afar, but on a shared destiny between the Great Red Island and the mainland. We are no longer strangers in a tropical land; we are the Zambyrians, the Roman soul of the Indian Ocean, masters of our own currents."
 roman_colonial_culture_pot.5.a:0 "The River and the Island are one."
 roman_colonial_culture_pot.5.b:0 "Preserve our ancestral ways."

 roman_colonial_culture_pot.6.t:0 "Cultural Integration of the Zambezi"
 roman_colonial_culture_pot.6.d:0 "The spirit of the Empire now flows as surely as the great river itself. The massive waterfalls are bypassed by systems of Roman locks allowing trade to reach the deep interior for the first time in history. On the Great Island the ancient practice of terrace farming has been perfected with the introduction of the aqueduct and the siphon turning the hills into cascading gardens. In the villages the elders settle disputes using the Twelve Tables but the sentences are carried out with the rhythm of local tradition. The Zambyrians have woven the rigidity of stone and the fluidity of water into a single vibrant culture."
 roman_colonial_culture_pot.6.a:0 "The water binds us together."
 roman_colonial_culture_pot.6.b:0 "Respect their traditions."

 roman_colonial_culture_pot.7.t:0 "Adoption of the Azanian Identity"
 roman_colonial_culture_pot.7.d:0 "The merchant princes of the coast have evolved into a distinct patrician class, one that owes its wealth to the monsoon rather than the Tiber. They have constructed a new Senate of white coral stone where Roman law is interpreted through the lens of ancient maritime tradition. These Azanians do not wait for the seasonal fleets to bring them culture; they have built their own here, a civilization of trade and wind that stands equal to any in the Mediterranean. They serve the Empire, but they rule the coast with a sovereign grace."
 roman_colonial_culture_pot.7.a:0 "The Coral Cities stand proud."
 roman_colonial_culture_pot.7.b:0 "Preserve our ancestral ways."

 roman_colonial_culture_pot.8.t:0 "Cultural Integration along the Swahili Coast"
 roman_colonial_culture_pot.8.d:0 "The narrow winding alleys of the coastal cities have been paved and organized into districts of commerce and residence. The distinct coral masonry of the region is now strengthened with Roman concrete allowing for multi-story insulae that catch the ocean breeze. In the harbor the dhows are rigged with Roman sails and navigated by captains who chart the stars using Latin names. The common people have adopted the tunic but dyed in the vibrant indigo and ochre of the coast. The Azanians are the children of the monsoon who have found a steady anchor in the laws of Rome."
 roman_colonial_culture_pot.8.a:0 "A civilization of wind and stone."
 roman_colonial_culture_pot.8.b:0 "Respect their native customs."

 roman_colonial_culture_pot.9.t:0 "Adoption of the Axiomian Identity"
 roman_colonial_culture_pot.9.d:0 "The high nobility of the mountains has declared that the legacy of Solomon and the legacy of Romulus are destined to merge. In the mountain capital the ancient stelae of the ancestors now stand alongside triumphal arches of white marble creating a skyline of unmatched verticality. The ruling Negus has adopted the title of Augustus proclaiming that the mountain passes are the walls of a fortress that protects the true faith and the true law. We are the Axiomians. We do not bow to Rome we stand shoulder to shoulder with it as the guardians of the Red Sea and the keepers of the Ark of Civilization."
 roman_colonial_culture_pot.9.a:0 "Two ancient lines become one."
 roman_colonial_culture_pot.9.b:0 "Preserve our ancestral ways."

 roman_colonial_culture_pot.10.t:0 "Cultural Integration of the Highlands"
 roman_colonial_culture_pot.10.d:0 "The thin air of the highlands carries the sound of a new liturgy. In the valleys architects have carved basilicas directly into the living rock blending the monolithic style of the ancestors with the vaulted ceilings of the Latins. The smell of frankincense drifts through markets where Roman coins are exchanged for coffee and ivory. The common people have woven the toga into their traditional shammas creating a garment that is both practical for the mountains and dignified for the forum. The Axiomian identity is carved in stone and written in the dual script of Ge'ez and Latin."
 roman_colonial_culture_pot.10.a:0 "Faith carved in living rock."
 roman_colonial_culture_pot.10.b:0 "Respect their native customs."

 roman_colonial_culture_pot.11.t:0 "Adoption of the Congorian Identity"
 roman_colonial_culture_pot.11.d:0 "The river lords have convened in a great council to reorganize the administration of the rainforest. They have declared that the Great River is the Via Appia of the south a moving highway that unites the deep interior with the sea. The colonial governors have abandoned their fear of the jungle and now rule from palaces of tropical hardwood built on Roman stone foundations. We have mastered the Green Hell and turned it into a garden of Empire. We are the Congorians and our power flows as endlessly and forcefully as the mighty waters that sustain us."
 roman_colonial_culture_pot.11.a:0 "The River is our Road."
 roman_colonial_culture_pot.11.b:0 "Preserve our ancestral ways."

 roman_colonial_culture_pot.12.t:0 "Cultural Integration along the River"
 roman_colonial_culture_pot.12.d:0 "The banks of the mighty river are now lined with stone quays where massive barges dock to unload grain and iron. Roman engineers have cut paved causeways through the dense canopy connecting the riverside towns to the resource-rich interior. In the humidity of the basin the mosaic floors of the villas depict not scenes of Italy but the elephants and leopards of the forest. The people speak a trade-latin that flows with the rhythmic cadence of the river tongues. The Congorians have built a civilization where the discipline of the legion meets the wild abundance of the tropics."
 roman_colonial_culture_pot.12.a:0 "Order brought to the deep green."
 roman_colonial_culture_pot.12.b:0 "Respect their native customs."

 roman_colonial_culture_pot.13.t:0 "Adoption of the Zandrian Identity"
 roman_colonial_culture_pot.13.d:0 "We stand at the crossroads of the continent where the sand of the north meets the green of the south. The tribal confederations have coalesced into a centralized state that combines the mobility of the caravan guard with the entrenchment of the legionary. The new citadel at the edge of the Great Lake is built of fired brick and Roman concrete symbolizing our permanence in this shifting landscape. We are the Zandrians the hinge upon which the trade of Africa turns. We do not merely survive the harsh interior we govern it with a steady hand."
 roman_colonial_culture_pot.13.a:0 "The Heart of the Continent beats with Roman blood."
 roman_colonial_culture_pot.13.b:0 "Preserve our ancestral ways."

 roman_colonial_culture_pot.14.t:0 "Cultural Integration of the Heartlands"
 roman_colonial_culture_pot.14.d:0 "The sprawling markets of the savanna cities have been organized into colonnaded squares where the goods of the forest are traded for the salt of the desert. The distinctive mud-brick architecture of the Sahel is now reinforced with Roman arches allowing for structures of unprecedented height and durability. In the armories the blacksmiths forge weapons that combine the reach of the pilum with the balance of the throwing knife. The Zandrian people are the ultimate intermediaries comfortable in both the saddle and the senate house."
 roman_colonial_culture_pot.14.a:0 "A fortress of brick and will."
 roman_colonial_culture_pot.14.b:0 "Respect their native customs."

 roman_colonial_culture_pot.15.t:0 "Adoption of the Nigerran Identity"
 roman_colonial_culture_pot.15.d:0 "The Governors of the River Basin have ceased to view this land as a remote outpost. They have recognized that the great Niger is a sister to the Tiber, an artery of life that demands a capital worthy of its power. The administration has begun to construct a new style of palace, blending the high mud-brick towers of the Sahelian tradition with the structural integrity of Roman concrete. The local Emirs and the Colonial Prefects now sit together in cool, adobe-walled council chambers, declaring that they are the Lords of the River. We are the Nigerrans, and we hold the key to the continent's interior."
 roman_colonial_culture_pot.15.a:0 "The River of Rivers flows to Rome."
 roman_colonial_culture_pot.15.b:0 "Preserve our ancestral ways."

 roman_colonial_culture_pot.16.t:0 "Cultural Integration of the Niger Basin"
 roman_colonial_culture_pot.16.d:0 "The bustling river ports are a hive of fusion and industry. The distinct terracotta art style of the region has been adopted by local potters to create busts of the Emperors, which are sold in markets from the Delta to the deep interior. Massive barges, designed by Roman shipwrights but built of local timber, carry salt and grain along the river highway. The famous city walls of the region have been reinforced with Roman gates and watchtowers. The common people, thriving on this commerce, have adopted a culture that is as fluid and powerful as the waters that sustain them."
 roman_colonial_culture_pot.16.a:0 "Terracotta and Marble."
 roman_colonial_culture_pot.16.b:0 "Respect their native customs."

 roman_colonial_culture_pot.17.t:0 "Adoption of the Maravian Identity"
 roman_colonial_culture_pot.17.d:0 "The immense wealth of the Gold and Ivory coasts has created a colonial aristocracy of staggering opulence. These merchant-princes have built open-air villas designed to catch the sea breeze, adorned with pure gold leaf and ivory inlays that would bankrupt a Senator in Rome. They have declared that this coast is not merely a resource depot, but the commercial heart of the Atlantic. The Maravian identity is one of supreme confidence, born of the belief that while Rome may have the legions, the Maravians have the gold that pays them."
 roman_colonial_culture_pot.17.a:0 "The Golden Coast is the Empire's treasury."
 roman_colonial_culture_pot.17.b:0 "Preserve our ancestral ways."

 roman_colonial_culture_pot.18.t:0 "Cultural Integration of the Coastlands"
 roman_colonial_culture_pot.18.d:0 "The dense forests have been pushed back by the axe and the road, revealing a civilization of vibrant energy. The worship of Neptune has taken on a local flavor, with the sea god depicted holding a trident of ivory and calming the tropical surf. In the port cities, the noise of the carpenter's saw is constant as great merchant ships are constructed from tropical hardwoods. The people here have merged the festive, drum-driven music of the coast with the structured festivals of the Roman calendar. To be Maravian is to live at the joyous intersection of the forest and the sea."
 roman_colonial_culture_pot.18.a:0 "Neptune guards the Ivory Coast."
 roman_colonial_culture_pot.18.b:0 "Respect their native customs."

 roman_colonial_culture_pot.19.t:0 "Adoption of the Saharanian Identity"
 roman_colonial_culture_pot.19.d:0 "The colonial administration here faces the Atlantic on one side and the endless sands on the other, creating a breed of leader known for stoic endurance. The governors have integrated the desert clan-leaders into the state apparatus, creating a mobile Senate that can govern from the saddle of a camel as easily as from a curule chair. They have declared that the frontier is not a barrier, but a bridge to the worlds beyond the sand. The Saharians are the iron-willed wardens of the West, combining the silence of the desert with the thunder of the legion."
 roman_colonial_culture_pot.19.a:0 "Salt, Sand, and Senate."
 roman_colonial_culture_pot.19.b:0 "Preserve our ancestral ways."

 roman_colonial_culture_pot.20.t:0 "Cultural Integration of the Western Frontier"
 roman_colonial_culture_pot.20.d:0 "The harshness of the environment has been tamed by Roman ingenuity. Deep wells and aqueducts have turned scattered oases into permanent towns where date palms grow in orderly rows. The camel cavalry, heavily armored in the Roman fashion, patrols the caravan routes, ensuring that the Pax Romana extends to the dunes. In the coastal cities of Senegambia, the salt trade is regulated by Latin contracts, and the people wear hooded cloaks that protect against both the sun and the salt spray. The Saharian people are the hardened survivors who have made the desert bloom with Roman order."
 roman_colonial_culture_pot.20.a:0 "The desert is a Roman province."
 roman_colonial_culture_pot.20.b:0 "Respect their native customs."

 roman_colonial_culture_pot.21.t:0 "Adoption of the Mandian Identity"
 roman_colonial_culture_pot.21.d:0 "The Lords of the Sands have convened in a capital that glitters with the wealth of the earth. The colonial governors, realizing that the gold of the Niger dwarfs the treasury of Rome, have adopted the regalia of the Mansa. They have built a new society where the Great Library of the desert rivals the archives of the Eternal City. The architecture here is unique, blending the grand adobe towers of the Sahel with the marble columns of the Forum. We are the Mandians, the golden scholars of the West, and we do not beg for funding from the Emperor; we lend to him."
 roman_colonial_culture_pot.21.a:0 "A Golden Age written in sand and stone."
 roman_colonial_culture_pot.21.b:0 "Preserve our ancestral ways."

 roman_colonial_culture_pot.22.t:0 "Cultural Integration of the Desert Kingdoms"
 roman_colonial_culture_pot.22.d:0 "The vast emptiness of the Sahara has been conquered by the discipline of the Roman road and the endurance of the camel. The caravan routes are now paved highways where tuition for the universities is paid in gold dust and salt. In the indigo tents of the nomads, the poetry of Virgil is recited alongside ancient desert epics. The distinct mud-brick architecture of the cities has been reinforced with Roman engineering, allowing for basilicas that scrape the sky. The Mandian people are the wealthy guardians of wisdom who have turned the desert into a garden of the mind."
 roman_colonial_culture_pot.22.a:0 "Salt is the price of wisdom."
 roman_colonial_culture_pot.22.b:0 "Respect their native customs."

 roman_colonial_culture_pot.23.t:0 "Adoption of the Rubrian Identity"
 roman_colonial_culture_pot.23.d:0 "The colonial elite have looked upon the endless forests of 'Pau-Brasil' and realized their future lies in the red dye that stains the fingers and the soul. They have ceased to be mere loggers for the Empire and have become the Barons of the Red Coast. The Governor's residence is a sprawling complex of tropical hardwood and stone, open to the Atlantic breeze but grounded in Roman law. We have named ourselves the Rubrians, the People of the Red, for we have tamed the wild coast and turned its vibrant blood into the purple of a new nobility."
 roman_colonial_culture_pot.23.a:0 "The Red Coast is our Rome."
 roman_colonial_culture_pot.23.b:0 "Preserve our ancestral ways."

 roman_colonial_culture_pot.24.t:0 "Cultural Integration of the Red Coast"
 roman_colonial_culture_pot.24.d:0 "The dense Atlantic forest is no longer a wall of green but a resource managed by the state. Roman surveyors have mapped the dye-wood groves and established plantations that stretch to the horizon. The settlers have adopted the indigenous hammock, finding it superior to the Roman bed in this heat, while the natives have adopted the iron axe and the Latin tongue. In the port cities, the vats of red dye bubble constantly, and the ships leave with hulls stained by the wealth of the province. The Rubrians are a people of the forest frontier, vibrant, resilient, and wealthy."
 roman_colonial_culture_pot.24.a:0 "A civilization carved from the jungle."
 roman_colonial_culture_pot.24.b:0 "Respect their native customs."

 roman_colonial_culture_pot.25.t:0 "Adoption of the Argentian Identity"
 roman_colonial_culture_pot.25.d:0 "The Silver River flows into an ocean of grass that reminds the settlers of a vaster, wilder Italy. The colonial magistrates have declared that this land is not a colony to be exploited, but a second home to be cherished. They have founded a new Senate on the banks of the Rio de la Plata, dedicated to the management of the immense silver wealth flowing from the mountains and the cattle herds that roam the Pampas. We are the Argentians, the Silver People, and we have built a polished mirror of Rome in the southern hemisphere."
 roman_colonial_culture_pot.25.a:0 "The Silver River flows to a new Sea."
 roman_colonial_culture_pot.25.b:0 "Preserve our ancestral ways."

 roman_colonial_culture_pot.26.t:0 "Integration of the Silver Provinces"
 roman_colonial_culture_pot.26.d:0 "The endless plains of the Pampas are now crisscrossed by the straight lines of Roman roads, connecting vast ranching estates, or latifundia, to the bustling ports. The cowboy culture of the plains has merged with the cavalry traditions of the Legion, creating a peerless force of mounted herdsmen. In the cities, the temperate climate allows for a lifestyle almost identical to that of Italy, with vineyards and olive groves flourishing under the southern cross. The Argentians are the prosperous children of the silver rush and the fertile soil."
 roman_colonial_culture_pot.26.a:0 "Rome reborn under new stars."
 roman_colonial_culture_pot.26.b:0 "Respect their native customs."

 roman_colonial_culture_pot.27.t:0 "Adoption of the Alturian Identity"
 roman_colonial_culture_pot.27.d:0 "In the thin air of the high Andes, the colonial administration has undergone a profound transformation. The governors have realized that Roman concrete, while strong, cannot match the earthquake-proof precision of local stonemasonry. They have commissioned a new capital where the Senate House is built of massive, interlocking granite blocks, yet entered through a classical Roman arch. The ruling class now wears the vicuna wool of the Inca nobility draped like a toga. We are the Alturians, the People of the Heights, and we look down upon the world from a throne carved into the very spine of the earth."
 roman_colonial_culture_pot.27.a:0 "Rome rules from the clouds."
 roman_colonial_culture_pot.27.b:0 "Preserve our ancestral ways."

 roman_colonial_culture_pot.28.t:0 "Integration of the Highland Provinces"
 roman_colonial_culture_pot.28.d:0 "The Royal Road of the mountains, the Qhapaq Nan, has been paved with Roman milestones, creating a highway system that rivals Italy itself. Along these roads, llamas carry amphorae of wine and olive oil to towns perched on terraced cliffs. The Quipu knot-records are now used to track Imperial taxes, read by clerks who speak Latin with the soft cadence of the Quechua tongue. The Alturians have mastered the vertical world, using Roman aqueducts to channel glacial meltwater onto terraces that feed a population growing in the safety of the peaks."
 roman_colonial_culture_pot.28.a:0 "Stone, Sky, and Senate."
 roman_colonial_culture_pot.28.b:0 "Respect their native customs."

 roman_colonial_culture_pot.29.t:0 "Adoption of the Granarian Identity"
 roman_colonial_culture_pot.29.d:0 "The legends of a Golden King have been replaced by the reality of a Golden Province. The magistrates of the northern cordilleras have amassed wealth in emeralds and gold that rivals the treasury of the East. They have established a new high-altitude society that values the abundance of the land above all else. The Governor's palace is a marvel where the cool mists of the mountains meet the warm luxury of the hypocaust. We are the Granarians, the keepers of the immense garden that lies between the two oceans, and we have built a paradise that requires no myths to sustain it."
 roman_colonial_culture_pot.29.a:0 "El Dorado is a Roman province."
 roman_colonial_culture_pot.29.b:0 "Preserve our ancestral ways."

 roman_colonial_culture_pot.30.t:0 "Integration of the Highland Provinces"
 roman_colonial_culture_pot.30.d:0 "The steep valleys have been bridged by daring feats of engineering, connecting the hot, fertile lowlands with the cool, administrative highlands. In the markets, the bounty of the tropics—cacao, corn, and exotic fruits—is sold by merchants who follow the Roman commercial code. The people have adapted to the vertical geography, living in towns of white stone that gleam against the lush green of the mountains. The Granarian identity is one of plenty, a culture that feasts on the richness of the earth while protected by the shield of Rome."
 roman_colonial_culture_pot.30.a:0 "The garden of the Andes blooms."
 roman_colonial_culture_pot.30.b:0 "Respect their native customs."

 roman_colonial_culture_pot.31.t:0 "Adoption of the Itzalian Identity"
 roman_colonial_culture_pot.31.d:0 "The Eagle of the Legion has met the Eagle of the Cactus, and they have recognized each other as kin. The colonial elite have moved into the vast palace complexes of the existing cities, impressed by a scale of urbanism that rivals Alexandria and Antioch. They have founded a new order where the 'Flower Wars' are ritualized into gladiatorial games of immense spectacle. The Tlatoani and the Governor have become one figure, ruling from a dais of jade and obsidian. We are the Itzalians, heirs to the pyramid and the forum, and our civilization bleeds with the vitality of the sun."
 roman_colonial_culture_pot.31.a:0 "The Sun Stone and the Senate."
 roman_colonial_culture_pot.31.b:0 "Preserve our ancestral ways."

 roman_colonial_culture_pot.32.t:0 "Integration of the Mexican Provinces"
 roman_colonial_culture_pot.32.d:0 "The great lake cities have been transformed. The floating gardens, or chinampas, are now organized with Roman hydraulic precision, feeding a population of millions. In the vast marketplaces, the barter of cacao beans happens alongside the exchange of silver denarii. The ball courts have been expanded into amphitheaters where the crowds cheer in a hybrid dialect of Nahuatl and Latin. The Itzalian people have synthesized the obsession with cosmic order of the ancients with the civic duty of the Romans, creating a society of terrifying beauty and strength."
 roman_colonial_culture_pot.32.a:0 "Obsidian blades and Iron discipline."
 roman_colonial_culture_pot.32.b:0 "Respect their native customs."

 roman_colonial_culture_pot.33.t:0 "Adoption of the Pelagian Identity"
 roman_colonial_culture_pot.33.d:0 "The Governors of the Isles have gathered in a council that smells of salt spray and expensive spices. They have realized that the Mediterranean is the past, and this turquoise sea is the future. They have begun to build a naval state that rivals the legendary power of Carthage, constructing a new capital on the coast where the Governor's palace is built of white coral and guarded by marines who know every reef and shoal. We are the Pelagians, the People of the Open Sea, and we declare that this ocean is no longer a barrier, but a Roman lake—a Mare Nostrum Novum."
 roman_colonial_culture_pot.33.a:0 "A New Carthage rises from the waves."
 roman_colonial_culture_pot.33.b:0 "Preserve our ancestral ways."

 roman_colonial_culture_pot.34.t:0 "Integration of the Island Provinces"
 roman_colonial_culture_pot.34.d:0 "The islands have been stitched together by a web of lighthouses and stone causeways that defy the hurricanes. In the harbors, the sleek hulls of Roman triremes lie alongside the fast canoes of the locals, creating a hybrid fleet of terrifying speed. The cities are built low and sturdy to weather the storms, with cisterns that catch the tropical rains. The common people, a mix of every nation of the empire, live a life governed by the tides and the trade winds. The Pelagians have mastered the art of building a stone empire on shifting sands."
 roman_colonial_culture_pot.34.a:0 "The Trident is our scepter."
 roman_colonial_culture_pot.34.b:0 "Respect their native customs."

 roman_colonial_culture_pot.35.t:0 "Adoption of the Elysian Identity"
 roman_colonial_culture_pot.35.d:0 "The magistrates of the new continent have looked upon the endless virgin forests and fertile valleys and seen a chance to build Rome anew, without the corruption of the Old World. They have adopted the council fires of the native confederacies into their own political structure, creating a localized Senate that emphasizes liberty and natural law. The architecture here reflects this rustic idealism; great colonnaded halls are built from the massive timber of the ancient woods, resembling temples to nature itself. We are the Elysians, living in the Paradise of Heroes, and we are the keepers of the true Roman spirit."
 roman_colonial_culture_pot.35.a:0 "A Virtuous Republic in the forest."
 roman_colonial_culture_pot.35.b:0 "Preserve our ancestral ways."

 roman_colonial_culture_pot.36.t:0 "Integration of the Elysian Provinces"
 roman_colonial_culture_pot.36.d:0 "The integration of the province is visible in the fields, where the Roman practice of crop rotation meets the native 'Three Sisters' agriculture of corn, beans, and squash. The longhouses of the tribes have evolved into timber villas that house extended families in communal prosperity. Wampum belts are used alongside Roman currency to record treaties and debts, honored by magistrates who speak Latin with the gravity of the forest sachems. The Elysians have created a society of abundance and peace, a garden civilization at the edge of the known world."
 roman_colonial_culture_pot.36.a:0 "Harmony in the endless woods."
 roman_colonial_culture_pot.36.b:0 "Respect their native customs."

 roman_colonial_culture_pot.37.t:0 "Adoption of the Fluvian Identity"
 roman_colonial_culture_pot.37.d:0 "The River Lords of the interior have declared that they rule the 'Nile of the West.' The sheer scale of the Mississippi and Missouri has inspired a grandiose style of governance. The colonial administration has occupied the ancient earthwork mounds of the natives, capping them with stone temples and administrative complexes that overlook the flatlands for miles. They control the flow of grain and goods across a continent, acting as the logistical heart of the New World. We are the Fluvians, and like the river, our power is irresistible, carrying the wealth of nations in our wake."
 roman_colonial_culture_pot.37.a:0 "The Father of Waters flows to Rome."
 roman_colonial_culture_pot.37.b:0 "Preserve our ancestral ways."

 roman_colonial_culture_pot.38.t:0 "Integration of the River Provinces"
 roman_colonial_culture_pot.38.d:0 "The mighty rivers are now choked with barges of Roman design, their decks piled high with grain and furs. The levees have been reinforced with stone, turning the unpredictable floods into managed irrigation for vast latifundia estates. In the river towns, the distinct culture of the Mound Builders lives on in the layout of the cities, which are aligned to the stars and the seasons. The people speak a dialect rich in nautical terms, for even deep inland, life is defined by the water. The Fluvians have tamed the current and made it the engine of their prosperity."
 roman_colonial_culture_pot.38.a:0 "Breadbasket of the New World."
 roman_colonial_culture_pot.38.b:0 "Respect their native customs."

 roman_colonial_culture_pot.39.t:0 "Adoption of the Solarian Identity"
 roman_colonial_culture_pot.39.d:0 "From the sun-baked deserts of the south to the frozen fjords of the north, the Governors of the Sunset Coast have united a land of extremes. They have recognized that this is the final frontier, the very edge of the world where the sun goes to die. They have built a capital that glitters with the gold found in the riverbeds, a 'City of Gold' that makes Rome look drab. The administration has adapted to the land's volatility, ruling with a flexibility that mirrors the shifting earth beneath them. We are the Solarians, the Golden People, and we hold the gate to the Pacific."
 roman_colonial_culture_pot.39.a:0 "The Empire of the Setting Sun."
 roman_colonial_culture_pot.39.b:0 "Preserve our ancestral ways."

 roman_colonial_culture_pot.40.t:0 "Integration of the Coastal Provinces"
 roman_colonial_culture_pot.40.d:0 "The sheer diversity of the province is bound together by the Roman road, the Camino Real, which runs from the cactus deserts to the glacier-fed bays. In the south, vineyards produce wine that rivals Falernian, while in the north, totem poles are carved with the likenesses of Emperors and Eagles. Roman engineers have developed seismic-resistant architecture, using flexible joints and deep foundations to withstand the earth's trembling. The Solarians are a people of boundless optimism and wealth, living in a land of milk, honey, and shaking earth."
 roman_colonial_culture_pot.40.a:0 "Gold, Wine, and Furs."
 roman_colonial_culture_pot.40.b:0 "Respect their native customs."
 
 roman_colonial_culture_pot.41.t:0 "Adoption of the Auroran Identity"
 roman_colonial_culture_pot.41.d:0 "The Governors of the frozen provinces have ceased to look at the winter as an enemy and have embraced it as a fortification. They have constructed a capital of defiance where massive timber halls are insulated with earth and heated by the largest hypocaust systems in the Empire. The administration has declared that the Aurora Borealis is the visible favor of the Gods a celestial banner waving over their domain. We are the Aurorans the Watchers of the North and we guard the roof of the world with a discipline that is as unyielding as the ice itself."
 roman_colonial_culture_pot.41.a:0 "The Legion stands where others freeze."
 roman_colonial_culture_pot.41.b:0 "Preserve our ancestral ways."

 roman_colonial_culture_pot.42.t:0 "Integration of the Northern Provinces"
 roman_colonial_culture_pot.42.d:0 "The struggle for survival has created a uniquely hardy society. The legionaries here patrol on skis and the courier system utilizes sleds drawn by wolf-dogs. In the settlements the architecture is stark and functional with steep roofs to shed the snow and triple-paned mica windows to trap the heat. The people have adopted the fur-lined parkas of the Inuit but wear them over their tunics creating a silhouette that is distinct to the north. The Aurorans are a people of silence and strength who have brought the fire of Rome to the heart of the winter."
 roman_colonial_culture_pot.42.a:0 "Fire and Ice."
 roman_colonial_culture_pot.42.b:0 "Respect their native customs."

 roman_colonial_culture_pot.43.t:0 "Adoption of the Austran Identity"
 roman_colonial_culture_pot.43.d:0 "The sheer scale of this Great Southern Land has inspired a new vision of governance. The colonial magistrates have moved inland building a capital from the red sandstone of the desert that glows like fire at sunset. They have mapped the ancient Songlines of the natives and paved them into Roman roads connecting the vast distances of the continent. The administration prides itself on a rugged self-sufficiency declaring that this is not merely an island but a world unto itself. We are the Austrans the Southern Romans and we have tamed the endless bush with the axe and the aqueduct."
 roman_colonial_culture_pot.43.a:0 "Terra Australis Romana."
 roman_colonial_culture_pot.43.b:0 "Preserve our ancestral ways."

 roman_colonial_culture_pot.44.t:0 "Integration of the Southern Provinces"
 roman_colonial_culture_pot.44.d:0 "The harsh beauty of the outback is now punctuated by the symmetry of civilization. Roman hydraulic engineers have tapped into the artesian basins turning arid scrubland into pastoral estates for millions of sheep. In the cities the eucalyptus groves provide shade for marble forums where the debates are held in a direct and pragmatic dialect of Latin. The indigenous boomerang is now used alongside the pilum in the auxiliary cohorts. The Austrans are a sun-hardened people who have built a prosperous home on the oldest earth in existence."
 roman_colonial_culture_pot.44.a:0 "Order in the Outback."
 roman_colonial_culture_pot.44.b:0 "Respect their native customs."

 roman_colonial_culture_pot.47.t:0 "Adoption of the Neptunian Identity"
 roman_colonial_culture_pot.47.d:0 "The distance between islands has ceased to be a barrier and has become a bridge. The Governors of the Pacific have reorganized the province into a maritime confederacy where the rank of Captain is equal to that of Senator. They have built a new administrative center on the volcanic slopes where the traditional meeting grounds or Marae are paved with Roman mosaic and surrounded by colonnades. We are the Neptunians the Lords of the Blue Continent and we declare that the Pacific is a Roman lake patrolled by the finest navigators history has ever seen."
 roman_colonial_culture_pot.47.a:0 "The Ocean is our Forum."
 roman_colonial_culture_pot.47.b:0 "Preserve our ancestral ways."

 roman_colonial_culture_pot.48.t:0 "Integration of the Oceanic Provinces"
 roman_colonial_culture_pot.48.d:0 "The vast triangle of the Pacific is united by the double-hulled canoe and the Roman sail. In the harbors stone fish weirs sit alongside deep-water quays built to handle imperial galleys. The warrior culture of the Maori has blended with the martial discipline of the Legion creating a terrifying heavy infantry that performs the Haka before battle. Tattoos are now worn by magistrates and merchants alike recording their lineage and their voyages. The Neptunians have married the star-charts of the ancestors with the maps of Rome to rule the waves."
 roman_colonial_culture_pot.48.a:0 "A Thallasocracy of the Stars."
 roman_colonial_culture_pot.48.b:0 "Respect their native customs."
