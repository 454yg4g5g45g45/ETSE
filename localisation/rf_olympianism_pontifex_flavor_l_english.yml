l_english:
 # Event 1
 olympian_flavor.1.t:0 "The Grand Lustratio"
 olympian_flavor.1.d:0 "The Pontifex Maximus has announced the completion of the Lustratio cycle. He has personally led the procession of the sacred animals around the city walls, purifying the capital from spiritual pollution. In a public ceremony at the Temple of Jupiter, the High Priest declared that the Gods are pleased with the current administration. He has offered the formal blessing of the Collegium to the State, strengthening our mandate to rule."
 olympian_flavor.1.a:0 "We accept the Pontiff's blessing."

 # Event 2
 olympian_flavor.2.t:0 "Petition from the Collegium"
 olympian_flavor.2.d:0 "A delegation from the Collegium Pontificum has arrived at the palace. The Pontifex Maximus reports a surplus in the temple tithes this year, but the College is divided on how to sanctify it. The Flamen Martialis argues that the surplus belongs to Mars and should fund military blessings, while the priests of Mercury argue it should be invested in the markets to encourage trade. The Pontifex has deferred the decision to the State."
 olympian_flavor.2.a:0 "Direct the funds to the Cult of Mars."
 olympian_flavor.2.b:0 "Direct the funds to the Cult of Mercury."

 # Event 3
 olympian_flavor.3.t:0 "The Saturnalia"
 olympian_flavor.3.d:0 "Io Saturnalia! The festival of Saturn is upon us. The Pontifex Maximus has declared the holy days, during which social norms are inverted: servants dine with masters, and gambling is legal. The mob is already celebrating in the streets. While this improves public mood, the suspension of business is costly. Some advisors urge us to restrict the festivities to maintain order, even if it angers the priesthood."
 olympian_flavor.3.a:0 "Respect the holy days. Let them revel."
 olympian_flavor.3.b:0 "The State cannot stop. Restrict the celebration."

 # Event 4
 olympian_flavor.4.t:0 "The Pontifex's Decree"
 olympian_flavor.4.d:0 "Tension has arisen between the Palace and the Temple. The Pontifex Maximus has issued a public decree criticizing a recent law, claiming it violates the sacred traditions of Numa Pompilius. He asserts that in matters of morality, the spiritual authority of the Pontiff supersedes the temporal authority of the State. If we submit to his judgment, we gain the support of the devout but weaken the authority of our office. If we ignore him, we risk a rift with the Collegium."
 olympian_flavor.4.a:0 "He speaks for the Gods. We must amend the law."
 olympian_flavor.4.b:0 "The Gods do not write laws. The senate does."

 # Event 5
 olympian_flavor.5.t:0 "The Extinguished Fire"
 olympian_flavor.5.d:0 "A messenger from the Regia has arrived with grave news: the sacred fire of Vesta has gone out. The Pontifex Maximus claims this is a dire omen suggesting the State has lost divine favor. He demands that the treasury fund a massive, costly expiatory ritual to restore the Pax Deorum. However, others suggest that this is merely the negligence of a Vestal Virgin, and that she should be punished according to ancient tradition rather than draining the treasury."
 olympian_flavor.5.a:0 "Pay for the rituals. We cannot risk bad omens."
 olympian_flavor.5.b:0 "It is the Vestal's fault, make her pay."

 # Event 6
 olympian_flavor.6.t:0 "The Blight of Ceres"
 olympian_flavor.6.d:0 "Famine threatens the provinces. The Pontifex Maximus has declared that Ceres is angry and has retreated to her temples to pray. However, prayers do not fill bellies. The people are gathering outside the government granaries, demanding that the State intervene where the Gods have not. We can open the reserves to feed the populace, acting as the provider, or leave the matter to the priesthood and risk unrest."
 olympian_flavor.6.a:0 "Open the granaries. The State provides."
 olympian_flavor.6.b:0 "This is a spiritual matter. Let the priests pray."